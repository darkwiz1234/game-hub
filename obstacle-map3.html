           <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBJECT RUN 🏃 — Map 3: Phantom Abyss 👁️</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');
    * { box-sizing: border-box; }
    body {
        margin: 0; padding: 0; background: #04020a; color: #fff;
        font-family: 'Orbitron', sans-serif; overflow: hidden; user-select: none;
    }
    #game-container {
        position: relative; width: 800px; height: 440px; margin: 30px auto;
        box-shadow: 0 0 35px var(--glow-color, rgba(57, 255, 20, 0.35));
        border: 2px solid var(--theme-color, #39ff1488); border-radius: 10px; overflow: hidden;
        transition: border-color 0.4s, box-shadow 0.4s;
    }
    canvas { display: block; width: 100%; height: 100%; background: #070312; }
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    
    .back-arrow {
        position: absolute; top: 15px; left: 15px; color: var(--theme-color, #39ff14);
        text-decoration: none; display: flex; align-items: center; justify-content: center;
        pointer-events: auto; transition: 0.2s; filter: drop-shadow(0 0 6px currentColor);
    }
    .back-arrow:hover { transform: scale(1.15) translateX(-2px); color: #ff00ea; }

    #progress-container {
        position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
        width: 380px; text-align: center;
    }
    #progress-text {
        font-size: 16px; font-weight: 900; color: var(--theme-color, #39ff14);
        text-shadow: 0 0 10px currentColor; letter-spacing: 2px;
    }
    #progress-bar-bg {
        width: 100%; height: 9px; background: rgba(255, 255, 255, 0.12);
        border: 2px solid var(--theme-color, #39ff14); border-radius: 6px; overflow: hidden; margin-top: 5px;
    }
    #progress-bar-fill { height: 100%; width: 0%; background: var(--theme-color, #39ff14); box-shadow: 0 0 10px currentColor; }
    
    #best {
        position: absolute; top: 14px; right: 20px; font-size: 15px;
        color: var(--theme-color, #39ff14); text-shadow: 0 0 8px currentColor;
    }

    .btn {
        position: absolute; padding: 8px 18px; font-family: 'Orbitron', sans-serif;
        background: #0e071c; border: 2px solid var(--theme-color, #39ff14); color: var(--theme-color, #39ff14);
        font-size: 13px; font-weight: 700; cursor: pointer; pointer-events: auto;
        border-radius: 6px; transition: 0.2s; text-shadow: 0 0 5px currentColor;
    }
    .btn:hover { background: var(--theme-color, #39ff14); color: #000; }
    #pauseBtn { bottom: 15px; right: 15px; }
    #resetBtn { bottom: 15px; right: 110px; }

    #mode-indicator {
        position: absolute; bottom: 18px; left: 20px; font-size: 14px;
        letter-spacing: 1px; color: var(--theme-color, #39ff14);
    }

    #message-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: none; justify-content: center; align-items: center;
        flex-direction: column; background: rgba(6, 2, 14, 0.88); gap: 14px; z-index: 10;
    }
    #message-text { font-size: 38px; color: #ff0055; text-shadow: 0 0 20px #ff0055; margin-bottom: 6px; }
    .msg-btn { position: relative; pointer-events: auto; font-size: 16px; padding: 10px 24px; }
    #hubBtn { border-color: #ff00ea; color: #ff00ea; }
    #hubBtn:hover { background: #ff00ea; color: #000; }
</style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="440"></canvas>
    
    <div id="ui-layer">
        <a href="obstacle.html" class="back-arrow" title="Back to Map Selection">
            <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>

        <div id="progress-container">
            <div id="progress-text">PROGRESS: 0%</div>
            <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
        </div>

        <div id="best">BEST: 0%</div>
        <div id="mode-indicator">VESSEL: CREEP CUBE</div>
        <button id="resetBtn" class="btn">RESET</button>
        <button id="pauseBtn" class="btn">PAUSE</button>

        <div id="message-overlay">
            <div id="message-text">CONSUMED BY SHADOWS</div>
            <button id="overlayActionBtn" class="btn msg-btn">TRY AGAIN</button>
            <button id="hubBtn" class="btn msg-btn" onclick="window.location.href='obstacle.html'">MAP SELECT</button>
        </div>
    </div>
</div>

<audio id="sfx-collision" src="collision.mp3" preload="auto"></audio>
<audio id="sfx-music" src="map3.mp3" loop preload="auto"></audio>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiProgressText = document.getElementById('progress-text');
const uiProgressBar = document.getElementById('progress-bar-fill');
const uiBest = document.getElementById('best');
const uiMode = document.getElementById('mode-indicator');
const pauseBtn = document.getElementById('pauseBtn');
const resetBtn = document.getElementById('resetBtn');
const overlayActionBtn = document.getElementById('overlayActionBtn');
const msgOverlay = document.getElementById('message-overlay');
const msgText = document.getElementById('message-text');
const bgMusic = document.getElementById('sfx-music');
const hitSound = document.getElementById('sfx-collision');

let gameState = 'START';
let bestProgress = parseInt(localStorage.getItem('objectRunMap3Best') || 0);
uiBest.innerText = `BEST: ${bestProgress}%`;

const TILE_SIZE = 40;

/*
  MAP 3 GRID LAYOUT:
  '.' = Air
  '#' = Solid Dungeon Stone / Boundary
  '^' = Floor Spike
  'v' = Ceiling Spike
  'P' = Dimensional Portal (Cube -> Green Ship)
  'M' = Vertically Oscillating Hazard Block
*/
const mapGrid = [
    "##########################################################################################################################################################################################################################################################################################################################################################################################################################################################################################",
    "................................................................................................................................................................#########################..........vvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvv####VVVV....................########################................................................########################..............................########################",
    "................................................................................................................................................................#########################................................................................................................................###V........................########################................................................########################........................M.....########################",
    "................................................................................................................................................................##########################..................................M...................M.....................##....................M............##V.........................########################................................................########################..............................########################",
    "................................................................................................................................................................##########################...............................................................................................................#V............^.............########################................................................########################................^...............VV....................",
    "................................................................................................................................................................###########################..............................................................................................................V............^#..................................C..................................................########################...............^#..................C..................",
    ".....................................................................##.........................................................................................VV..................VV...VV......................#...............................................................M...................................^##..................................C..................................................########################..............^##..................C..................",
    "................................................................##......................................................^.####..................##.....................................P.........................#.........................................M........................................................^###.............########################..##..............####..........................VVVV.....VVVVVV....VVVVV.............^###..................##.......^^........",
    "......................................############.........##............##..............####....................########......##............#......###................................P...........................................................................................................................^####.............########################......##..........VVVV..................................................P...........^####.............########################",
    ".................................###^^############^^^###^^^^^^^^^^^^^^^^^^^^^##.......##^^^^..##.....^^......##^^^^^^^^^^^^^^^^^^^^###...#...#^^^^^^^^^^^###.............^^............P.................^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^........^^^#####.............########################^^^^^^^^^^##.............##......^^.....###..........^^..........##.....P.....^^^^^^#####.............########################",
    "###########################################################################################################################################################################################################################################################################################################################################################################################################################################################################################"
];
let blocks = [];
let spikes = [];
let portals = [];
let movingBlocks = [];
let obstacleXCoords = [];

function parseLevel() {
    blocks = []; spikes = []; portals = []; movingBlocks = []; obstacleXCoords = [];
    const recordedCols = new Set();

    for (let r = 0; r < mapGrid.length; r++) {
        for (let c = 0; c < mapGrid[r].length; c++) {
            let ch = mapGrid[r][c];
            let x = c * TILE_SIZE;
            let y = r * TILE_SIZE;

            if (ch === '#') {
                blocks.push({ x, y, w: TILE_SIZE, h: TILE_SIZE });
                if (r > 0 && r < 10 && !recordedCols.has(c)) {
                    obstacleXCoords.push(x); recordedCols.add(c);
                }
            } else if (ch === '^') {
                spikes.push({ x, y, type: 'up' });
                if (!recordedCols.has(c)) { obstacleXCoords.push(x); recordedCols.add(c); }
            } else if (ch === 'v') {
                spikes.push({ x, y, type: 'down' });
                if (!recordedCols.has(c)) { obstacleXCoords.push(x); recordedCols.add(c); }
            } else if (ch === 'P') {
                portals.push({ x, y: y - 20, w: 32, h: 90 });
            } else if (ch === 'M') {
                movingBlocks.push({ x, y, baseY: y, w: TILE_SIZE, h: TILE_SIZE, dir: 1, range: 60, speed: 1.8 });
                if (!recordedCols.has(c)) { obstacleXCoords.push(x); recordedCols.add(c); }
            }
        }
    }
    obstacleXCoords.sort((a, b) => a - b);
}
parseLevel();

let player = {
    x: 120, y: 320, size: 34,
    vx: 5.8, vy: 0,
    mode: 'RUNNER', // 'RUNNER' or 'SHIP'
    gravity: 0.75, jumpForce: -12.4,
    shipLift: -0.85, shipGravity: 0.55,
    angle: 0, onGround: false
};

let holdingFly = false;
let cameraX = 0;
let particles = [];
let fireTail = [];
let shipCyberSparks = [];
let musicStarted = false;
let currentProgress = 0;
let flashTimer = 0;
let eyeAnimTimer = 0;
const totalObstacles = Math.max(1, obstacleXCoords.length);

function getTheme(pct) {
    if (pct >= 50) {
        // Neon Purple Atmosphere for Ship Flight
        return { main: '#b026ff', glow: 'rgba(176, 38, 255, 0.45)', bg1: '#0d021c', bg2: '#27083b' };
    }
    // Dark Brick / Toxic Glow Atmosphere for Runner
    return { main: '#39ff14', glow: 'rgba(57, 255, 20, 0.45)', bg1: '#04020a', bg2: '#120521' };
}

function resetGame() {
    player = {
        x: 120, y: 320, size: 34,
        vx: 5.8, vy: 0,
        mode: 'RUNNER',
        gravity: 0.75, jumpForce: -12.4,
        shipLift: -0.85, shipGravity: 0.55,
        angle: 0, onGround: false
    };
    holdingFly = false;
    cameraX = 0;
    particles = [];
    fireTail = [];
    shipCyberSparks = [];
    currentProgress = 0;
    uiMode.innerText = "VESSEL: CREEP CUBE";
    gameState = 'PLAYING';
    msgOverlay.style.display = 'none';
    if (musicStarted) { bgMusic.currentTime = 0; bgMusic.play().catch(() => {}); }
}

function die() {
    gameState = 'GAMEOVER';
    hitSound.currentTime = 0; hitSound.play().catch(() => {});
    bgMusic.pause();
    msgText.innerText = "CONSUMED BY SHADOWS";
    overlayActionBtn.innerText = "TRY AGAIN";
    msgOverlay.style.display = 'flex';

    for (let i = 0; i < 24; i++) {
        particles.push({
            x: player.x + player.size / 2, y: player.y + player.size / 2,
            vx: (Math.random() - 0.5) * 13, vy: (Math.random() - 1) * 12,
            size: Math.random() * 8 + 3, rot: Math.random() * Math.PI,
            rotSpeed: (Math.random() - 0.5) * 0.3, life: 1.0,
            color: i % 2 === 0 ? '#39ff14' : '#ff0055'
        });
    }
}

function win() {
    gameState = 'WIN';
    msgText.innerText = "👁️ THE ABYSS HAS BEEN CONQUERED! 👁️";
    msgText.style.color = "#39ff14";
    overlayActionBtn.innerText = "PLAY AGAIN";
    msgOverlay.style.display = 'flex';
}

function handleInputStart() {
    if (gameState === 'START') {
        musicStarted = true;
        bgMusic.play().catch(() => {});
        gameState = 'PLAYING';
    }
    holdingFly = true;
    if (player.mode === 'RUNNER' && player.onGround) {
        player.vy = player.jumpForce;
        player.onGround = false;
    }
}

function handleInputEnd() { holdingFly = false; }

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); handleInputStart(); }
});
window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') handleInputEnd();
});
window.addEventListener('mousedown', (e) => {
    if (e.target.tagName === 'CANVAS') handleInputStart();
});
window.addEventListener('mouseup', handleInputEnd);

function togglePause() {
    if (gameState === 'PLAYING') {
        gameState = 'PAUSED'; bgMusic.pause();
        msgText.innerText = "PAUSED"; msgText.style.color = "#ffffff";
        overlayActionBtn.innerText = "RESUME"; msgOverlay.style.display = 'flex';
    } else if (gameState === 'PAUSED') {
        gameState = 'PLAYING'; bgMusic.play().catch(() => {});
        msgOverlay.style.display = 'none';
    }
}

pauseBtn.addEventListener('click', togglePause);
resetBtn.addEventListener('click', resetGame);
overlayActionBtn.addEventListener('click', () => {
    if (gameState === 'PAUSED') togglePause();
    else resetGame();
});

function update() {
    if (gameState !== 'PLAYING') return;

    eyeAnimTimer += 0.05;

    // Moving hazard blocks
    for (let mb of movingBlocks) {
        mb.y += mb.speed * mb.dir;
        if (Math.abs(mb.y - mb.baseY) > mb.range) mb.dir *= -1;
    }

    // Player Physics & Trail System
    if (player.mode === 'RUNNER') {
        player.vy += player.gravity;
        if (!player.onGround) {
            player.angle += 0.125;
            // Fiery jet arc trail when jumping (matches the reference image)
            fireTail.push({
                x: player.x,
                y: player.y + player.size * 0.7,
                vx: -3.5 - Math.random() * 1.5,
                vy: (Math.random() - 0.5) * 1.5,
                size: Math.random() * 7 + 4,
                life: 1.0
            });
        } else {
            player.angle = Math.round(player.angle / (Math.PI / 2)) * (Math.PI / 2);
        }
    } else { // SHIP FLIGHT MODE
        if (holdingFly) {
            player.vy += player.shipLift;
            if (player.vy < -6.5) player.vy = -6.5;
        } else {
            player.vy += player.shipGravity;
            if (player.vy > 6.5) player.vy = 6.5;
        }
        player.angle = player.vy * 0.08;

        // Toxic Green/Cyan ship particles
        shipCyberSparks.push({
            x: player.x,
            y: player.y + player.size / 2,
            vx: -4 - Math.random() * 2,
            vy: (Math.random() - 0.5) * 2.5,
            size: Math.random() * 5 + 2,
            life: 0.8
        });
    }

    // Portal Touch & Transformation
    for (let pt of portals) {
        if (player.x < pt.x + pt.w && player.x + player.size > pt.x &&
            player.y < pt.y + pt.h && player.y + player.size > pt.y) {
            if (player.mode !== 'SHIP') {
                player.mode = 'SHIP';
                uiMode.innerText = "VESSEL: PHANTOM SHIP";
                flashTimer = 18;
                player.angle = 0;
            }
        }
    }

    // Horizontal Movement & Collisions
    player.x += player.vx;
    for (let b of blocks.concat(movingBlocks)) {
        if (player.x < b.x + b.w && player.x + player.size > b.x &&
            player.y < b.y + b.h && player.y + player.size > b.y) {
            die(); return;
        }
    }

    // Vertical Movement & Collisions
    player.y += player.vy;
    player.onGround = false;
    for (let b of blocks.concat(movingBlocks)) {
        if (player.x < b.x + b.w && player.x + player.size > b.x &&
            player.y < b.y + b.h && player.y + player.size > b.y) {
            if (player.mode === 'SHIP') {
                die(); return; // Ship mode direct crash
            }
            if (player.vy > 0 && player.y + player.size - player.vy <= b.y + 14) {
                player.y = b.y - player.size;
                player.vy = 0;
                player.onGround = true;
            } else {
                die(); return;
            }
        }
    }

    // Spike Collision
    let pRect = { x: player.x + 6, y: player.y + 6, w: player.size - 12, h: player.size - 12 };
    for (let sp of spikes) {
        let sx = sp.x + 8, sy = sp.type === 'up' ? sp.y + 16 : sp.y, sw = 24, sh = 24;
        if (pRect.x < sx + sw && pRect.x + pRect.w > sx && pRect.y < sy + sh && pRect.y + pRect.h > sy) {
            die(); return;
        }
    }

    cameraX = player.x - 180;

    // Progress Calculation
    let passedCount = 0;
    for (let ox of obstacleXCoords) {
        if (player.x > ox) passedCount++;
        else break;
    }
    let rawPercent = Math.floor((passedCount / totalObstacles) * 100);
    currentProgress = Math.min(100, Math.max(0, rawPercent));
    
    uiProgressText.innerText = `PROGRESS: ${currentProgress}%`;
    uiProgressBar.style.width = `${currentProgress}%`;

    if (currentProgress > bestProgress) {
        bestProgress = currentProgress;
        localStorage.setItem('objectRunMap3Best', bestProgress);
        uiBest.innerText = `BEST: ${bestProgress}%`;
    }

    if (currentProgress >= 100) win();
}

function drawBackground(theme) {
    let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, theme.bg1);
    grad.addColorStop(1, theme.bg2);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Dark dungeon brick backdrop pattern (matches reference image environment)
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.035)';
    ctx.lineWidth = 1;
    let bW = 60, bH = 30;
    let offX = cameraX % (bW * 2);
    for (let y = 0; y < canvas.height; y += bH) {
        let rowShift = (Math.floor(y / bH) % 2 === 0) ? 0 : bW;
        for (let x = -bW * 2; x < canvas.width + bW * 2; x += bW) {
            ctx.strokeRect(x - offX + rowShift, y, bW, bH);
        }
    }
}

// Custom Rendering of the Creepy Face Cube (Geometry Dash Style Icon)
function drawCreepyCube(x, y, size, angle) {
    ctx.save();
    ctx.translate(x + size / 2, y + size / 2);
    ctx.rotate(angle);

    // Green outer glow aura
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#39ff14';

    // Base lime-green face block
    ctx.fillStyle = '#6eff14';
    ctx.fillRect(-size / 2, -size / 2, size, size);

    // Outer dark outline
    ctx.strokeStyle = '#052402';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(-size / 2, -size / 2, size, size);

    // Inner dark hollows (The sinister eyes & jagged mouth from reference)
    ctx.fillStyle = '#052402';

    // Left Square Eye Socket
    let eyeSize = size * 0.32;
    ctx.fillRect(-size * 0.38, -size * 0.38, eyeSize, eyeSize);

    // Right Square Eye Socket
    ctx.fillRect(size * 0.08, -size * 0.38, eyeSize, eyeSize);

    // Glowing Animated Irises
    let irisYShift = Math.sin(eyeAnimTimer) * 1.5;
    ctx.fillStyle = '#ffff66';
    ctx.fillRect(-size * 0.28, -size * 0.28 + irisYShift, eyeSize * 0.45, eyeSize * 0.45);
    ctx.fillRect(size * 0.18, -size * 0.28 + irisYShift, eyeSize * 0.45, eyeSize * 0.45);

    // Jagged Creepy Mouth Pattern (Interlocking teeth cutout)
    ctx.fillStyle = '#052402';
    ctx.beginPath();
    ctx.moveTo(-size * 0.35, size * 0.15);
    ctx.lineTo(size * 0.35, size * 0.15);
    ctx.lineTo(size * 0.35, size * 0.42);
    ctx.lineTo(size * 0.18, size * 0.42);
    ctx.lineTo(size * 0.18, size * 0.26);
    ctx.lineTo(size * 0.02, size * 0.26);
    ctx.lineTo(size * 0.02, size * 0.42);
    ctx.lineTo(-size * 0.18, size * 0.42);
    ctx.lineTo(-size * 0.18, size * 0.26);
    ctx.lineTo(-size * 0.35, size * 0.26);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

// Custom Rendering of the Greenish Phantom Triangle Ship
function drawPhantomShip(x, y, size, angle) {
    ctx.save();
    ctx.translate(x + size / 2, y + size / 2);
    ctx.rotate(angle);

    ctx.shadowBlur = 15;
    ctx.shadowColor = '#39ff14';

    // Sharp Triangle Hull
    ctx.fillStyle = '#52ff14';
    ctx.strokeStyle = '#052402';
    ctx.lineWidth = 2.5;

    ctx.beginPath();
    ctx.moveTo(size * 0.6, 0); // Front beak
    ctx.lineTo(-size * 0.55, -size * 0.45); // Upper fin
    ctx.lineTo(-size * 0.3, 0); // Rear thruster inset
    ctx.lineTo(-size * 0.55, size * 0.45); // Lower fin
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Creepy central glowing eye in cockpit
    ctx.fillStyle = '#052402';
    ctx.fillRect(-size * 0.15, -size * 0.15, size * 0.35, size * 0.3);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(size * 0.02, 0, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function draw() {
    const theme = getTheme(currentProgress);
    document.documentElement.style.setProperty('--theme-color', theme.main);
    document.documentElement.style.setProperty('--glow-color', theme.glow);

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground(theme);

    ctx.save();
    ctx.translate(-cameraX, 0);

    // Render Fire Arc Trail for Cube Mode
    for (let i = fireTail.length - 1; i >= 0; i--) {
        let f = fireTail[i];
        f.x += f.vx; f.y += f.vy; f.life -= 0.045;
        if (f.life <= 0) { fireTail.splice(i, 1); continue; }
        ctx.fillStyle = `rgba(255, ${Math.floor(f.life * 140)}, 0, ${f.life})`;
        ctx.fillRect(f.x, f.y, f.size, f.size);
    }

    // Render Ship Cyber Sparks
    for (let i = shipCyberSparks.length - 1; i >= 0; i--) {
        let s = shipCyberSparks[i];
        s.x += s.vx; s.y += s.vy; s.life -= 0.04;
        if (s.life <= 0) { shipCyberSparks.splice(i, 1); continue; }
        ctx.fillStyle = `rgba(57, 255, 20, ${s.life})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    }

    // Dimensional Portals
    for (let pt of portals) {
        ctx.save();
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ff00ea';
        ctx.strokeStyle = '#ff00ea';
        ctx.lineWidth = 4;
        ctx.strokeRect(pt.x, pt.y, pt.w, pt.h);
        ctx.fillStyle = 'rgba(255, 0, 234, 0.28)';
        ctx.fillRect(pt.x, pt.y, pt.w, pt.h);

        // Rotating portal core ring
        ctx.beginPath();
        ctx.arc(pt.x + pt.w / 2, pt.y + pt.h / 2, 12, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();
    }

    // Blocks & Oscillating Hazards
    ctx.shadowBlur = 10;
    ctx.shadowColor = theme.main;
    ctx.strokeStyle = theme.main;
    ctx.fillStyle = '#0a0517';
    ctx.lineWidth = 2;
    for (let b of blocks.concat(movingBlocks)) {
        if (b.x > cameraX - TILE_SIZE && b.x < cameraX + 850) {
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.strokeRect(b.x, b.y, b.w, b.h);
        }
    }

    // Spikes (Floor & Ceiling)
    ctx.shadowColor = '#ff0055';
    ctx.fillStyle = '#ff0055';
    for (let sp of spikes) {
        if (sp.x > cameraX - TILE_SIZE && sp.x < cameraX + 850) {
            ctx.beginPath();
            if (sp.type === 'up') {
                ctx.moveTo(sp.x + TILE_SIZE / 2, sp.y + 4);
                ctx.lineTo(sp.x + TILE_SIZE - 4, sp.y + TILE_SIZE);
                ctx.lineTo(sp.x + 4, sp.y + TILE_SIZE);
            } else {
                ctx.moveTo(sp.x + 4, sp.y);
                ctx.lineTo(sp.x + TILE_SIZE - 4, sp.y);
                ctx.lineTo(sp.x + TILE_SIZE / 2, sp.y + TILE_SIZE - 4);
            }
            ctx.closePath();
            ctx.fill();
        }
    }

    // Render Player Vessel
    if (gameState !== 'GAMEOVER') {
        if (player.mode === 'RUNNER') {
            drawCreepyCube(player.x, player.y, player.size, player.angle);
        } else {
            drawPhantomShip(player.x, player.y, player.size, player.angle);
        }
    }

    // Death Scatter Explosion
    if (gameState === 'GAMEOVER') {
        for (let p of particles) {
            if (p.life > 0) {
                p.x += p.vx; p.y += p.vy; p.rot += p.rotSpeed; p.life -= 0.022;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();
            }
        }
    }

    ctx.restore();

    // Portal Flash
    if (flashTimer > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${flashTimer / 25})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        flashTimer--;
    }

    if (gameState === 'START') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.fillRect(0, 0, 800, 440);
        ctx.fillStyle = theme.main;
        ctx.font = '20px Orbitron';
        ctx.textAlign = 'center';
        ctx.fillText("SPACE OR CLICK TO RUN & SOAR", 400, 220);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
