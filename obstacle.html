<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBJECT RUN 🏃 — Choose Your Map</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Segoe+UI:wght@400;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #050614 0%, #110b27 50%, #051b2c 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Subtle Background Grid Lines */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* Ambient Glow Blobs */
        .ambient-glow {
            position: absolute;
            width: 35vw;
            height: 35vw;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.25;
            pointer-events: none;
            z-index: 0;
        }

        .glow-cyan {
            top: -5%;
            left: -5%;
            background: #00ffff;
        }

        .glow-magenta {
            bottom: -5%;
            right: -5%;
            background: #ff00ea;
        }

        /* Top-Left Back Arrow */
        .back-arrow {
            position: absolute;
            top: 25px;
            left: 25px;
            color: #00f0ff;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, filter 0.2s ease, color 0.2s ease;
            filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.6));
            z-index: 10;
        }

        .back-arrow:hover {
            transform: scale(1.15) translateX(-3px);
            color: #ff00ea;
            filter: drop-shadow(0 0 12px #ff00ea);
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            max-width: 820px;
            width: 90%;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 36px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.5), 0 0 30px rgba(0, 255, 255, 0.2);
            line-height: 1.2;
        }

        /* Map Buttons Layout */
        .map-selection {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            justify-content: center;
            width: 100%;
        }

        .map-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 320px;
            height: 125px;
            background: rgba(10, 15, 30, 0.65);
            border: 2px solid;
            border-radius: 14px;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            backdrop-filter: blur(8px);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        box-shadow 0.25s ease,
                        border-color 0.25s ease,
                        background-color 0.25s ease;
        }

        /* Map 1: Cyan Theme */
        .btn-map1 {
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.25), inset 0 0 10px rgba(0, 240, 255, 0.1);
            text-shadow: 0 0 8px #00f0ff;
        }

        .btn-map1:hover {
            transform: translateY(-6px) scale(1.04);
            background: rgba(0, 240, 255, 0.12);
            box-shadow: 0 12px 24px rgba(0, 240, 255, 0.4), inset 0 0 18px rgba(0, 240, 255, 0.25);
            border-color: #7df9ff;
        }

        /* Map 2: Magenta / Hot Pink Theme */
        .btn-map2 {
            border-color: #ff00ea;
            box-shadow: 0 0 15px rgba(255, 0, 234, 0.25), inset 0 0 10px rgba(255, 0, 234, 0.1);
            text-shadow: 0 0 8px #ff00ea;
        }

        .btn-map2:hover {
            transform: translateY(-6px) scale(1.04);
            background: rgba(255, 0, 234, 0.12);
            box-shadow: 0 12px 24px rgba(255, 0, 234, 0.4), inset 0 0 18px rgba(255, 0, 234, 0.25);
            border-color: #ff66f0;
        }

        /* Description Box */
        .info-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.09);
            padding: 24px 30px;
            border-radius: 12px;
            backdrop-filter: blur(6px);
            line-height: 1.6;
            font-size: 1.05rem;
            color: #d1d5db;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            max-width: 680px;
        }

        @media (max-width: 650px) {
            h1 { font-size: 1.9rem; }
            .map-card { width: 100%; height: 105px; font-size: 1.1rem; }
            .info-card { font-size: 0.95rem; padding: 18px 20px; }
            .back-arrow { top: 18px; left: 18px; }
        }
    </style>
</head>
<body>

    <div class="grid-overlay"></div>
    <div class="ambient-glow glow-cyan"></div>
    <div class="ambient-glow glow-magenta"></div>

    <!-- Top Left Back Arrow to Main Hub -->
    <a href="index.html" class="back-arrow" title="Back to Game Hub">
        <svg viewBox="0 0 24 24" width="30" height="30" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </a>

    <div class="container">
        <h1>OBJECT RUN 🏃<br><span style="font-size: 0.75em; color: #00f0ff;">Choose Your Map</span></h1>

        <!-- Map Navigation Buttons -->
        <div class="map-selection">
            <a href="obstacle-map1.html" class="map-card btn-map1">
                Map 1: Classic Run
            </a>
            <a href="obstacle-map2.html" class="map-card btn-map2">
                Map 2: Lava Ruins
            </a>
        </div>

        <!-- Informational Section -->
        <div class="info-card">
            <p>
                Pick your challenge! Classic Run offers the original course, while Neon Challenge brings a harder, glowing map. More maps can be added here in the future.
            </p>
        </div>
    </div>

    <script>
        // Optional subtle hover sound or logging hooks can be placed here
        console.log("OBJECT RUN: Map selector loaded successfully.");
    </script>
</body>
</html>
