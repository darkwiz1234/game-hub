<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBJECT RUN 🏃</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
    body {
        margin: 0; padding: 0; background: #06070a; color: #fff;
        font-family: 'Orbitron', sans-serif; overflow: hidden; user-select: none;
    }
    #game-container {
        position: relative; width: 800px; height: 440px; margin: 40px auto;
        box-shadow: 0 0 30px var(--theme-glow, rgba(0, 255, 255, 0.3));
        border: 2px solid var(--theme-border, #00ffff55);
        border-radius: 8px; overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; background: #050614; }
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    
    .back-arrow {
        position: absolute; top: 15px; left: 15px; color: var(--theme-color, #0ff);
        transition: 0.2s; z-index: 100; text-decoration: none;
        display: flex; align-items: center; justify-content: center;
        pointer-events: auto;
    }
    .back-arrow:hover { transform: scale(1.15) translateX(-2px); }

    .hud {
        position: absolute; top: 12px; font-size: 16px;
        color: var(--theme-color, #0ff); text-shadow: 0 0 8px currentColor;
    }
    #score-box { left: 65px; }
    #best-box { right: 20px; }

    .btn {
        position: absolute; padding: 8px 18px; font-family: 'Orbitron', sans-serif;
        background: #090e17; border: 2px solid var(--theme-color, #0ff);
        color: var(--theme-color, #0ff); font-size: 13px; cursor: pointer;
        pointer-events: auto; border-radius: 5px; transition: 0.2s;
    }
    .btn:hover { background: var(--theme-color, #0ff); color: #000; }
    #pauseBtn { bottom: 15px; right: 15px; }
    #resetBtn { bottom: 15px; right: 110px; }

    #message-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: none; justify-content: center; align-items: center;
        flex-direction: column; background: rgba(0, 0, 0, 0.78);
        gap: 15px; pointer-events: none; z-index: 10;
    }
    #message-text { font-size: 38px; color: #f0f; text-shadow: 0 0 20px #f0f; margin-bottom: 5px; }
    .msg-btn { position: relative; pointer-events: auto; font-size: 16px; padding: 10px 24px; }
</style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="440"></canvas>
    
    <div id="ui-layer">
        <a href="index.html" class="back-arrow" title="Back to Hub">
            <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>

        <div id="score-box" class="hud">SCORE: <span id="scoreVal">0</span></div>
        <div id="best-box" class="hud">BEST: <span id="bestVal">0</span></div>
        
        <button id="resetBtn" class="btn">RESET</button>
        <button id="pauseBtn" class="btn">PAUSE</button>

        <div id="message-overlay">
            <div id="message-text">GAME OVER</div>
            <button id="overlayActionBtn" class="btn msg-btn">TRY AGAIN</button>
            <button class="btn msg-btn" onclick="window.location.href='index.html'">BACK TO HUB</button>
        </div>
    </div>
</div>

<audio id="sfx-collision" src="collision.mp3" preload="auto"></audio>
<audio id="sfx-music" src="music.mp3" loop preload="auto"></audio>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreVal = document.getElementById('scoreVal');
const bestVal = document.getElementById('bestVal');
const pauseBtn = document.getElementById('pauseBtn');
const resetBtn = document.getElementById('resetBtn');
const overlayActionBtn = document.getElementById('overlayActionBtn');
const msgOverlay = document.getElementById('message-overlay');
const msgText = document.getElementById('message-text');

const bgMusic = document.getElementById('sfx-music');
const hitSound = document.getElementById('sfx-collision');

let gameState = 'START';
let bestScore = parseInt(localStorage.getItem('objectRunHighScore') || 0);
bestVal.innerText = bestScore;

const TILE_SIZE = 40;

// The Balanced Handcrafted Map
const mapGrid = [
    "........................................................................................................................................................................................................................................................................................................................................................................................................................",
    "........................................................................................................................................................................................................................................................................................................................................................................................................................",
    "........................................................................................................................................................................................................................................................................................................................................................................................................................",
    "........................................................................................................................................................................................................................................................................................................................................................................................................................",
    "........................................................................................................................................................................................................................................................................................................................................................................................................................",
    "........................................................................................................................................................................................................................................................................................................................................................................................................................",
    "...........................................................................................................................####..........................................................................####...................................................................####................................................................................................................................",
    "........................................................................................####...............................vvvv............................................####............................vvvv............................................####.....................vvvv................................................................................................................................",
    "........................................................................................vvvv...............................................................................vvvv.........................................................................vvvv................................................................................................................................................................",
    "........................................^........##.........^........^^.........#.......^^^^.......^^.........#...##.......^....^^^^....#........^^.........##...###.......^....^^^^....#........^^..........^^^..........##...###.......^^^.......^....^^^^....##.........^^^..........^^^..........#...##...###.......^^^.......^^^^....##.........^^^.......................................................",
    "########################################################################################################################################################################################################################################################################################################################################################################################################################"
];

let blocks = [];
let spikes = [];

function parseLevel() {
    blocks = []; spikes = [];
    for(let r=0; r<mapGrid.length; r++) {
        for(let c=0; c<mapGrid[r].length; c++) {
            let ch = mapGrid[r][c];
            let x = c * TILE_SIZE;
            let y = r * TILE_SIZE;
            if(ch === '#') blocks.push({x, y, w: TILE_SIZE, h: TILE_SIZE});
            if(ch === '^') spikes.push({x, y, type: 'up'});
            if(ch === 'v') spikes.push({x, y, type: 'down'});
        }
    }
}
parseLevel();

let baseSpeed = 5.6;
let player = { x: 120, y: 320, size: 28, vx: baseSpeed, vy: 0, gravity: 0.74, jumpForce: -12.3, angle: 0, onGround: false };
let cameraX = 0;
let particles = [];
let musicStarted = false;
let currentScore = 0;
let levelWidth = mapGrid[0].length * TILE_SIZE;

// Visual Theme System (score-based shifts)
function getCurrentTheme() {
    if (currentScore >= 100) return { main: '#ffd700', glow: 'rgba(255,215,0,0.5)', bg: '#1c1500' }; // Golden
    if (currentScore >= 50)  return { main: '#ff4500', glow: 'rgba(255,69,0,0.5)', bg: '#1a0500' };  // Fiery
    if (currentScore >= 20)  return { main: '#ba55d3', glow: 'rgba(186,85,211,0.5)', bg: '#120417' };// Purple
    return { main: '#00ffff', glow: 'rgba(0,255,255,0.4)', bg: '#050614' };                           // Neon Blue
}

function resetGame() {
    player = { x: 120, y: 320, size: 28, vx: baseSpeed, vy: 0, gravity: 0.74, jumpForce: -12.3, angle: 0, onGround: false };
    cameraX = 0;
    particles = [];
    currentScore = 0;
    gameState = 'PLAYING';
    msgOverlay.style.display = 'none';
    if(musicStarted) { bgMusic.play().catch(()=>{}); }
}

function die() {
    gameState = 'GAMEOVER';
    hitSound.currentTime = 0; hitSound.play().catch(()=>{});
    bgMusic.pause();
    msgText.innerText = "GAME OVER";
    msgText.style.color = "#f0f";
    overlayActionBtn.innerText = "TRY AGAIN";
    msgOverlay.style.display = 'flex';

    for(let i=0; i<20; i++) {
        particles.push({
            x: player.x + player.size/2, y: player.y + player.size/2,
            vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 1) * 10,
            size: Math.random() * 8 + 2, life: 1.0, color: i % 2 === 0 ? getCurrentTheme().main : '#f0f'
        });
    }
}

function jump() {
    if(gameState === 'START') {
        musicStarted = true; bgMusic.play().catch(()=>{});
        gameState = 'PLAYING';
    }
    if(gameState === 'PLAYING' && player.onGround) {
        player.vy = player.jumpForce;
        player.onGround = false;
    }
}

window.addEventListener('keydown', (e) => {
    if(e.code === 'Space' || e.code === 'ArrowUp') jump();
});
window.addEventListener('mousedown', (e) => {
    if(e.target.tagName === 'CANVAS') jump();
});

function togglePause() {
    if(gameState === 'PLAYING') {
        gameState = 'PAUSED'; bgMusic.pause();
        msgText.innerText = "PAUSED"; msgText.style.color = "#fff";
        overlayActionBtn.innerText = "RESUME";
        msgOverlay.style.display = 'flex';
    } else if(gameState === 'PAUSED') {
        gameState = 'PLAYING'; bgMusic.play().catch(()=>{});
        msgOverlay.style.display = 'none';
    }
}

pauseBtn.addEventListener('click', togglePause);
resetBtn.addEventListener('click', resetGame);
overlayActionBtn.addEventListener('click', () => {
    if(gameState === 'PAUSED') togglePause();
    else resetGame();
});

function update() {
    if(gameState !== 'PLAYING') return;

    // Score & Speed Scaling
    currentScore = Math.floor((player.x - 120) / 75);
    scoreVal.innerText = currentScore;
    if(currentScore > bestScore) {
        bestScore = currentScore;
        localStorage.setItem('objectRunHighScore', bestScore);
        bestVal.innerText = bestScore;
    }

    // Dynamic speed ramp
    player.vx = baseSpeed + (currentScore * 0.015);
    player.vy += player.gravity;

    // X Movement & Block Collision
    player.x += player.vx;
    for(let b of blocks) {
        if(player.x < b.x + b.w && player.x + player.size > b.x &&
           player.y < b.y + b.h && player.y + player.size > b.y) {
            die(); return;
        }
    }

    // Y Movement & Block Collision
    player.y += player.vy;
    player.onGround = false;
    for(let b of blocks) {
        if(player.x < b.x + b.w && player.x + player.size > b.x &&
           player.y < b.y + b.h && player.y + player.size > b.y) {
            if(player.vy > 0) {
                player.y = b.y - player.size;
                player.vy = 0;
                player.onGround = true;
            } else if (player.vy < 0) {
                die(); return;
            }
        }
    }

    // Spike Collision (forgiving hitbox)
    let pRect = { x: player.x + 5, y: player.y + 5, w: player.size - 10, h: player.size - 10 };
    for(let s of spikes) {
        let sx = s.x + 8, sy = s.type === 'up' ? s.y + 16 : s.y, sw = 24, sh = 24;
        if(pRect.x < sx + sw && pRect.x + pRect.w > sx && pRect.y < sy + sh && pRect.y + pRect.h > sy) {
            die(); return;
        }
    }

    // Rotation
    if(!player.onGround) player.angle += 0.12;
    else player.angle = Math.round(player.angle / (Math.PI/2)) * (Math.PI/2);

    cameraX = player.x - 180;

    // Level Loop / Completion
    if(player.x >= levelWidth - 800) {
        gameState = 'WIN';
        msgText.innerText = "MAP 1 CLEAR!";
        msgText.style.color = "#0ff";
        overlayActionBtn.innerText = "PLAY AGAIN";
        msgOverlay.style.display = 'flex';
    }
}

function draw() {
    const theme = getCurrentTheme();
    document.documentElement.style.setProperty('--theme-color', theme.main);
    document.documentElement.style.setProperty('--theme-glow', theme.glow);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background
    ctx.fillStyle = theme.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    let offsetX = cameraX % TILE_SIZE;
    for(let i=0; i<=canvas.width; i+=TILE_SIZE) { 
        ctx.moveTo(i-offsetX, 0); ctx.lineTo(i-offsetX, canvas.height); 
    }
    for(let i=0; i<=canvas.height; i+=TILE_SIZE) { 
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); 
    }
    ctx.stroke();

    ctx.save();
    ctx.translate(-cameraX, 0);

    // Blocks
    ctx.shadowBlur = 10;
    ctx.shadowColor = theme.main;
    ctx.strokeStyle = theme.main;
    ctx.fillStyle = '#060a12';
    ctx.lineWidth = 2;
    for(let b of blocks) {
        if(b.x > cameraX - TILE_SIZE && b.x < cameraX + 850) {
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.strokeRect(b.x, b.y, b.w, b.h);
        }
    }

    // Spikes
    ctx.shadowColor = '#f0f';
    ctx.fillStyle = '#f0f';
    for(let s of spikes) {
        if(s.x > cameraX - TILE_SIZE && s.x < cameraX + 850) {
            ctx.beginPath();
            if(s.type === 'up') {
                ctx.moveTo(s.x + TILE_SIZE/2, s.y + 4);
                ctx.lineTo(s.x + TILE_SIZE - 4, s.y + TILE_SIZE);
                ctx.lineTo(s.x + 4, s.y + TILE_SIZE);
            } else {
                ctx.moveTo(s.x + 4, s.y);
                ctx.lineTo(s.x + TILE_SIZE - 4, s.y);
                ctx.lineTo(s.x + TILE_SIZE/2, s.y + TILE_SIZE - 4);
            }
            ctx.fill();
        }
    }

    // Player
    if(gameState !== 'GAMEOVER') {
        ctx.shadowColor = theme.main;
        ctx.fillStyle = theme.main;
        ctx.save();
        ctx.translate(player.x + player.size/2, player.y + player.size/2);
        ctx.rotate(player.angle);
        ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
        ctx.fillStyle = '#fff';
        ctx.fillRect(-player.size/4, -player.size/4, player.size/2, player.size/2);
        ctx.restore();
    }

    // Death particles
    if(gameState === 'GAMEOVER') {
        ctx.shadowBlur = 6;
        for(let p of particles) {
            if(p.life > 0) {
                p.vy += 0.5; p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.shadowColor = p.color; ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }
        }
        ctx.globalAlpha = 1.0;
    }

    ctx.restore();

    if(gameState === 'START') {
        ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0,0,800,440);
        ctx.fillStyle = theme.main; ctx.font = '22px Orbitron'; ctx.textAlign = 'center';
        ctx.shadowBlur = 10; ctx.shadowColor = theme.main;
        ctx.fillText("PRESS SPACE OR CLICK TO JUMP", 400, 220);
        ctx.textAlign = 'left';
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
