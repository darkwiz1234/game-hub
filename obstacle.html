<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBJECT RUN 🏃</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
    body {
        margin: 0; padding: 0; background: #06070a; color: #fff;
        font-family: 'Orbitron', sans-serif; overflow: hidden; user-select: none;
    }
    #game-container {
        position: relative; width: 800px; height: 440px; margin: 50px auto;
        box-shadow: 0 0 30px rgba(0, 255, 255, 0.3); border: 2px solid #00ffff44;
        border-radius: 8px; overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; background: #050614; }
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    
    .back-arrow {
        position: absolute; top: 15px; left: 15px; color: #0ff;
        transition: transform 0.2s, filter 0.2s, color 0.2s; z-index: 100; 
        text-decoration: none; display: flex; align-items: center; justify-content: center;
        filter: drop-shadow(0 0 5px rgba(0, 255, 255, 0.5)); pointer-events: auto;
    }
    .back-arrow:hover { 
        transform: scale(1.15) translateX(-2px); color: #f0f; 
        filter: drop-shadow(0 0 10px #f0f); 
    }

    #progress-container {
        position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
        width: 360px; text-align: center;
    }
    #progress-bar-bg {
        width: 100%; height: 10px; background: rgba(0, 255, 255, 0.15);
        border: 2px solid #0ff; border-radius: 6px; overflow: hidden;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.4); margin-top: 6px;
    }
    #progress-bar-fill {
        height: 100%; width: 0%; background: #0ff; 
        box-shadow: 0 0 12px #0ff;
    }
    #progress-text { font-size: 18px; color: #0ff; text-shadow: 0 0 8px #0ff; letter-spacing: 2px; }
    
    .hud { position: absolute; padding: 15px; font-size: 16px; text-shadow: 0 0 8px #0ff; color: #0ff; }
    #best { top: 5px; right: 10px; }
    
    .btn {
        position: absolute; padding: 8px 18px; font-family: 'Orbitron', sans-serif;
        background: #090e17; border: 2px solid #0ff; color: #0ff; font-size: 14px;
        cursor: pointer; pointer-events: auto; text-shadow: 0 0 5px #0ff;
        box-shadow: 0 0 10px rgba(0,255,255,0.3); border-radius: 5px; transition: 0.2s;
    }
    .btn:hover { background: #0ff; color: #000; box-shadow: 0 0 20px #0ff; }
    #pauseBtn { bottom: 15px; right: 15px; }
    
    #message-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; justify-content: center; align-items: center; flex-direction: column;
        background: rgba(0, 0, 0, 0.75); display: none; pointer-events: none; z-index: 10;
        gap: 15px;
    }
    #message-text { font-size: 40px; color: #f0f; text-shadow: 0 0 20px #f0f; margin-bottom: 10px; }
    .msg-btn { position: relative; pointer-events: auto; font-size: 18px; padding: 12px 30px; }
    
    #hubBtn { border-color: #f0f; color: #f0f; text-shadow: 0 0 5px #f0f; box-shadow: 0 0 10px rgba(255,0,255,0.3); }
    #hubBtn:hover { background: #f0f; color: #000; box-shadow: 0 0 20px #f0f; }
</style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="440"></canvas>
    
    <div id="ui-layer">
        <a href="index.html" class="back-arrow" title="Back to Hub">
            <svg viewBox="0 0 24 24" width="30" height="30" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>

        <div id="progress-container">
            <div id="progress-text">0%</div>
            <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
        </div>
        <div id="best" class="hud">BEST: 0%</div>
        <button id="pauseBtn" class="btn">PAUSE</button>
        
        <div id="message-overlay">
            <div id="message-text">GAME OVER</div>
            <button id="overlayActionBtn" class="btn msg-btn">TRY AGAIN</button>
            <button id="hubBtn" class="btn msg-btn" onclick="window.location.href='index.html'">BACK TO HUB</button>
        </div>
    </div>
</div>

<audio id="sfx-collision" src="collision.mp3" preload="auto"></audio>
<audio id="sfx-music" src="music.mp3" loop preload="auto"></audio>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiProgressText = document.getElementById('progress-text');
const uiProgressBar = document.getElementById('progress-bar-fill');
const uiBest = document.getElementById('best');
const pauseBtn = document.getElementById('pauseBtn');
const overlayActionBtn = document.getElementById('overlayActionBtn');
const msgOverlay = document.getElementById('message-overlay');
const msgText = document.getElementById('message-text');

const bgMusic = document.getElementById('sfx-music');
const hitSound = document.getElementById('sfx-collision');

let gameState = 'START'; 
let bestProgress = localStorage.getItem('objectRunBest') || 0;
uiBest.innerText = `BEST: ${bestProgress}%`;

const TILE_SIZE = 40;
const ROWS = 11;

/*
  Pattern Chunk Definitions:
  Each chunk is exactly 11 rows high and fixed width.
  '#' = solid block
  '^' = spike on floor
  'v' = ceiling spike / underneath floating platform
  '.' = air
*/
const CHUNKS = {
    // 0: Safe buffer zone (6 tiles)
    safeBuffer: [
        "......",
        "......",
        "......",
        "......",
        "......",
        "......",
        "......",
        "......",
        "......",
        "......",
        "######"
    ],
    // 1: Easy single spike
    singleSpike: [
        "........",
        "........",
        "........",
        "........",
        "........",
        "........",
        "........",
        "........",
        "........",
        "..^.....",
        "########"
    ],
    // 2: Low 1-block Step-Up ramp with safe landing
    stepRamp: [
        "..........",
        "..........",
        "..........",
        "..........",
        "..........",
        "..........",
        "..........",
        "..........",
        "....##....",
        "..#.##....",
        "##########"
    ],
    // 3: Rhythm double spike
    doubleSpike: [
        "..........",
        "..........",
        "..........",
        "..........",
        "..........",
        "..........",
        "..........",
        "..........",
        "..........",
        "..^^......",
        "##########"
    ],
    // 4: Low floating platform with spike pit underneath (1 block jump up)
    floatingPlatformPit: [
        "..............",
        "..............",
        "..............",
        "..............",
        "..............",
        "..............",
        "..............",
        "....####......",
        "....vvvv......",
        "..^^^^^^^^....",
        "##############"
    ],
    // 5: Staircase ascent (steps up 1-tile at a time with guaranteed landing)
    staircase: [
        "................",
        "................",
        "................",
        "................",
        "................",
        "................",
        "........##......",
        "......####......",
        "....######......",
        "..^.######....^.",
        "################"
    ],
    // 6: Hard rhythm combo: landing block directly followed by double spikes
    spikeBoxCombo: [
        "................",
        "................",
        "................",
        "................",
        "................",
        "................",
        "................",
        "................",
        "....##..........",
        "..^.##..^^......",
        "################"
    ],
    // 7: High-intensity double platform hop
    doublePlatformHop: [
        "....................",
        "....................",
        "....................",
        "....................",
        "....................",
        "....................",
        "........###.........",
        "....###.vvv.........",
        "....vvv.###.........",
        "..^^^^^^^^^^^.......",
        "####################"
    ]
};

// Build the handcrafted progressive level using patterns
function buildLevelSequence() {
    const sequence = [];

    // START (Safe initial runway ~5% progress)
    sequence.push(CHUNKS.safeBuffer, CHUNKS.safeBuffer, CHUNKS.safeBuffer);

    // TIER 1: EARLY (0% - 30%) - Foundations & single mechanics
    sequence.push(
        CHUNKS.singleSpike,
        CHUNKS.safeBuffer,
        CHUNKS.stepRamp,
        CHUNKS.safeBuffer,
        CHUNKS.singleSpike,
        CHUNKS.doubleSpike,
        CHUNKS.safeBuffer
    );

    // TIER 2: MID (30% - 70%) - Floating blocks over spikes & steps
    sequence.push(
        CHUNKS.floatingPlatformPit,
        CHUNKS.safeBuffer,
        CHUNKS.doubleSpike,
        CHUNKS.stepRamp,
        CHUNKS.safeBuffer,
        CHUNKS.staircase,
        CHUNKS.safeBuffer,
        CHUNKS.floatingPlatformPit,
        CHUNKS.spikeBoxCombo,
        CHUNKS.safeBuffer
    );

    // TIER 3: LATE (70% - 95%) - High pacing & alternating challenges
    sequence.push(
        CHUNKS.doublePlatformHop,
        CHUNKS.safeBuffer,
        CHUNKS.spikeBoxCombo,
        CHUNKS.staircase,
        CHUNKS.floatingPlatformPit,
        CHUNKS.doublePlatformHop,
        CHUNKS.spikeBoxCombo,
        CHUNKS.doubleSpike
    );

    // END RUN (95% - 100%) - Finish runway
    sequence.push(CHUNKS.safeBuffer, CHUNKS.safeBuffer, CHUNKS.safeBuffer);

    // Assemble unified grid
    const fullGrid = Array(ROWS).fill("");
    for (const chunk of sequence) {
        for (let r = 0; r < ROWS; r++) {
            fullGrid[r] += chunk[r];
        }
    }
    return fullGrid;
}

const mapGrid = buildLevelSequence();
const levelWidth = mapGrid[0].length * TILE_SIZE;

let blocks = [];
let spikes = [];

function parseLevel() {
    blocks = []; spikes = [];
    for(let r=0; r<mapGrid.length; r++) {
        for(let c=0; c<mapGrid[r].length; c++) {
            let type = mapGrid[r][c];
            let x = c * TILE_SIZE;
            let y = r * TILE_SIZE;
            if(type === '#') blocks.push({x, y, w: TILE_SIZE, h: TILE_SIZE});
            if(type === '^') spikes.push({x, y, type: 'up'});
            if(type === 'v') spikes.push({x, y, type: 'down'});
        }
    }
}
parseLevel();

// Jump physics tuned so maximum height is ~88px (2.2 tiles), horizontal reach is ~160px (4 tiles)
let baseSpeed = 5.8;
let player = { 
    x: 120, y: 320, size: 28, 
    vx: baseSpeed, vy: 0, 
    gravity: 0.74, jumpForce: -12.3, 
    angle: 0, onGround: false 
};

let cameraX = 0;
let particles = [];
let musicStarted = false;

// Ambient decorative background shapes
const bgDiamonds = [];
for (let i = 0; i < 25; i++) {
    bgDiamonds.push({
        x: Math.random() * 2000, y: Math.random() * 260 + 20,
        size: Math.random() * 18 + 10, speed: Math.random() * 0.4 + 0.15, rot: Math.random() * Math.PI
    });
}

function resetGame() {
    player = { 
        x: 120, y: 320, size: 28, 
        vx: baseSpeed, vy: 0, 
        gravity: 0.74, jumpForce: -12.3, 
        angle: 0, onGround: false 
    };
    cameraX = 0;
    particles = [];
    gameState = 'PLAYING';
    msgOverlay.style.display = 'none';
    if(musicStarted) { bgMusic.play().catch(()=>{}); }
}

function die() {
    gameState = 'GAMEOVER';
    hitSound.currentTime = 0; hitSound.play().catch(()=>{});
    bgMusic.pause();
    msgText.innerText = "GAME OVER";
    msgText.style.color = "#f0f";
    overlayActionBtn.innerText = "TRY AGAIN";
    msgOverlay.style.display = 'flex';
    
    for(let i=0; i<20; i++) {
        particles.push({
            x: player.x + player.size/2, y: player.y + player.size/2,
            vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 1) * 10,
            size: Math.random() * 8 + 2, life: 1.0, color: i%2===0 ? '#0ff' : '#f0f'
        });
    }
}

function win() {
    gameState = 'WIN';
    msgText.innerText = "MAP 1 COMPLETE!";
    msgText.style.color = "#0ff";
    overlayActionBtn.innerText = "PLAY AGAIN";
    msgOverlay.style.display = 'flex';
}

function jump() {
    if(gameState === 'START') {
        musicStarted = true; bgMusic.play().catch(()=>{});
        gameState = 'PLAYING';
    }
    if(gameState === 'PLAYING' && player.onGround) {
        player.vy = player.jumpForce;
        player.onGround = false;
    }
}

window.addEventListener('keydown', (e) => {
    if(e.code === 'Space' || e.code === 'ArrowUp') jump();
});
window.addEventListener('mousedown', (e) => {
    if(e.target.tagName === 'CANVAS') jump();
});

function togglePause() {
    if(gameState === 'PLAYING') {
        gameState = 'PAUSED'; 
        bgMusic.pause();
        msgText.innerText = "PAUSED"; 
        msgText.style.color = "#fff";
        overlayActionBtn.innerText = "RESUME";
        msgOverlay.style.display = 'flex';
    } else if(gameState === 'PAUSED') {
        gameState = 'PLAYING'; 
        bgMusic.play().catch(()=>{});
        msgOverlay.style.display = 'none';
    }
}

pauseBtn.addEventListener('click', togglePause);
overlayActionBtn.addEventListener('click', () => {
    if(gameState === 'PAUSED') togglePause();
    else resetGame();
});

function update() {
    if(gameState !== 'PLAYING') return;

    // Gradual difficulty speed curve: speeds up slightly past 60%
    const maxDist = levelWidth - 800;
    const progress = Math.min(100, Math.max(0, Math.floor((player.x / maxDist) * 100)));
    player.vx = baseSpeed + (progress > 60 ? (progress - 60) * 0.02 : 0);

    player.vy += player.gravity;
    
    // Horizontal Movement & Collisions
    player.x += player.vx;
    for(let b of blocks) {
        if(player.x < b.x + b.w && player.x + player.size > b.x &&
           player.y < b.y + b.h && player.y + player.size > b.y) {
            die(); return;
        }
    }

    // Vertical Movement & Collisions
    player.y += player.vy;
    player.onGround = false;
    for(let b of blocks) {
        if(player.x < b.x + b.w && player.x + player.size > b.x &&
           player.y < b.y + b.h && player.y + player.size > b.y) {
            if(player.vy > 0) {
                player.y = b.y - player.size;
                player.vy = 0;
                player.onGround = true;
            } else if (player.vy < 0) {
                die(); return;
            }
        }
    }

    // Spike Collision (forgiving hitbox)
    let pRect = { x: player.x + 5, y: player.y + 5, w: player.size - 10, h: player.size - 10 };
    for(let s of spikes) {
        let sx = s.x + 8, sy = s.type === 'up' ? s.y + 16 : s.y, sw = 24, sh = 24;
        if(pRect.x < sx + sw && pRect.x + pRect.w > sx && pRect.y < sy + sh && pRect.y + pRect.h > sy) {
            die(); return;
        }
    }

    // Airborne Rotation
    if(!player.onGround) player.angle += 0.12;
    else player.angle = Math.round(player.angle / (Math.PI/2)) * (Math.PI/2);

    cameraX = player.x - 180;

    // Progress updates
    uiProgressText.innerText = `${progress}%`;
    uiProgressBar.style.width = `${progress}%`;
    
    if(progress > bestProgress) {
        bestProgress = progress;
        localStorage.setItem('objectRunBest', bestProgress);
        uiBest.innerText = `BEST: ${bestProgress}%`;
    }
    
    if(progress >= 100) win();
}

function drawBackground() {
    let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, '#060717');
    grad.addColorStop(0.6, '#110b27');
    grad.addColorStop(1, '#051b2c');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Parallax Mountain Silhouettes
    ctx.fillStyle = 'rgba(20, 20, 50, 0.4)';
    ctx.beginPath();
    ctx.moveTo(0, canvas.height);
    for (let x = 0; x <= canvas.width + 100; x += 100) {
        let peakY = 220 + Math.sin((x + cameraX * 0.2) * 0.006) * 45;
        ctx.lineTo(x, peakY);
    }
    ctx.lineTo(canvas.width, canvas.height);
    ctx.fill();

    // Floating Ambient Diamonds
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.15)';
    ctx.lineWidth = 1.5;
    for (let d of bgDiamonds) {
        let drawX = (d.x - cameraX * d.speed) % 900;
        if (drawX < -50) drawX += 900;

        ctx.save();
        ctx.translate(drawX, d.y);
        ctx.rotate(d.rot);
        ctx.strokeRect(-d.size/2, -d.size/2, d.size, d.size);
        ctx.restore();
    }

    // Grid Lines
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    let offsetX = cameraX % TILE_SIZE;
    for(let i=0; i<=canvas.width; i+=TILE_SIZE) { 
        ctx.moveTo(i-offsetX, 0); ctx.lineTo(i-offsetX, canvas.height); 
    }
    for(let i=0; i<=canvas.height; i+=TILE_SIZE) { 
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); 
    }
    ctx.stroke();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawBackground();

    ctx.save();
    ctx.translate(-cameraX, 0);

    // Neon Blocks
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#0ff';
    ctx.strokeStyle = '#0ff';
    ctx.fillStyle = '#060a12';
    ctx.lineWidth = 2;
    for(let b of blocks) {
        if(b.x > cameraX - TILE_SIZE && b.x < cameraX + 800) {
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.strokeRect(b.x, b.y, b.w, b.h);
        }
    }

    // Triangular Glowing Spikes
    ctx.shadowColor = '#f0f';
    ctx.fillStyle = '#f0f';
    for(let s of spikes) {
        if(s.x > cameraX - TILE_SIZE && s.x < cameraX + 800) {
            ctx.beginPath();
            if(s.type === 'up') {
                ctx.moveTo(s.x + TILE_SIZE/2, s.y + 4);
                ctx.lineTo(s.x + TILE_SIZE - 4, s.y + TILE_SIZE);
                ctx.lineTo(s.x + 4, s.y + TILE_SIZE);
            } else {
                ctx.moveTo(s.x + 4, s.y);
                ctx.lineTo(s.x + TILE_SIZE - 4, s.y);
                ctx.lineTo(s.x + TILE_SIZE/2, s.y + TILE_SIZE - 4);
            }
            ctx.fill();
        }
    }

    // Player Cube
    if(gameState !== 'GAMEOVER') {
        ctx.shadowColor = '#0ff';
        ctx.fillStyle = '#0ff';
        ctx.save();
        ctx.translate(player.x + player.size/2, player.y + player.size/2);
        ctx.rotate(player.angle);
        ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
        ctx.fillStyle = '#fff';
        ctx.fillRect(-player.size/4, -player.size/4, player.size/2, player.size/2);
        ctx.restore();
    }

    // Scatter Particles
    if(gameState === 'GAMEOVER') {
        ctx.shadowBlur = 8;
        for(let p of particles) {
            if(p.life > 0) {
                p.vy += 0.5; p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.shadowColor = p.color; ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }
        }
        ctx.globalAlpha = 1.0;
    }

    ctx.restore();

    // Start Screen
    if(gameState === 'START') {
        ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0,0,800,440);
        ctx.fillStyle = '#0ff'; ctx.font = '22px Orbitron'; ctx.textAlign = 'center';
        ctx.shadowBlur = 10; ctx.shadowColor = '#0ff';
        ctx.fillText("CLICK OR PRESS SPACE TO RUN", 400, 220);
        ctx.textAlign = 'left';
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
