<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBJECT RUN 🏃 — Frost Peak ❄️</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');
    * { box-sizing: border-box; }
    body {
        margin: 0; padding: 0; background: #020712; color: #fff;
        font-family: 'Orbitron', sans-serif; overflow: hidden; user-select: none;
    }
    #game-container {
        position: relative; width: 800px; height: 440px; margin: 30px auto;
        box-shadow: 0 0 35px rgba(0, 240, 255, 0.45);
        border: 2px solid #58d8ff; border-radius: 10px; overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; background: #040d1e; }
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

    .back-arrow {
        position: absolute; top: 15px; left: 15px; color: #7cedff;
        text-decoration: none; display: flex; align-items: center; justify-content: center;
        pointer-events: auto; transition: 0.2s; filter: drop-shadow(0 0 6px #00f0ff);
    }
    .back-arrow:hover { transform: scale(1.15) translateX(-2px); color: #ffffff; filter: drop-shadow(0 0 10px #ffffff); }

    #progress-container {
        position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
        width: 380px; text-align: center;
    }
    #progress-text {
        font-size: 16px; font-weight: 900; color: #9df2ff;
        text-shadow: 0 0 10px #00f0ff; letter-spacing: 2px;
    }
    #progress-bar-bg {
        width: 100%; height: 9px; background: rgba(255, 255, 255, 0.15);
        border: 2px solid #58d8ff; border-radius: 6px; overflow: hidden; margin-top: 5px;
        box-shadow: 0 0 8px rgba(88, 216, 255, 0.35);
    }
    #progress-bar-fill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #00f0ff, #c2f8ff);
        box-shadow: 0 0 12px #00f0ff;
    }

    #best {
        position: absolute; top: 14px; right: 20px; font-size: 15px;
        color: #7cedff; text-shadow: 0 0 8px #00f0ff;
    }

    .btn {
        position: absolute; padding: 8px 18px; font-family: 'Orbitron', sans-serif;
        background: #08172e; border: 2px solid #58d8ff; color: #9df2ff;
        font-size: 13px; font-weight: 700; cursor: pointer; pointer-events: auto;
        border-radius: 6px; transition: 0.2s; text-shadow: 0 0 5px #00f0ff;
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.25);
    }
    .btn:hover { background: #58d8ff; color: #020712; box-shadow: 0 0 18px #00f0ff; }
    #pauseBtn { bottom: 15px; right: 15px; }
    #resetBtn { bottom: 15px; right: 110px; }

    #message-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: none; justify-content: center; align-items: center;
        flex-direction: column; background: rgba(3, 10, 24, 0.88); gap: 14px; z-index: 10;
    }
    #message-text { font-size: 38px; color: #9df2ff; text-shadow: 0 0 20px #00f0ff; margin-bottom: 6px; }
    .msg-btn { position: relative; pointer-events: auto; font-size: 16px; padding: 10px 24px; }
    #hubBtn { border-color: #9df2ff; color: #9df2ff; }
    #hubBtn:hover { background: #9df2ff; color: #020712; }
</style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="440"></canvas>

    <div id="ui-layer">
        <a href="obstacle.html" class="back-arrow" title="Back to Map Selection">
            <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>

        <div id="progress-container">
            <div id="progress-text">PROGRESS: 0%</div>
            <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
        </div>

        <div id="best">BEST: 0%</div>
        <button id="resetBtn" class="btn">RESET</button>
        <button id="pauseBtn" class="btn">PAUSE</button>

        <div id="message-overlay">
            <div id="message-text">FROZEN SHATTER</div>
            <button id="overlayActionBtn" class="btn msg-btn">TRY AGAIN</button>
            <button id="hubBtn" class="btn msg-btn" onclick="window.location.href='obstacle.html'">MAP SELECT</button>
        </div>
    </div>
</div>

<audio id="sfx-collision" src="collision.mp3" preload="auto"></audio>
<audio id="sfx-music" src="frost.mp3" loop preload="auto"></audio>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiProgressText = document.getElementById('progress-text');
const uiProgressBar = document.getElementById('progress-bar-fill');
const uiBest = document.getElementById('best');
const pauseBtn = document.getElementById('pauseBtn');
const resetBtn = document.getElementById('resetBtn');
const overlayActionBtn = document.getElementById('overlayActionBtn');
const msgOverlay = document.getElementById('message-overlay');
const msgText = document.getElementById('message-text');
const bgMusic = document.getElementById('sfx-music');
const hitSound = document.getElementById('sfx-collision');

let gameState = 'START';
let bestProgress = parseInt(localStorage.getItem('objectRunFrostBest') || 0);
uiBest.innerText = `BEST: ${bestProgress}%`;

const TILE_SIZE = 40;

/*
  LEGEND:
  '.' = Air
  '#' = Solid regular frozen block
  '=' = Slippery ice block (boosts momentum on landing)
  '^' = Floor icicle spike
  'F' = Falling icicle trigger block (drops icicle when player approaches)
*/
const mapGrid = [
    "................................................................................#######################################......................................#######################################.......................................................................................................................###################################################.............................................................................................",
    "................................................................................#######################################......................................#######################################.......................................................................................................................###################################################.............................................................................................",
    "................................................................................FFF#########FF#################FF######.......................................FF..........F.......F....F......F............................................................................................................................###################################################.............................................................................................",
    "...........................................................................................................................................................................................................................................................................................................................###################################################.............................................................................................",
    "...........................................................................................................................................................................................................................................................................................................................###################################################.............................................................................................",
    "........................................................................................................................................................................................................##.................................................................................................................###################################################...........................................................##################################",
    "......................................#.............................##..........=======^^================^^============.................................##........................................................==........#..............^..######....===..................................................................................................................................................................................FFF...F..F...F................",
    "..................................#...#.=......................##........##.....#######################################...##........................##.................................................................##...#..#......######.................===.............................====..............................................................................................#.......##...................................................................",
    "..............................#^^^#^^^#...=......^^.......##^^^^^^^^^^^^^^^^^^^^#######################################.......##.......^^.......##^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^#^^^^^###^^^^^^^^^^^^^^^^^^^^^^^^^^^^^===....................##.....^^........................................^^...............===.............................#^^^#^^^#^^^...===.......^^......^^......^^...........................^^........",
    "########################################################################################################################################################################################################################################################################################################################################################################################################################"
];

let blocks = [];
let spikes = [];
let fallingIcicles = [];
let obstacleXCoords = [];

function parseLevel() {
    blocks = []; spikes = []; fallingIcicles = []; obstacleXCoords = [];
    const recordedCols = new Set();

    for (let r = 0; r < mapGrid.length; r++) {
        for (let c = 0; c < mapGrid[r].length; c++) {
            let ch = mapGrid[r][c];
            let x = c * TILE_SIZE;
            let y = r * TILE_SIZE;

            if (ch === '#' || ch === '=') {
                blocks.push({ x, y, w: TILE_SIZE, h: TILE_SIZE, slippery: (ch === '=') });
                if (r < 10 && !recordedCols.has(c)) {
                    obstacleXCoords.push(x);
                    recordedCols.add(c);
                }
            } else if (ch === '^') {
                spikes.push({ x, y });
                if (!recordedCols.has(c)) {
                    obstacleXCoords.push(x);
                    recordedCols.add(c);
                }
            } else if (ch === 'F') {
                fallingIcicles.push({
                    x: x + TILE_SIZE / 2,
                    y: 20,
                    w: 16,
                    h: 30,
                    vy: 0,
                    triggered: false,
                    triggerDist: 260
                });
                if (!recordedCols.has(c)) {
                    obstacleXCoords.push(x);
                    recordedCols.add(c);
                }
            }
        }
    }
    obstacleXCoords.sort((a, b) => a - b);
}
parseLevel();

let baseSpeed = 5.7;
let player = {
    x: 120, y: 320, size: 34,
    vx: baseSpeed, vy: 0,
    gravity: 0.75, jumpForce: -12.4,
    angle: 0, onGround: false, onSlippery: false
};

let cameraX = 0;
let particles = [];
let snowParticles = [];
let musicStarted = false;
let currentProgress = 0;
let auroraTimer = 0;
const totalObstacles = Math.max(1, obstacleXCoords.length);

for (let i = 0; i < 90; i++) {
    snowParticles.push({
        x: Math.random() * 800,
        y: Math.random() * 440,
        vx: Math.random() * 0.8 - 0.4,
        vy: Math.random() * 1.6 + 0.8,
        size: Math.random() * 2.8 + 1.2,
        opacity: Math.random() * 0.7 + 0.3
    });
}

function resetGame() {
    player = {
        x: 120, y: 320, size: 34,
        vx: baseSpeed, vy: 0,
        gravity: 0.75, jumpForce: -12.4,
        angle: 0, onGround: false, onSlippery: false
    };
    cameraX = 0;
    particles = [];
    currentProgress = 0;
    gameState = 'PLAYING';
    msgOverlay.style.display = 'none';
    parseLevel();
    if (musicStarted) { bgMusic.currentTime = 0; bgMusic.play().catch(() => {}); }
}

function die() {
    gameState = 'GAMEOVER';
    hitSound.currentTime = 0; hitSound.play().catch(() => {});
    bgMusic.pause();
    msgText.innerText = "FROZEN SHATTER";
    msgText.style.color = "#7cedff";
    overlayActionBtn.innerText = "TRY AGAIN";
    msgOverlay.style.display = 'flex';

    for (let i = 0; i < 22; i++) {
        particles.push({
            x: player.x + player.size / 2,
            y: player.y + player.size / 2,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 1.1) * 11,
            size: Math.random() * 7 + 2,
            rot: Math.random() * Math.PI,
            rotSpeed: (Math.random() - 0.5) * 0.3,
            life: 1.0,
            color: i % 2 === 0 ? '#00f0ff' : '#ffffff'
        });
    }
}

function win() {
    gameState = 'WIN';
    msgText.innerText = "❄️ PEAK CONQUERED! ❄️";
    msgText.style.color = "#a6f6ff";
    overlayActionBtn.innerText = "PLAY AGAIN";
    msgOverlay.style.display = 'flex';
}

function jump() {
    if (gameState === 'START') {
        musicStarted = true;
        bgMusic.play().catch(() => {});
        gameState = 'PLAYING';
    }
    if (gameState === 'PLAYING' && player.onGround) {
        player.vy = player.jumpForce;
        player.onGround = false;
    }
}

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        jump();
    }
});
window.addEventListener('mousedown', (e) => {
    if (e.target.tagName === 'CANVAS') jump();
});

function togglePause() {
    if (gameState === 'PLAYING') {
        gameState = 'PAUSED';
        bgMusic.pause();
        msgText.innerText = "PAUSED";
        msgText.style.color = "#ffffff";
        overlayActionBtn.innerText = "RESUME";
        msgOverlay.style.display = 'flex';
    } else if (gameState === 'PAUSED') {
        gameState = 'PLAYING';
        bgMusic.play().catch(() => {});
        msgOverlay.style.display = 'none';
    }
}

pauseBtn.addEventListener('click', togglePause);
resetBtn.addEventListener('click', resetGame);
overlayActionBtn.addEventListener('click', () => {
    if (gameState === 'PAUSED') togglePause();
    else resetGame();
});

function update() {
    if (gameState !== 'PLAYING') return;

    auroraTimer += 0.015;

    // Slippery friction vs normal running speed
    if (player.onGround && player.onSlippery) {
        player.vx = Math.min(8.2, player.vx + 0.12);
    } else {
        player.vx += (baseSpeed - player.vx) * 0.08;
    }

    player.vy += player.gravity;

    // Horizontal Movement & Collisions
    player.x += player.vx;
    for (let b of blocks) {
        if (player.x < b.x + b.w && player.x + player.size > b.x &&
            player.y < b.y + b.h && player.y + player.size > b.y) {
            die(); return;
        }
    }

    // Vertical Movement & Landings
    player.y += player.vy;
    player.onGround = false;
    player.onSlippery = false;

    for (let b of blocks) {
        if (player.x < b.x + b.w && player.x + player.size > b.x &&
            player.y < b.y + b.h && player.y + player.size > b.y) {
            if (player.vy > 0 && player.y + player.size - player.vy <= b.y + 14) {
                player.y = b.y - player.size;
                player.vy = 0;
                player.onGround = true;
                if (b.slippery) player.onSlippery = true;
            } else if (player.vy < 0) {
                die(); return;
            }
        }
    }

    // Floor Icicle Collision
    let pRect = { x: player.x + 6, y: player.y + 6, w: player.size - 12, h: player.size - 12 };
    for (let sp of spikes) {
        let sx = sp.x + 8, sy = sp.y + 16, sw = 24, sh = 24;
        if (pRect.x < sx + sw && pRect.x + pRect.w > sx && pRect.y < sy + sh && pRect.y + pRect.h > sy) {
            die(); return;
        }
    }

    // Falling Icicle Triggers & Collision
    for (let fi of fallingIcicles) {
        if (!fi.triggered && fi.x - player.x < fi.triggerDist && fi.x > player.x) {
            fi.triggered = true;
        }
        if (fi.triggered) {
            fi.vy += 0.55;
            fi.y += fi.vy;
            let fx = fi.x - fi.w / 2;
            if (pRect.x < fx + fi.w && pRect.x + pRect.w > fx && pRect.y < fi.y + fi.h && pRect.y + pRect.h > fi.y) {
                die(); return;
            }
        }
    }

    // Rotation
    if (!player.onGround) {
        player.angle += 0.125;
    } else {
        player.angle = Math.round(player.angle / (Math.PI / 2)) * (Math.PI / 2);
    }

    cameraX = player.x - 180;

    // Real Obstacle Progress
    let passedCount = 0;
    for (let ox of obstacleXCoords) {
        if (player.x > ox) passedCount++;
        else break;
    }

    let rawPercent = Math.floor((passedCount / totalObstacles) * 100);
    currentProgress = Math.min(100, Math.max(0, rawPercent));

    uiProgressText.innerText = `PROGRESS: ${currentProgress}%`;
    uiProgressBar.style.width = `${currentProgress}%`;

    if (currentProgress > bestProgress) {
        bestProgress = currentProgress;
        localStorage.setItem('objectRunFrostBest', bestProgress);
        uiBest.innerText = `BEST: ${bestProgress}%`;
    }

    if (currentProgress >= 100) win();
}

function drawBackground() {
    let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, '#020713');
    grad.addColorStop(0.5, '#07162b');
    grad.addColorStop(1, '#112b48');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Aurora Lights
    ctx.save();
    for (let i = 0; i < 3; i++) {
        let aGrad = ctx.createLinearGradient(0, 40, canvas.width, 160);
        aGrad.addColorStop(0, 'rgba(0, 255, 180, 0)');
        aGrad.addColorStop(0.5, `rgba(${0 + i * 40}, 240, 255, ${0.12 + Math.sin(auroraTimer + i) * 0.05})`);
        aGrad.addColorStop(1, 'rgba(120, 0, 255, 0)');
        ctx.fillStyle = aGrad;
        ctx.beginPath();
        ctx.moveTo(0, 60 + Math.sin(auroraTimer + i) * 20);
        ctx.bezierCurveTo(200, 20 + Math.cos(auroraTimer) * 30, 500, 120 + Math.sin(auroraTimer) * 25, 800, 70);
        ctx.lineTo(800, 0);
        ctx.lineTo(0, 0);
        ctx.fill();
    }
    ctx.restore();

    // Distant Snowy Mountain Peaks
    ctx.fillStyle = '#0a1d35';
    ctx.beginPath();
    ctx.moveTo(0, canvas.height);
    for (let x = 0; x <= canvas.width + 120; x += 100) {
        let peakY = 220 + Math.sin((x + cameraX * 0.12) * 0.007) * 60;
        ctx.lineTo(x, peakY);
    }
    ctx.lineTo(canvas.width, canvas.height);
    ctx.fill();

    // Foreground Mountain Ridges with Snow Caps
    ctx.fillStyle = '#102742';
    ctx.beginPath();
    ctx.moveTo(0, canvas.height);
    for (let x = 0; x <= canvas.width + 100; x += 80) {
        let peakY = 260 + Math.cos((x + cameraX * 0.22) * 0.009) * 45;
        ctx.lineTo(x, peakY);
    }
    ctx.lineTo(canvas.width, canvas.height);
    ctx.fill();

    // Falling Snowflakes
    for (let s of snowParticles) {
        s.y += s.vy;
        s.x += s.vx;
        if (s.y > canvas.height) { s.y = -5; s.x = Math.random() * canvas.width; }
        if (s.x < 0) s.x = canvas.width;
        if (s.x > canvas.width) s.x = 0;

        ctx.fillStyle = `rgba(230, 248, 255, ${s.opacity})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size / 2, 0, Math.PI * 2);
        ctx.fill();
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();

    ctx.save();
    ctx.translate(-cameraX, 0);

    // Render Blocks
    for (let b of blocks) {
        if (b.x > cameraX - TILE_SIZE && b.x < cameraX + 850) {
            ctx.shadowBlur = b.slippery ? 14 : 8;
            ctx.shadowColor = b.slippery ? '#ffffff' : '#00f0ff';
            ctx.fillStyle = b.slippery ? '#133554' : '#0a1d30';
            ctx.fillRect(b.x, b.y, b.w, b.h);

            ctx.strokeStyle = b.slippery ? '#d6f8ff' : '#00f0ff';
            ctx.lineWidth = 2;
            ctx.strokeRect(b.x, b.y, b.w, b.h);

            // Top Frosted Ice Crust
            ctx.fillStyle = b.slippery ? '#ffffff' : '#a8f2ff';
            ctx.fillRect(b.x + 1, b.y + 1, b.w - 2, 4);
        }
    }

    // Render Spikes (Icicles)
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#00f0ff';
    for (let sp of spikes) {
        if (sp.x > cameraX - TILE_SIZE && sp.x < cameraX + 850) {
            ctx.fillStyle = '#7eedff';
            ctx.beginPath();
            ctx.moveTo(sp.x + TILE_SIZE / 2, sp.y + 4);
            ctx.lineTo(sp.x + TILE_SIZE - 4, sp.y + TILE_SIZE);
            ctx.lineTo(sp.x + 4, sp.y + TILE_SIZE);
            ctx.closePath();
            ctx.fill();

            // Inner crystalline core
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(sp.x + TILE_SIZE / 2, sp.y + 8);
            ctx.lineTo(sp.x + TILE_SIZE / 2 + 3, sp.y + TILE_SIZE);
            ctx.lineTo(sp.x + TILE_SIZE / 2 - 3, sp.y + TILE_SIZE);
            ctx.closePath();
            ctx.fill();
        }
    }

    // Render Overhead Falling Icicles
    for (let fi of fallingIcicles) {
        if (fi.x > cameraX - 100 && fi.x < cameraX + 850) {
            ctx.fillStyle = '#c8f7ff';
            ctx.beginPath();
            ctx.moveTo(fi.x, fi.y + fi.h);
            ctx.lineTo(fi.x - fi.w / 2, fi.y);
            ctx.lineTo(fi.x + fi.w / 2, fi.y);
            ctx.closePath();
            ctx.fill();
        }
    }

    // Render Player Cube
    if (gameState !== 'GAMEOVER') {
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00f0ff';
        ctx.fillStyle = '#00f0ff';
        ctx.save();
        ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
        ctx.rotate(player.angle);
        ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-player.size / 4, -player.size / 4, player.size / 2, player.size / 2);
        ctx.restore();
    }

    // Death Shatter Explosion
    if (gameState === 'GAMEOVER') {
        for (let p of particles) {
            if (p.life > 0) {
                p.vy += 0.55;
                p.x += p.vx;
                p.y += p.vy;
                p.rot += p.rotSpeed;
                p.life -= 0.022;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();
            }
        }
        ctx.globalAlpha = 1.0;
    }

    ctx.restore();

    if (gameState === 'START') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.fillRect(0, 0, 800, 440);
        ctx.fillStyle = '#9df2ff';
        ctx.font = '22px Orbitron';
        ctx.textAlign = 'center';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#00f0ff';
        ctx.fillText("CLICK OR PRESS SPACE TO RUN ON ICE", 400, 220);
        ctx.textAlign = 'left';
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
