<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>SHOOTOUT ⚔️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #38b6ff;
            font-family: 'Rajdhani', sans-serif;
            color: #ffffff;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            outline: none;
        }

        /* Arcade HUD */
        #hud {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 680px;
            z-index: 20;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        #hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Orbitron', monospace, sans-serif;
            font-size: 13px;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: 1.5px;
        }

        #hud-stage {
            color: #ffea00;
            text-shadow: 0 0 10px rgba(255, 234, 0, 0.7);
        }

        #hud-score {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.7);
        }

        .bar-box {
            background: rgba(10, 15, 30, 0.75);
            border: 2px solid rgba(255, 255, 255, 0.85);
            height: 18px;
            border-radius: 6px;
            margin-bottom: 6px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            position: relative;
        }

        .bar-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #fff;
            text-shadow: 1px 1px 3px #000;
        }

        #p-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #00ff88, #00f0ff);
            transition: width 0.1s linear;
        }

        #b-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff0055, #ffaa00);
            transition: width 0.1s linear;
        }

        /* Precision Reticle */
        #reticle {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 26px;
            height: 26px;
            pointer-events: none;
            z-index: 20;
        }

        #reticle .ring {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(0, 240, 255, 0.85);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0,240,255,0.7);
        }

        #reticle .dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background: #ffea00;
            border-radius: 50%;
        }

        /* Hit Flash & Transition Curtain */
        #hit-flash {
            position: fixed;
            inset: 0;
            background: rgba(255, 0, 40, 0.35);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.08s ease;
            z-index: 30;
        }

        #stage-fade {
            position: fixed;
            inset: 0;
            background: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 50;
        }

        /* Notification Toast (Health orb drops / pickup) */
        #toast-banner {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 900;
            color: #00ffaa;
            text-shadow: 0 0 10px #00ffaa;
            background: rgba(10, 15, 30, 0.85);
            padding: 7px 22px;
            border-radius: 20px;
            border: 2px solid #00ffaa;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 45;
        }

        /* Mobile Controls */
        #mobile-ui {
            display: none;
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 40;
        }

        #joy-base {
            position: absolute;
            bottom: 25px;
            left: 25px;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid rgba(255, 234, 0, 0.7);
            background: radial-gradient(circle, rgba(0,240,255,0.2), rgba(10,15,30,0.6));
            pointer-events: auto;
            touch-action: none;
        }

        #joy-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #ffea00;
            box-shadow: 0 0 12px #ffaa00;
            pointer-events: none;
        }

        .touch-btn {
            position: absolute;
            border: 2px solid #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            color: #fff;
        }

        #btn-jump {
            bottom: 125px;
            right: 30px;
            width: 62px;
            height: 62px;
            background: rgba(0, 255, 170, 0.35);
            border-color: #00ffaa;
        }

        #btn-fire {
            bottom: 30px;
            right: 30px;
            width: 80px;
            height: 80px;
            background: rgba(255, 0, 85, 0.4);
            border-color: #ff0055;
        }
    </style>
    <!-- Babylon.js Core Engine -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>

    <div id="hit-flash"></div>
    <div id="stage-fade"></div>
    <div id="toast-banner">VITALITY ORB SPAWNED!</div>
    <div id="reticle"><div class="ring"></div><div class="dot"></div></div>

    <div id="hud">
        <div id="hud-header">
            <span id="hud-stage">STAGE 1: CITADEL COURTYARD</span>
            <span id="hud-score">CONQUERED: 0</span>
        </div>
        <div class="bar-box">
            <div id="p-bar"></div>
            <div class="bar-label">MECH VITALITY</div>
        </div>
        <div class="bar-box">
            <div id="b-bar"></div>
            <div id="boss-label" class="bar-label">TITAN HEALTH</div>
        </div>
    </div>

    <div id="mobile-ui">
        <div id="joy-base"><div id="joy-stick"></div></div>
        <div id="btn-jump" class="touch-btn">JUMP</div>
        <div id="btn-fire" class="touch-btn">FIRE</div>
    </div>

    <canvas id="renderCanvas"></canvas>

    <!-- Connects to external game runtime -->
    <script src="shootout.js"></script>
</body>
</html>
