<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3D Mech Boss Rush</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #03040b; overflow: hidden; font-family: 'Rajdhani', sans-serif; color: #fff; }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* HUD */
  #hud {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 90%; max-width: 600px; display: flex; flex-direction: column; gap: 7px;
    pointer-events: none; z-index: 10;
  }
  #stats-panel {
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 1.5px;
    text-shadow: 0 0 10px #00f0ff;
  }
  .bar-container {
    background: rgba(8, 12, 28, 0.8); border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px; height: 18px; position: relative; overflow: hidden;
    backdrop-filter: blur(6px);
  }
  .bar-fill { height: 100%; width: 100%; transition: width 0.12s linear; }
  #hp-player-bar { background: linear-gradient(90deg, #00ffaa, #00f0ff); box-shadow: 0 0 12px #00ffaa; }
  #hp-boss-bar { background: linear-gradient(90deg, #ff0055, #ffaa00); box-shadow: 0 0 12px #ff0055; }
  .bar-label {
    position: absolute; inset: 0; font-family: 'Orbitron', sans-serif;
    font-size: 10px; font-weight: 900; letter-spacing: 1.5px;
    display: flex; align-items: center; justify-content: center;
    text-shadow: 0 0 6px #000;
  }

  /* Center Crosshair */
  #reticle {
    position: absolute; top: 50%; left: 50%; width: 18px; height: 18px;
    transform: translate(-50%, -50%); border: 2px solid rgba(0, 240, 255, 0.45);
    border-radius: 50%; pointer-events: none; z-index: 5;
  }
  #reticle::after {
    content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
    background: #00f0ff; transform: translate(-50%, -50%); border-radius: 50%;
  }

  /* Mobile Touch Controls */
  #mobile-ui { display: none; position: absolute; inset: 0; pointer-events: none; z-index: 20; }
  .touch-btn {
    pointer-events: auto; position: absolute; border-radius: 50%;
    font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid rgba(255,255,255,0.4); backdrop-filter: blur(8px);
    touch-action: none;
  }
  #btn-shoot {
    left: 28px; bottom: 35px; width: 80px; height: 80px;
    background: rgba(255, 0, 85, 0.25); border-color: #ff0055; color: #ff80a5;
    box-shadow: 0 0 18px rgba(255, 0, 85, 0.35);
  }
  #btn-jump {
    right: 48px; bottom: 165px; width: 58px; height: 58px;
    background: rgba(0, 255, 170, 0.25); border-color: #00ffaa; color: #a6ffd8;
    box-shadow: 0 0 15px rgba(0, 255, 170, 0.35);
  }
  #joystick-zone {
    right: 25px; bottom: 25px; width: 125px; height: 125px; position: absolute;
    border-radius: 50%; border: 2px dashed rgba(0, 240, 255, 0.35);
    background: rgba(4, 9, 24, 0.4); pointer-events: auto; touch-action: none;
  }
  #joystick-thumb {
    width: 48px; height: 48px; border-radius: 50%; background: #00f0ff;
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    box-shadow: 0 0 14px #00f0ff; pointer-events: none;
  }

  /* Damage Screen Flash */
  #hit-flash {
    position: absolute; inset: 0; pointer-events: none; background: rgba(255, 0, 50, 0.35);
    opacity: 0; transition: opacity 0.08s ease; z-index: 15;
  }

  /* Desktop Key Legend Note */
  #desktop-legend {
    position: absolute; bottom: 12px; left: 16px; font-size: 11px;
    color: rgba(255, 255, 255, 0.45); letter-spacing: 1px; pointer-events: none;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="hit-flash"></div>
<div id="reticle"></div>

<div id="hud">
  <div id="stats-panel">
    <span id="score-text">BOSSES CONQUERED: 0</span>
    <span id="best-text" style="color: #ffd700;">BEST: 0</span>
  </div>
  <div class="bar-container">
    <div id="hp-player-bar" class="bar-fill"></div>
    <div class="bar-label">MECH INTEGRITY</div>
  </div>
  <div class="bar-container">
    <div id="hp-boss-bar" class="bar-fill"></div>
    <div id="boss-name" class="bar-label">TARGET: STEEL GOLIATH</div>
  </div>
</div>

<div id="mobile-ui">
  <div id="btn-shoot" class="touch-btn">FIRE</div>
  <div id="btn-jump" class="touch-btn">JUMP</div>
  <div id="joystick-zone"><div id="joystick-thumb"></div></div>
</div>

<div id="desktop-legend">WASD = MOVE | SPACE = JUMP | CLICK / SHIFT = SHOOT</div>

<script>
// --- AUDIO SYNTHESIS ENGINE (Web Audio API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playFx(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);

  if (type === 'laser') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(800, now);
    osc.frequency.exponentialRampToValueAtTime(100, now + 0.12);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.12);
    osc.start(now); osc.stop(now + 0.12);
  } else if (type === 'boss_shot') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(260, now);
    osc.frequency.exponentialRampToValueAtTime(45, now + 0.22);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.22);
    osc.start(now); osc.stop(now + 0.22);
  } else if (type === 'hit') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.linearRampToValueAtTime(30, now + 0.15);
    gain.gain.setValueAtTime(0.35, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.15);
    osc.start(now); osc.stop(now + 0.15);
  } else if (type === 'explode') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(70, now);
    osc.frequency.linearRampToValueAtTime(15, now + 0.45);
    gain.gain.setValueAtTime(0.5, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.45);
    osc.start(now); osc.stop(now + 0.45);
  }
}

// --- THREE.JS SCENE SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040510);
scene.fog = new THREE.FogExp2(0x040510, 0.012);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.AmbientLight(0x354060, 1.2));
const dirLight = new THREE.DirectionalLight(0xaad5ff, 1.4);
dirLight.position.set(30, 60, 40);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
scene.add(dirLight);

// --- RECTANGULAR ARENA SETUP ---
const ARENA_W = 60;  // X half-span (-60 to +60)
const ARENA_L = 90;  // Z half-span (-90 to +90)

// 1. Grid Floor Texture
const floorTexCanvas = document.createElement('canvas');
floorTexCanvas.width = 256; floorTexCanvas.height = 256;
const fCtx = floorTexCanvas.getContext('2d');
fCtx.fillStyle = '#080c1d'; fCtx.fillRect(0, 0, 256, 256);
fCtx.strokeStyle = '#00f0ff33'; fCtx.lineWidth = 4;
fCtx.strokeRect(0, 0, 256, 256);
fCtx.strokeStyle = '#ff00ea18'; fCtx.lineWidth = 2;
fCtx.beginPath(); fCtx.moveTo(0, 128); fCtx.lineTo(256, 128); fCtx.moveTo(128, 0); fCtx.lineTo(128, 256); fCtx.stroke();

const floorTex = new THREE.CanvasTexture(floorTexCanvas);
floorTex.wrapS = THREE.RepeatWrapping;
floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(ARENA_W / 6, ARENA_L / 6);

const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.7, metalness: 0.2 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ARENA_W * 2, ARENA_L * 2), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// 2. Rectangular Perimeter Energy Walls & Corner Pylons
const wallMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.18, side: THREE.DoubleSide });
const wallBorderMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
const pylonGeo = new THREE.BoxGeometry(3, 16, 3);
const pylonMat = new THREE.MeshStandardMaterial({ color: 0x11162b, roughness: 0.4, metalness: 0.8 });

function buildWall(x, z, w, l) {
  const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 8, l), wallMat);
  wall.position.set(x, 4, z);
  scene.add(wall);

  const topRail = new THREE.Mesh(new THREE.BoxGeometry(w + 0.2, 0.4, l + 0.2), wallBorderMat);
  topRail.position.set(x, 8, z);
  scene.add(topRail);
}
buildWall(0, -ARENA_L, ARENA_W * 2, 0.8);
buildWall(0, ARENA_L, ARENA_W * 2, 0.8);
buildWall(-ARENA_W, 0, 0.8, ARENA_L * 2);
buildWall(ARENA_W, 0, 0.8, ARENA_L * 2);

[[-ARENA_W, -ARENA_L], [ARENA_W, -ARENA_L], [-ARENA_W, ARENA_L], [ARENA_W, ARENA_L]].forEach(([px, pz]) => {
  const pylon = new THREE.Mesh(pylonGeo, pylonMat);
  pylon.position.set(px, 8, pz);
  const beacon = new THREE.Mesh(new THREE.SphereGeometry(1.2, 12, 12), new THREE.MeshBasicMaterial({ color: 0x00f0ff }));
  beacon.position.set(0, 8.5, 0);
  pylon.add(beacon);
  scene.add(pylon);
});

// --- CHARACTER MODELS ---

// 1. Player Combat Mech Rig
function buildPlayerMech() {
  const root = new THREE.Group();
  const matArmor = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.4, metalness: 0.6 });
  const matCyan = new THREE.MeshStandardMaterial({ color: 0x00e5ff, roughness: 0.2, metalness: 0.5 });
  const matVisor = new THREE.MeshBasicMaterial({ color: 0x00ffff });

  // Torso
  const torso = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.8, 1.2), matArmor);
  torso.position.y = 2.4;
  torso.castShadow = true;
  root.add(torso);

  const chestPlate = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.1, 0.6), matCyan);
  chestPlate.position.set(0, 0.2, 0.5);
  torso.add(chestPlate);

  // Head & Visor
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.7, 0.9), matArmor);
  head.position.set(0, 1.35, 0);
  const visor = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.25, 0.3), matVisor);
  visor.position.set(0, 0.05, 0.42);
  head.add(visor);
  torso.add(head);

  // Right Blaster Cannon Arm
  const rArm = new THREE.Group();
  rArm.position.set(1.15, 0.4, 0);
  const shoulderR = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), matCyan);
  const cannon = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.28, 1.6, 12), matArmor);
  cannon.rotation.x = Math.PI / 2;
  cannon.position.set(0.1, -0.4, 0.5);
  const muzzle = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.3, 12), matVisor);
  muzzle.rotation.x = Math.PI / 2;
  muzzle.position.set(0.1, -0.4, 1.35);
  rArm.add(shoulderR, cannon, muzzle);
  torso.add(rArm);

  // Left Arm
  const lArm = new THREE.Group();
  lArm.position.set(-1.15, 0.4, 0);
  const shoulderL = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), matCyan);
  const foreArm = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.2, 0.4), matArmor);
  foreArm.position.set(0, -0.5, 0);
  lArm.add(shoulderL, foreArm);
  torso.add(lArm);

  // Legs
  const legR = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.5, 0.6), matArmor);
  legR.position.set(0.5, 0.8, 0);
  legR.castShadow = true;
  const legL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.5, 0.6), matArmor);
  legL.position.set(-0.5, 0.8, 0);
  legL.castShadow = true;
  root.add(legR, legL);

  root.parts = { torso, rArm, lArm, legR, legL };
  return root;
}

// 2. Boss 1: Steel Goliath (Siege Walker)
function buildGoliath() {
  const g = new THREE.Group();
  const matHull = new THREE.MeshStandardMaterial({ color: 0x22252a, roughness: 0.5, metalness: 0.8 });
  const matRed = new THREE.MeshStandardMaterial({ color: 0xff0044, roughness: 0.3 });

  const core = new THREE.Mesh(new THREE.BoxGeometry(4.2, 2.6, 4.8), matHull);
  core.position.y = 4.0;
  core.castShadow = true;
  g.add(core);

  const dome = new THREE.Mesh(new THREE.SphereGeometry(1.6, 12, 12), matRed);
  dome.position.set(0, 1.4, 0.3);
  core.add(dome);

  [-1.8, 1.8].forEach(x => {
    const cannon = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.5, 4.5, 12), matHull);
    cannon.rotation.x = Math.PI / 2;
    cannon.position.set(x, 0.2, 2.6);
    core.add(cannon);
  });

  const legs = [];
  [[-2.4, -2], [2.4, -2], [-2.4, 2], [2.4, 2]].forEach(([lx, lz]) => {
    const legPivot = new THREE.Group();
    legPivot.position.set(lx, 3.2, lz);
    const upper = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.2, 0.8), matHull);
    upper.position.y = -1.0;
    const foot = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.6, 1.8), matRed);
    foot.position.y = -2.2;
    legPivot.add(upper, foot);
    g.add(legPivot);
    legs.push(legPivot);
  });

  g.parts = { core, legs };
  return g;
}

// 3. Boss 2: Cyber Phantom (Hover Recon Mech)
function buildPhantom() {
  const g = new THREE.Group();
  const matChassis = new THREE.MeshStandardMaterial({ color: 0x1a1528, roughness: 0.3, metalness: 0.9 });
  const matGold = new THREE.MeshStandardMaterial({ color: 0xffbb00, roughness: 0.2, metalness: 0.6 });
  const matWing = new THREE.MeshBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0.75, side: THREE.DoubleSide });

  const torso = new THREE.Mesh(new THREE.ConeGeometry(1.8, 4.0, 5), matChassis);
  torso.rotation.x = Math.PI;
  torso.position.y = 4.2;
  torso.castShadow = true;
  g.add(torso);

  const head = new THREE.Mesh(new THREE.OctahedronGeometry(1.0), matGold);
  head.position.set(0, 1.8, 0);
  torso.add(head);

  const lWing = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 1.2), matWing);
  lWing.position.set(-2.8, 0.5, -0.5);
  lWing.rotation.y = -0.3;
  const rWing = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 1.2), matWing);
  rWing.position.set(2.8, 0.5, -0.5);
  rWing.rotation.y = 0.3;
  torso.add(lWing, rWing);

  [-0.9, 0.9].forEach(rx => {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 3.2), matGold);
    rail.position.set(rx, -0.6, 1.4);
    torso.add(rail);
  });

  g.parts = { torso, lWing, rWing };
  return g;
}

// 4. Boss 3: Void Behemoth (Horned Demon Titan)
function buildBehemoth() {
  const g = new THREE.Group();
  const matObsidian = new THREE.MeshStandardMaterial({ color: 0x12081f, roughness: 0.6, metalness: 0.4 });
  const matPurple = new THREE.MeshStandardMaterial({ color: 0xa100ff, roughness: 0.3 });
  const matHorns = new THREE.MeshStandardMaterial({ color: 0xff0077, roughness: 0.2 });

  const chest = new THREE.Mesh(new THREE.BoxGeometry(4.5, 3.8, 3.2), matObsidian);
  chest.position.y = 4.6;
  chest.castShadow = true;
  g.add(chest);

  const crest = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.0, 1.8), matPurple);
  crest.position.set(0, 2.4, 0.4);
  chest.add(crest);

  [-1.4, 1.4].forEach(hx => {
    const horn = new THREE.Mesh(new THREE.ConeGeometry(0.55, 2.4, 8), matHorns);
    horn.position.set(hx, 1.2, 0);
    horn.rotation.z = hx > 0 ? -0.5 : 0.5;
    crest.add(horn);
  });

  const lArm = new THREE.Mesh(new THREE.BoxGeometry(1.4, 3.6, 1.4), matObsidian);
  lArm.position.set(-3.2, 0.2, 0.4);
  const rArm = new THREE.Mesh(new THREE.BoxGeometry(1.4, 3.6, 1.4), matObsidian);
  rArm.position.set(3.2, 0.2, 0.4);
  chest.add(lArm, rArm);

  const legL = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.8, 1.6), matObsidian);
  legL.position.set(-1.4, 1.4, 0);
  const legR = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.8, 1.6), matObsidian);
  legR.position.set(1.4, 1.4, 0);
  g.add(legL, legR);

  g.parts = { chest, lArm, rArm, legL, legR };
  return g;
}

// --- PLAYER STATE ---
const player = {
  mesh: buildPlayerMech(),
  hp: 100, maxHp: 100,
  speed: 24, vy: 0,
  angle: 0, shootCooldown: 0,
  animTime: 0
};
player.mesh.position.set(0, 0, 45);
scene.add(player.mesh);

// --- PROJECTILES ---
const bullets = [];
const bulletGeo = new THREE.SphereGeometry(0.35, 8, 8);

function fireProjectile(origin, angle, isPlayer = false, color = 0x00ffff, speed = 44, spread = 0) {
  const mat = new THREE.MeshBasicMaterial({ color });
  const mesh = new THREE.Mesh(bulletGeo, mat);
  mesh.position.copy(origin);
  mesh.position.y = Math.max(1.0, origin.y);
  scene.add(mesh);

  const dirAngle = angle + spread;
  bullets.push({
    mesh, isPlayer,
    vx: Math.sin(dirAngle) * speed,
    vz: Math.cos(dirAngle) * speed,
    life: 3.2
  });
}

// --- BOSS LOGIC & PROGRESSION ---
let bossesDefeated = 0;
let bestStreak = parseInt(localStorage.getItem('br_best_mech') || '0');
document.getElementById('best-text').innerText = `BEST: ${bestStreak}`;

let currentBoss = null;
const bossDefs = [
  { name: "STEEL GOLIATH", type: 0, build: buildGoliath, maxHp: 220, speed: 6.5, scale: 3.4 },
  { name: "CYBER PHANTOM", type: 1, build: buildPhantom, maxHp: 320, speed: 12.0, scale: 2.8 },
  { name: "VOID BEHEMOTH", type: 2, build: buildBehemoth, maxHp: 480, speed: 8.5, scale: 3.8 }
];

function spawnNextBoss() {
  if (currentBoss && currentBoss.mesh) scene.remove(currentBoss.mesh);

  const cycle = Math.floor(bossesDefeated / bossDefs.length);
  const def = bossDefs[bossesDefeated % bossDefs.length];
  const hpBonus = cycle * 160;

  const mesh = def.build();
  mesh.position.set(0, 0, -55);
  scene.add(mesh);

  currentBoss = {
    ...def,
    mesh,
    maxHp: def.maxHp + hpBonus,
    hp: def.maxHp + hpBonus,
    attackTimer: 1.2,
    chargeTimer: 0,
    stateTimer: 0
  };

  document.getElementById('boss-name').innerText = currentBoss.name + (cycle > 0 ? ` MK-${cycle + 1}` : "");
  document.getElementById('hp-boss-bar').style.width = '100%';
}

// --- INPUTS & CONTROLS ---
const input = { forward: 0, right: 0 };

function jump() {
  if (player.mesh.position.y <= 0.05) {
    player.vy = 12.0;
  }
}

function shoot() {
  if (player.shootCooldown <= 0) {
    const muzzlePos = new THREE.Vector3(0.5, 2.0, 1.2).applyQuaternion(player.mesh.quaternion).add(player.mesh.position);
    fireProjectile(muzzlePos, player.angle, true, 0x00f0ff, 50);
    player.shootCooldown = 0.16;
    playFx('laser');
  }
}

// Device Detection
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 820;

if (isMobile) {
  document.getElementById('mobile-ui').style.display = 'block';
  document.getElementById('desktop-legend').style.display = 'none';

  // Left side Shoot Button
  const sBtn = document.getElementById('btn-shoot');
  let autoShoot = null;
  sBtn.addEventListener('touchstart', (e) => {
    e.preventDefault(); shoot();
    autoShoot = setInterval(shoot, 160);
  });
  sBtn.addEventListener('touchend', () => clearInterval(autoShoot));

  // Right side Jump Button (above joystick)
  document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
    e.preventDefault(); jump();
  });

  // Right side Touch Joystick
  const joyZone = document.getElementById('joystick-zone');
  const joyThumb = document.getElementById('joystick-thumb');
  let touchId = null, baseRect = null;

  joyZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.changedTouches[0];
    touchId = touch.identifier;
    baseRect = joyZone.getBoundingClientRect();
  });

  window.addEventListener('touchmove', (e) => {
    if (touchId === null) return;
    for (let t of e.changedTouches) {
      if (t.identifier === touchId) {
        const dx = t.clientX - (baseRect.left + baseRect.width / 2);
        const dy = t.clientY - (baseRect.top + baseRect.height / 2);
        const dist = Math.min(50, Math.hypot(dx, dy));
        const angle = Math.atan2(dy, dx);

        joyThumb.style.transform = `translate(calc(-50% + ${Math.cos(angle) * dist}px), calc(-50% + ${Math.sin(angle) * dist}px))`;
        input.right = (Math.cos(angle) * dist) / 50;
        input.forward = -(Math.sin(angle) * dist) / 50;
      }
    }
  }, { passive: false });

  const endJoy = (e) => {
    for (let t of e.changedTouches) {
      if (t.identifier === touchId) {
        touchId = null;
        joyThumb.style.transform = `translate(-50%, -50%)`;
        input.forward = 0; input.right = 0;
      }
    }
  };
  window.addEventListener('touchend', endJoy);
  window.addEventListener('touchcancel', endJoy);

} else {
  // Desktop Controls: WASD + Space + Mouse Click OR Shift Key
  const keys = {};
  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.code === 'Space') jump();
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') shoot();
  });
  window.addEventListener('keyup', (e) => keys[e.code] = false);

  window.addEventListener('mousemove', (e) => {
    const dx = e.clientX - window.innerWidth / 2;
    const dy = e.clientY - window.innerHeight / 2;
    player.angle = Math.atan2(-dx, -dy);
  });

  window.addEventListener('mousedown', (e) => {
    if (e.button === 0) shoot();
  });

  function pollDesktop() {
    input.forward = (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0);
    input.right   = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);
  }
}

// --- DAMAGE & RESTART LOOP ---
function takeDamage(amt) {
  player.hp -= amt;
  playFx('hit');
  const flash = document.getElementById('hit-flash');
  flash.style.opacity = '1';
  setTimeout(() => flash.style.opacity = '0', 70);

  if (player.hp <= 0) {
    playFx('explode');
    resetGame();
  }
}

function resetGame() {
  player.hp = player.maxHp;
  player.mesh.position.set(0, 0, 45);
  player.vy = 0;
  bossesDefeated = 0;
  document.getElementById('score-text').innerText = `BOSSES CONQUERED: 0`;
  bullets.forEach(b => scene.remove(b.mesh));
  bullets.length = 0;
  spawnNextBoss();
}

// --- ENGINE LOOP ---
let lastFrameTime = performance.now();
spawnNextBoss();

function update(dt) {
  if (!isMobile) pollDesktop();

  // 1. Move Player
  const moveMag = Math.hypot(input.forward, input.right);
  if (moveMag > 0.05) {
    const normF = input.forward / Math.max(1, moveMag);
    const normR = input.right / Math.max(1, moveMag);

    player.mesh.position.x += normR * player.speed * dt;
    player.mesh.position.z -= normF * player.speed * dt;

    if (isMobile) player.angle = Math.atan2(-normR, normF);

    // Stride Animation
    player.animTime += dt * 14;
    player.mesh.parts.legR.rotation.x = Math.sin(player.animTime) * 0.55;
    player.mesh.parts.legL.rotation.x = -Math.sin(player.animTime) * 0.55;
    player.mesh.parts.lArm.rotation.x = Math.sin(player.animTime) * 0.4;
  } else {
    player.mesh.parts.legR.rotation.x = 0;
    player.mesh.parts.legL.rotation.x = 0;
    player.mesh.parts.lArm.rotation.x = 0;
  }

  // Constrain inside Rectangular Arena
  player.mesh.position.x = Math.max(-ARENA_W + 2, Math.min(ARENA_W - 2, player.mesh.position.x));
  player.mesh.position.z = Math.max(-ARENA_L + 2, Math.min(ARENA_L - 2, player.mesh.position.z));

  // Jump & Gravity
  player.mesh.position.y += player.vy * dt;
  if (player.mesh.position.y > 0) {
    player.vy -= 30 * dt;
  } else {
    player.mesh.position.y = 0;
    player.vy = 0;
  }
  player.mesh.rotation.y = player.angle;
  player.shootCooldown -= dt;

  // 2. Camera Tracking
  camera.position.x = player.mesh.position.x;
  camera.position.y = player.mesh.position.y + 16;
  camera.position.z = player.mesh.position.z + 24;
  camera.lookAt(player.mesh.position.x, player.mesh.position.y + 3.0, player.mesh.position.z - 8);

  // 3. Boss Behaviors & Patterns
  if (currentBoss) {
    const toPlayer = new THREE.Vector3().subVectors(player.mesh.position, currentBoss.mesh.position);
    const dist = toPlayer.length();
    toPlayer.y = 0;
    toPlayer.normalize();

    currentBoss.attackTimer -= dt;
    currentBoss.stateTimer += dt;

    const targetAngle = Math.atan2(toPlayer.x, toPlayer.z);
    currentBoss.mesh.rotation.y = targetAngle;

    if (currentBoss.type === 0) { // Goliath: Forward march & spread blast
      if (dist > 18) {
        currentBoss.mesh.position.x += toPlayer.x * currentBoss.speed * dt;
        currentBoss.mesh.position.z += toPlayer.z * currentBoss.speed * dt;
      }
      currentBoss.mesh.parts.legs.forEach((l, i) => {
        l.rotation.x = Math.sin(currentBoss.stateTimer * 6 + i) * 0.4;
      });

      if (currentBoss.attackTimer <= 0) {
        for (let s = -0.35; s <= 0.35; s += 0.35) {
          fireProjectile(currentBoss.mesh.position.clone().add(new THREE.Vector3(0, 3.8, 0)), targetAngle, false, 0xff0055, 26, s);
        }
        playFx('boss_shot');
        currentBoss.attackTimer = 1.3;
      }
    } 
    else if (currentBoss.type === 1) { // Phantom: Erratic hovering & railgun salvo
      const strafeX = -toPlayer.z;
      const strafeZ = toPlayer.x;
      const strafeDir = Math.sin(currentBoss.stateTimer * 2) > 0 ? 1 : -1;

      currentBoss.mesh.position.x += (toPlayer.x * 0.3 + strafeX * strafeDir) * currentBoss.speed * dt;
      currentBoss.mesh.position.z += (toPlayer.z * 0.3 + strafeZ * strafeDir) * currentBoss.speed * dt;
      currentBoss.mesh.position.y = 3.5 + Math.sin(currentBoss.stateTimer * 4) * 0.8;

      if (currentBoss.attackTimer <= 0) {
        fireProjectile(currentBoss.mesh.position.clone().add(new THREE.Vector3(0, 2, 0)), targetAngle, false, 0xffbb00, 38, (Math.random() - 0.5) * 0.15);
        playFx('boss_shot');
        currentBoss.attackTimer = 0.38;
      }
    } 
    else if (currentBoss.type === 2) { // Behemoth: Periodic charges & shockwave bursts
      if (currentBoss.chargeTimer > 0) {
        currentBoss.chargeTimer -= dt;
        currentBoss.mesh.position.x += toPlayer.x * 24 * dt;
        currentBoss.mesh.position.z += toPlayer.z * 24 * dt;
      } else {
        currentBoss.mesh.position.x += toPlayer.x * currentBoss.speed * dt;
        currentBoss.mesh.position.z += toPlayer.z * currentBoss.speed * dt;
      }

      if (currentBoss.attackTimer <= 0) {
        for (let i = 0; i < 14; i++) {
          fireProjectile(currentBoss.mesh.position.clone().add(new THREE.Vector3(0, 2.5, 0)), (i / 14) * Math.PI * 2, false, 0xa100ff, 20);
        }
        playFx('boss_shot');
        currentBoss.chargeTimer = 1.0;
        currentBoss.attackTimer = 2.4;
      }
    }

    currentBoss.mesh.position.x = Math.max(-ARENA_W + 4, Math.min(ARENA_W - 4, currentBoss.mesh.position.x));
    currentBoss.mesh.position.z = Math.max(-ARENA_L + 4, Math.min(ARENA_L - 4, currentBoss.mesh.position.z));
  }

  // 4. Projectiles Physics & Collision Checks
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.mesh.position.x += b.vx * dt;
    b.mesh.position.z += b.vz * dt;
    b.life -= dt;

    if (Math.abs(b.mesh.position.x) >= ARENA_W || Math.abs(b.mesh.position.z) >= ARENA_L || b.life <= 0) {
      scene.remove(b.mesh);
      bullets.splice(i, 1);
      continue;
    }

    // Player Bullet -> Hits Boss
    if (b.isPlayer && currentBoss) {
      const bDist = b.mesh.position.distanceTo(currentBoss.mesh.position.clone().add(new THREE.Vector3(0, 2.5, 0)));
      if (bDist < currentBoss.scale) {
        currentBoss.hp -= 12;
        scene.remove(b.mesh);
        bullets.splice(i, 1);

        if (currentBoss.hp <= 0) {
          playFx('explode');
          bossesDefeated++;
          document.getElementById('score-text').innerText = `BOSSES CONQUERED: ${bossesDefeated}`;
          if (bossesDefeated > bestStreak) {
            bestStreak = bossesDefeated;
            localStorage.setItem('br_best_mech', bestStreak);
            document.getElementById('best-text').innerText = `BEST: ${bestStreak}`;
          }
          spawnNextBoss();
        }
        continue;
      }
    }

    // Boss Bullet -> Hits Player Mech
    if (!b.isPlayer) {
      const pCenter = player.mesh.position.clone().add(new THREE.Vector3(0, 1.8, 0));
      if (b.mesh.position.distanceTo(pCenter) < 1.4) {
        takeDamage(14);
        scene.remove(b.mesh);
        bullets.splice(i, 1);
        continue;
      }
    }
  }

  // 5. Update Health Bars
  document.getElementById('hp-player-bar').style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
  if (currentBoss) {
    document.getElementById('hp-boss-bar').style.width = Math.max(0, (currentBoss.hp / currentBoss.maxHp) * 100) + '%';
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastFrameTime) / 1000, 0.08);
  lastFrameTime = now;
  update(dt);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
