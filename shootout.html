<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>SHOOTOUT ⚔️</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Rajdhani', sans-serif; }
  #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; }

  /* Stylized HUD */
  #hud {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    width: 90%; max-width: 680px; z-index: 20; pointer-events: none;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  #hud-header {
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 900;
    margin-bottom: 8px; letter-spacing: 1.5px;
  }
  #hud-stage { color: #ffdd00; text-shadow: 0 0 10px rgba(255, 221, 0, 0.6); }
  #hud-score { color: #ffffff; text-shadow: 0 0 10px rgba(0, 240, 255, 0.6); }

  .bar-box {
    background: rgba(10, 15, 30, 0.75); border: 2px solid rgba(255, 255, 255, 0.8);
    height: 18px; border-radius: 6px; margin-bottom: 6px; overflow: hidden;
    backdrop-filter: blur(8px); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  #p-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #00ff88, #00f0ff); transition: width 0.1s linear; }
  #b-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #ff0055, #ffaa00); transition: width 0.1s linear; }

  /* Precision Reticle */
  #reticle {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 28px; height: 28px; pointer-events: none; z-index: 20;
  }
  #reticle .circle {
    position: absolute; inset: 0; border: 2px solid rgba(0, 240, 255, 0.7);
    border-radius: 50%; box-shadow: 0 0 8px rgba(0,240,255,0.6);
  }
  #reticle .dot {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 4px; height: 4px; background: #ffea00; border-radius: 50%;
  }

  /* Screen Hit Damage Flash */
  #hit-flash {
    position: fixed; inset: 0; background: rgba(255, 0, 40, 0.35);
    opacity: 0; pointer-events: none; transition: opacity 0.08s ease; z-index: 30;
  }

  /* Transition Fade */
  #fade-curtain {
    position: fixed; inset: 0; background: #000;
    opacity: 0; pointer-events: none; transition: opacity 0.5s ease; z-index: 50;
  }

  /* Mobile Controls */
  #mobile-ui { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 40; }
  #joy-base {
    position: absolute; bottom: 25px; left: 25px; width: 130px; height: 130px; border-radius: 50%;
    border: 3px solid rgba(255, 221, 0, 0.7); background: radial-gradient(circle, rgba(0,240,255,0.2), rgba(10,15,30,0.6));
    pointer-events: auto; touch-action: none;
  }
  #joy-stick {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 50px; height: 50px; border-radius: 50%; background: #ffea00; box-shadow: 0 0 12px #ffaa00;
    pointer-events: none;
  }
  .touch-btn {
    position: absolute; border: 2px solid #fff; font-family: 'Orbitron', sans-serif;
    font-weight: 900; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    pointer-events: auto; backdrop-filter: blur(6px);
  }
  #btn-jump { bottom: 125px; right: 30px; width: 62px; height: 62px; background: rgba(0, 255, 170, 0.35); border-color: #00ffaa; color: #fff; }
  #btn-fire { bottom: 30px; right: 30px; width: 80px; height: 80px; background: rgba(255, 0, 85, 0.4); border-color: #ff0055; color: #fff; }
</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>

<div id="hit-flash"></div>
<div id="fade-curtain"></div>
<div id="reticle"><div class="circle"></div><div class="dot"></div></div>

<div id="hud">
  <div id="hud-header">
    <span id="hud-stage">STAGE 1: CITADEL COURTYARD</span>
    <span id="hud-score">CONQUERED: 0</span>
  </div>
  <div class="bar-box"><div id="p-bar"></div></div>
  <div class="bar-box"><div id="b-bar"></div></div>
</div>

<div id="mobile-ui">
  <div id="joy-base"><div id="joy-stick"></div></div>
  <div id="btn-jump" class="touch-btn">JUMP</div>
  <div id="btn-fire" class="touch-btn">FIRE</div>
</div>

<canvas id="renderCanvas"></canvas>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById('renderCanvas');
  const engine = new BABYLON.Engine(canvas, true, { antialias: true, adaptToDeviceRatio: true });

  const state = {
    stage: 0,
    score: 0,
    playerHp: 100,
    maxHp: 100,
    bossHp: 240,
    maxBossHp: 240,
    isTransitioning: false,
    isMobile: /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 820
  };

  const ARENA_W = 64;
  const ARENA_L = 84;
  const WALL_H = 18;

  let scene, camera, sun, fillLight, shadowGen;
  let boss = null;
  let stageMeshes = [];
  let boneObstacles = [];
  let bullets = [];
  let particles = null;

  // FPS Weapon Viewmodel
  let weaponRoot, muzzleFlash, recoil = 0;
  let walkBob = 0, playerVy = 0;
  let isPointerLocked = false;
  const input = { forward: 0, right: 0 };

  // Audio Engine
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);

    if (type === 'fire') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(850, now);
      osc.frequency.exponentialRampToValueAtTime(120, now + 0.1);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'enemy_fire') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(260, now);
      osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.2);
      osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'hit') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.linearRampToValueAtTime(30, now + 0.14);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.14);
      osc.start(now); osc.stop(now + 0.14);
    } else if (type === 'fanfare') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(780, now + 0.4);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.4);
      osc.start(now); osc.stop(now + 0.4);
    }
  }

  // ========================================================================
  // PROCEDURAL HIGH-RESOLUTION TEXTURE ENGINE
  // ========================================================================
  function createProceduralTexture(type) {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');

    if (type === 'castle-stone') {
      ctx.fillStyle = '#d0d7de'; ctx.fillRect(0, 0, 512, 512);
      ctx.strokeStyle = '#8c95a6'; ctx.lineWidth = 6;
      const rows = 8, cols = 4;
      const rh = 512 / rows, cw = 512 / cols;
      for (let r = 0; r < rows; r++) {
        const offset = (r % 2) * (cw / 2);
        for (let col = -1; col <= cols; col++) {
          ctx.strokeRect(col * cw + offset, r * rh, cw, rh);
          // Stone surface weathering
          for (let p = 0; p < 8; p++) {
            ctx.fillStyle = Math.random() > 0.5 ? '#b8c0cc' : '#e6ebf2';
            ctx.fillRect(col * cw + offset + Math.random() * (cw - 8), r * rh + Math.random() * (rh - 8), 12, 10);
          }
        }
      }
    } else if (type === 'castle-turf') {
      ctx.fillStyle = '#5fb32b'; ctx.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 600; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? '#73c938' : '#4d9421';
        ctx.fillRect(Math.random() * 512, Math.random() * 512, 4, 10);
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 4;
      ctx.strokeRect(0, 0, 512, 512);
    } else if (type === 'desert-sand') {
      ctx.fillStyle = '#e8ad46'; ctx.fillRect(0, 0, 512, 512);
      ctx.fillStyle = '#d49633';
      for (let i = 0; i < 1200; i++) ctx.fillRect(Math.random() * 512, Math.random() * 512, 3, 3);
      ctx.strokeStyle = 'rgba(255, 230, 160, 0.4)'; ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.moveTo(0, 120); ctx.bezierCurveTo(180, 180, 320, 60, 512, 140);
      ctx.stroke();
    } else if (type === 'jungle-moss') {
      ctx.fillStyle = '#2c7329'; ctx.fillRect(0, 0, 512, 512);
      ctx.fillStyle = '#1e521c';
      for (let i = 0; i < 80; i++) {
        ctx.beginPath();
        ctx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 30 + 8, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#42a33e';
      for (let i = 0; i < 400; i++) ctx.fillRect(Math.random() * 512, Math.random() * 512, 4, 8);
    }

    const tex = new BABYLON.DynamicTexture("pTex_" + type, c, scene);
    tex.wrapU = tex.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
    return tex;
  }

  // ========================================================================
  // SCENE & PHYSICALLY BASED LIGHTING
  // ========================================================================
  scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.42, 0.72, 0.98, 1.0);

  // Atmospheric Fog to give stadium grandeur
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogDensity = 0.007;
  scene.fogColor = new BABYLON.Color3(0.42, 0.72, 0.98);

  // FPS Eye Camera
  camera = new BABYLON.UniversalCamera("FpsCam", new BABYLON.Vector3(0, 2.0, 24), scene);
  camera.setTarget(new BABYLON.Vector3(0, 2.0, 0));
  camera.speed = 0;
  camera.angularSensibility = 2200;
  camera.minZ = 0.1;
  camera.fov = 1.15;
  camera.attachControl(canvas, true);

  // Skylight & Sun
  fillLight = new BABYLON.HemisphericLight("Hemi", new BABYLON.Vector3(0, 1, 0), scene);
  fillLight.intensity = 0.95;
  fillLight.diffuse = new BABYLON.Color3(1.0, 0.98, 0.92);
  fillLight.groundColor = new BABYLON.Color3(0.4, 0.5, 0.3);

  sun = new BABYLON.DirectionalLight("Sun", new BABYLON.Vector3(-0.6, -1.3, -0.7), scene);
  sun.position = new BABYLON.Vector3(35, 75, 45);
  sun.intensity = 1.35;

  // Cascaded Soft Shadow Mapping
  shadowGen = new BABYLON.ShadowGenerator(1024, sun);
  shadowGen.useBlurExponentialShadowMap = true;
  shadowGen.blurKernel = 16;
  shadowGen.darkness = 0.45;

  // ========================================================================
  // VIEWMODEL WEAPON RIG (Detailed Sci-Fi Carbine)
  // ========================================================================
  weaponRoot = new BABYLON.TransformNode("WeaponRoot", scene);
  weaponRoot.parent = camera;
  weaponRoot.position.set(0.4, -0.32, 0.78);

  const matPbrMetal = new BABYLON.PBRMaterial("wMetal", scene);
  matPbrMetal.albedoColor = new BABYLON.Color3(0.18, 0.24, 0.35);
  matPbrMetal.metallic = 0.85;
  matPbrMetal.roughness = 0.25;

  const matPbrGold = new BABYLON.PBRMaterial("wGold", scene);
  matPbrGold.albedoColor = new BABYLON.Color3(1.0, 0.75, 0.1);
  matPbrGold.metallic = 0.95;
  matPbrGold.roughness = 0.15;

  const wChassis = BABYLON.MeshBuilder.CreateBox("wChassis", { width: 0.18, height: 0.22, depth: 0.7 }, scene);
  wChassis.parent = weaponRoot;
  wChassis.material = matPbrMetal;

  const wRail = BABYLON.MeshBuilder.CreateBox("wRail", { width: 0.12, height: 0.08, depth: 0.5 }, scene);
  wRail.parent = weaponRoot;
  wRail.position.set(0, 0.13, 0.05);
  wRail.material = matPbrGold;

  [-0.045, 0.045].forEach(bx => {
    const b = BABYLON.MeshBuilder.CreateCylinder("wB", { height: 0.45, diameter: 0.08 }, scene);
    b.parent = weaponRoot;
    b.rotation.x = Math.PI / 2;
    b.position.set(bx, 0.02, 0.48);
    b.material = matPbrGold;
  });

  muzzleFlash = BABYLON.MeshBuilder.CreateSphere("MuzFlash", { diameter: 0.22 }, scene);
  muzzleFlash.parent = weaponRoot;
  muzzleFlash.position.set(0, 0.02, 0.75);
  const mMat = new BABYLON.StandardMaterial("mFlash", scene);
  mMat.emissiveColor = new BABYLON.Color3(0.0, 1.0, 1.0);
  muzzleFlash.material = mMat;
  muzzleFlash.isVisible = false;

  // ========================================================================
  // ATMOSPHERIC PARTICLE ENGINE
  // ========================================================================
  function startParticles(type) {
    if (particles) { particles.stop(); particles.dispose(); particles = null; }

    const p = new BABYLON.ParticleSystem("particles", 300, scene);
    const pCanv = document.createElement("canvas");
    pCanv.width = 16; pCanv.height = 16;
    const pctx = pCanv.getContext("2d");
    pctx.fillStyle = "#fff";
    pctx.beginPath(); pctx.arc(8, 8, 7, 0, Math.PI * 2); pctx.fill();
    p.particleTexture = new BABYLON.DynamicTexture("pTex", pCanv, scene);

    p.emitter = new BABYLON.Vector3(0, 4, 0);
    p.minEmitBox = new BABYLON.Vector3(-ARENA_W / 2, -1, -ARENA_L / 2);
    p.maxEmitBox = new BABYLON.Vector3(ARENA_W / 2, 8, ARENA_L / 2);

    if (type === 'castle') {
      p.color1 = new BABYLON.Color4(1.0, 0.9, 0.4, 0.7);
      p.color2 = new BABYLON.Color4(1.0, 0.6, 0.2, 0.5);
      p.minSize = 0.2; p.maxSize = 0.5;
    } else if (type === 'desert') {
      p.color1 = new BABYLON.Color4(0.95, 0.8, 0.5, 0.6);
      p.color2 = new BABYLON.Color4(0.85, 0.65, 0.35, 0.4);
      p.minSize = 0.3; p.maxSize = 0.7;
    } else {
      p.color1 = new BABYLON.Color4(0.2, 0.9, 0.3, 0.8);
      p.color2 = new BABYLON.Color4(0.8, 0.95, 0.2, 0.5);
      p.minSize = 0.35; p.maxSize = 0.8;
    }
    p.minLifeTime = 2.0; p.maxLifeTime = 4.0;
    p.emitRate = 100;
    p.direction1 = new BABYLON.Vector3(-0.5, -0.2, -0.5);
    p.direction2 = new BABYLON.Vector3(0.5, -0.4, 0.5);
    p.start();
    particles = p;
  }

  // ========================================================================
  // STAGE GENERATION: TOWERING ARENA WALLS & PBR MATERIALS
  // ========================================================================
  function clearCurrentStage() {
    stageMeshes.forEach(m => m.dispose());
    stageMeshes = [];
    boneObstacles = [];
    if (boss && boss.root) { boss.root.dispose(); boss = null; }
  }

  function buildHighArenaEnclosure(wallTex, trimColor) {
    const hw = ARENA_W / 2;
    const hl = ARENA_L / 2;

    const wallMat = new BABYLON.PBRMaterial("pbrWall", scene);
    wallMat.albedoTexture = wallTex;
    wallMat.metallic = 0.1;
    wallMat.roughness = 0.75;

    const trimMat = new BABYLON.PBRMaterial("pbrTrim", scene);
    trimMat.albedoColor = trimColor;
    trimMat.metallic = 0.2;
    trimMat.roughness = 0.4;

    function makeWall(x, z, w, d) {
      const wall = BABYLON.MeshBuilder.CreateBox("WallSeg", { width: w, height: WALL_H, depth: d }, scene);
      wall.position.set(x, WALL_H / 2, z);
      wall.material = wallMat;

      const topRail = BABYLON.MeshBuilder.CreateBox("WallRail", { width: w + 0.6, height: 1.6, depth: d + 0.6 }, scene);
      topRail.position.set(x, WALL_H + 0.8, z);
      topRail.material = trimMat;

      shadowGen.addShadowCaster(wall);
      shadowGen.addShadowCaster(topRail);
      stageMeshes.push(wall, topRail);
    }
    makeWall(0, -hl, ARENA_W, 2.5);
    makeWall(0, hl, ARENA_W, 2.5);
    makeWall(-hw, 0, 2.5, ARENA_L);
    makeWall(hw, 0, 2.5, ARENA_L);

    // Towering Corner Keep Bastions
    [[-hw, -hl], [hw, -hl], [-hw, hl], [hw, hl]].forEach(([cx, cz]) => {
      const tower = BABYLON.MeshBuilder.CreateBox("CornerKeep", { width: 8, height: WALL_H + 6, depth: 8 }, scene);
      tower.position.set(cx, (WALL_H + 6) / 2, cz);
      tower.material = wallMat;

      const roof = BABYLON.MeshBuilder.CreateCylinder("TowerRoof", { height: 7, diameterTop: 0, diameterBottom: 11, tessellation: 8 }, scene);
      roof.position.set(cx, WALL_H + 9.5, cz);
      roof.material = trimMat;

      shadowGen.addShadowCaster(tower);
      shadowGen.addShadowCaster(roof);
      stageMeshes.push(tower, roof);
    });
  }

  // Stage 1: Castle
  function buildCastleStage() {
    scene.clearColor = new BABYLON.Color4(0.42, 0.72, 0.98, 1.0);
    scene.fogColor = new BABYLON.Color3(0.42, 0.72, 0.98);

    const floor = BABYLON.MeshBuilder.CreateGround("Floor", { width: ARENA_W, height: ARENA_L }, scene);
    const fMat = new BABYLON.PBRMaterial("fMat", scene);
    const turfTex = createProceduralTexture('castle-turf');
    turfTex.uScale = 8; turfTex.vScale = 10;
    fMat.albedoTexture = turfTex;
    fMat.roughness = 0.8;
    floor.material = fMat;
    floor.receiveShadows = true;
    stageMeshes.push(floor);

    const stoneTex = createProceduralTexture('castle-stone');
    stoneTex.uScale = 6; stoneTex.vScale = 3;
    buildHighArenaEnclosure(stoneTex, new BABYLON.Color3(0.92, 0.2, 0.18));

    startParticles('castle');
    boss = createBossRig(0, "CITADEL GUARDIAN", 240, new BABYLON.Color3(0.55, 0.62, 0.75));
  }

  // Stage 2: Desert
  function buildDesertStage() {
    scene.clearColor = new BABYLON.Color4(0.96, 0.82, 0.52, 1.0);
    scene.fogColor = new BABYLON.Color3(0.96, 0.82, 0.52);

    const floor = BABYLON.MeshBuilder.CreateGround("Floor", { width: ARENA_W, height: ARENA_L }, scene);
    const fMat = new BABYLON.PBRMaterial("fMat", scene);
    const sandTex = createProceduralTexture('desert-sand');
    sandTex.uScale = 8; sandTex.vScale = 10;
    fMat.albedoTexture = sandTex;
    fMat.roughness = 0.9;
    floor.material = fMat;
    floor.receiveShadows = true;
    stageMeshes.push(floor);

    buildHighArenaEnclosure(sandTex, new BABYLON.Color3(0.68, 0.42, 0.2));

    // Jumpable Bone Rib Obstacles
    const boneMat = new BABYLON.PBRMaterial("bMat", scene);
    boneMat.albedoColor = new BABYLON.Color3(0.96, 0.94, 0.86);
    boneMat.roughness = 0.45;

    for (let i = 0; i < 14; i++) {
      const bx = (Math.random() - 0.5) * (ARENA_W - 14);
      const bz = (Math.random() - 0.5) * (ARENA_L - 18);
      if (Math.hypot(bx, bz) < 10) continue;

      const rib = BABYLON.MeshBuilder.CreateTorus("BoneRib", { diameter: 5.4, thickness: 0.95, tessellation: 16 }, scene);
      rib.position.set(bx, 0.4, bz);
      rib.rotation.z = Math.PI / 2;
      rib.rotation.y = Math.random() * Math.PI;
      rib.material = boneMat;
      shadowGen.addShadowCaster(rib);
      stageMeshes.push(rib);

      boneObstacles.push({ x: bx, z: bz, radius: 2.8, jumpH: 2.2 });
    }

    startParticles('desert');
    boss = createBossRig(1, "DUNE COLOSSUS", 320, new BABYLON.Color3(0.88, 0.55, 0.24));
  }

  // Stage 3: Jungle
  function buildJungleStage() {
    scene.clearColor = new BABYLON.Color4(0.48, 0.85, 0.65, 1.0);
    scene.fogColor = new BABYLON.Color3(0.48, 0.85, 0.65);

    const floor = BABYLON.MeshBuilder.CreateGround("Floor", { width: ARENA_W, height: ARENA_L }, scene);
    const fMat = new BABYLON.PBRMaterial("fMat", scene);
    const mossTex = createProceduralTexture('jungle-moss');
    mossTex.uScale = 8; mossTex.vScale = 10;
    fMat.albedoTexture = mossTex;
    fMat.roughness = 0.75;
    floor.material = fMat;
    floor.receiveShadows = true;
    stageMeshes.push(floor);

    buildHighArenaEnclosure(mossTex, new BABYLON.Color3(0.2, 0.78, 0.32));

    // Foliage Bushes (Visual concealment only)
    const bushMat = new BABYLON.PBRMaterial("bushMat", scene);
    bushMat.albedoColor = new BABYLON.Color3(0.18, 0.75, 0.3);
    bushMat.roughness = 0.7;

    for (let i = 0; i < 20; i++) {
      const fx = (Math.random() - 0.5) * (ARENA_W - 14);
      const fz = (Math.random() - 0.5) * (ARENA_L - 18);
      if (Math.hypot(fx, fz) < 10) continue;

      const clump = BABYLON.MeshBuilder.CreateSphere("BushClump", { diameter: 3.2 }, scene);
      clump.position.set(fx, 1.4, fz);
      clump.material = bushMat;
      shadowGen.addShadowCaster(clump);
      stageMeshes.push(clump);
    }

    startParticles('jungle');
    boss = createBossRig(2, "VERDANT STALKER", 400, new BABYLON.Color3(0.18, 0.55, 0.22));
  }

  // ========================================================================
  // ANIMATED STAGE BOSS RIGS
  // ========================================================================
  function createBossRig(type, name, hp, color) {
    const root = new BABYLON.TransformNode("BossRoot", scene);
    root.position.set(0, 0, -22);

    const bMat = new BABYLON.PBRMaterial("bMat", scene);
    bMat.albedoColor = color;
    bMat.metallic = 0.35;
    bMat.roughness = 0.4;

    const goldMat = new BABYLON.PBRMaterial("bGold", scene);
    goldMat.albedoColor = new BABYLON.Color3(1.0, 0.75, 0.1);
    goldMat.metallic = 0.9;
    goldMat.roughness = 0.2;

    const body = BABYLON.MeshBuilder.CreateBox("bBody", { width: 4.8, height: 5.2, depth: 4.2 }, scene);
    body.parent = root;
    body.position.y = 3.6;
    body.material = bMat;
    shadowGen.addShadowCaster(body);

    const crown = BABYLON.MeshBuilder.CreateBox("bCrown", { width: 3.2, height: 1.8, depth: 3.2 }, scene);
    crown.parent = body;
    crown.position.y = 3.4;
    crown.material = goldMat;
    shadowGen.addShadowCaster(crown);

    return {
      root, body, type, name,
      speed: 6.5 + type * 1.5,
      attackTimer: 1.2,
      hp, maxHp: hp, radius: 3.5, animTick: 0
    };
  }

  function loadStage(idx) {
    clearCurrentStage();
    state.stage = idx % 3;
    if (state.stage === 0) buildCastleStage();
    else if (state.stage === 1) buildDesertStage();
    else buildJungleStage();

    state.bossHp = boss.hp;
    state.maxBossHp = boss.maxHp;
    updateUI();
  }

  function updateUI() {
    const sEl = document.getElementById('hud-stage');
    const scEl = document.getElementById('hud-score');
    const pEl = document.getElementById('p-bar');
    const bEl = document.getElementById('b-bar');

    const names = ["STAGE 1: CITADEL COURTYARD", "STAGE 2: DESERT CANYON", "STAGE 3: JUNGLE CLEARING"];
    if (sEl && boss) sEl.innerText = `${names[state.stage]} — ${boss.name}`;
    if (scEl) scEl.innerText = `CONQUERED: ${state.score}`;
    if (pEl) pEl.style.width = `${Math.max(0, (state.playerHp / state.maxHp) * 100)}%`;
    if (bEl && boss) bEl.style.width = `${Math.max(0, (state.bossHp / state.maxBossHp) * 100)}%`;
  }

  // ========================================================================
  // PROJECTILE SYSTEM
  // ========================================================================
  function shoot(origin, dir, isPlayer = false, speed = 55) {
    const box = BABYLON.MeshBuilder.CreateBox("Bullet", { size: 0.65 }, scene);
    const mat = new BABYLON.StandardMaterial("bMat", scene);
    mat.emissiveColor = isPlayer ? new BABYLON.Color3(0, 1, 1) : new BABYLON.Color3(1, 0.2, 0.1);
    box.material = mat;
    box.position.copyFrom(origin);

    bullets.push({
      mesh: box,
      isPlayer,
      dir: dir.normalize(),
      speed,
      life: 2.6
    });

    playSound(isPlayer ? 'fire' : 'enemy_fire');
  }

  function playerFire() {
    if (recoil > 0.05) return;
    recoil = 0.38;
    muzzleFlash.isVisible = true;
    setTimeout(() => { muzzleFlash.isVisible = false; }, 45);

    const fwd = camera.getForwardRay().direction;
    const origin = camera.position.add(fwd.scale(1.2));
    shoot(origin, fwd, true, 65);
  }

  // ========================================================================
  // DESKTOP & MOBILE INPUTS
  // ========================================================================
  const keys = {};
  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.code === 'Space' && Math.abs(camera.position.y - 2.0) < 0.1) playerVy = 13.0;
    if (e.key === 'Shift' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') playerFire();
  });
  window.addEventListener('keyup', (e) => keys[e.code] = false);

  canvas.addEventListener('click', () => {
    if (!state.isMobile && !isPointerLocked) {
      canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock;
      if (canvas.requestPointerLock) canvas.requestPointerLock();
    }
  });

  document.addEventListener('pointerlockchange', () => {
    isPointerLocked = (document.pointerLockElement === canvas);
  });

  canvas.addEventListener('pointerdown', (e) => {
    if (e.button === 0 && !state.isMobile) playerFire();
  });

  if (state.isMobile) {
    document.getElementById('mobile-ui').style.display = 'block';
    const base = document.getElementById('joy-base');
    const stick = document.getElementById('joy-stick');
    let tid = null, rect = null;

    base.addEventListener('touchstart', (e) => {
      e.preventDefault();
      tid = e.changedTouches[0].identifier;
      rect = base.getBoundingClientRect();
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (tid === null) return;
      for (let t of e.changedTouches) {
        if (t.identifier === tid) {
          const dx = t.clientX - (rect.left + rect.width / 2);
          const dy = t.clientY - (rect.top + rect.height / 2);
          const dist = Math.min(48, Math.hypot(dx, dy));
          const ang = Math.atan2(dy, dx);

          stick.style.transform = `translate(calc(-50% + ${Math.cos(ang) * dist}px), calc(-50% + ${Math.sin(ang) * dist}px))`;
          input.right = (Math.cos(ang) * dist) / 48;
          input.forward = -(Math.sin(ang) * dist) / 48;
        }
      }
    }, { passive: false });

    const endTouch = (e) => {
      for (let t of e.changedTouches) {
        if (t.identifier === tid) {
          tid = null;
          stick.style.transform = 'translate(-50%, -50%)';
          input.forward = 0; input.right = 0;
        }
      }
    };
    window.addEventListener('touchend', endTouch);
    window.addEventListener('touchcancel', endTouch);

    document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (Math.abs(camera.position.y - 2.0) < 0.1) playerVy = 13.0;
    });

    document.getElementById('btn-fire').addEventListener('touchstart', (e) => {
      e.preventDefault();
      playerFire();
    });
  }

  // ========================================================================
  // RUNTIME RENDER ENGINE
  // ========================================================================
  loadStage(0);

  engine.runRenderLoop(() => {
    const dt = Math.min(engine.getDeltaTime() / 1000, 0.1);

    if (!state.isMobile) {
      input.forward = (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0);
      input.right = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);
    }

    // Kinematics Movement
    const moveMag = Math.hypot(input.forward, input.right);
    const fwd = camera.getForwardRay().direction;
    fwd.y = 0; fwd.normalize();
    const right = new BABYLON.Vector3(fwd.z, 0, -fwd.x);

    if (moveMag > 0.05) {
      const moveDir = fwd.scale(input.forward).add(right.scale(input.right)).normalize();
      const nx = camera.position.x + moveDir.x * 16 * dt;
      const nz = camera.position.z + moveDir.z * 16 * dt;

      let blocked = false;
      for (let b of boneObstacles) {
        if (Math.hypot(nx - b.x, nz - b.z) < 1.6 + b.radius) {
          if (camera.position.y < b.jumpH + 1.2) {
            blocked = true; break;
          }
        }
      }

      if (!blocked) {
        camera.position.x = nx;
        camera.position.z = nz;
      }

      // Viewmodel Sway
      walkBob += dt * 10;
      weaponRoot.position.y = -0.32 + Math.sin(walkBob) * 0.02;
      weaponRoot.position.x = 0.4 + Math.cos(walkBob * 0.5) * 0.015;
    } else {
      weaponRoot.position.y = -0.32;
      weaponRoot.position.x = 0.4;
    }

    // Bounds Constraints
    camera.position.x = Math.max(-ARENA_W / 2 + 3.2, Math.min(ARENA_W / 2 - 3.2, camera.position.x));
    camera.position.z = Math.max(-ARENA_L / 2 + 3.2, Math.min(ARENA_L / 2 - 3.2, camera.position.z));

    // Jump Gravity
    camera.position.y += playerVy * dt;
    if (camera.position.y > 2.0) {
      playerVy -= 32 * dt;
    } else {
      camera.position.y = 2.0;
      playerVy = 0;
    }

    // Recoil Recovery
    if (recoil > 0) {
      weaponRoot.position.z = 0.78 - recoil * 0.35;
      weaponRoot.rotation.x = -recoil * 0.45;
      recoil -= dt * 2.2;
    } else {
      weaponRoot.position.z = 0.78;
      weaponRoot.rotation.x = 0;
    }

    // Boss AI Simulation
    if (boss && !state.isTransitioning) {
      const toP = camera.position.subtract(boss.root.position);
      toP.y = 0;
      const dist = toP.length();
      toP.normalize();

      boss.root.rotation.y = Math.atan2(toP.x, toP.z);
      boss.animTick += dt * 4;
      boss.body.position.y = 3.6 + Math.sin(boss.animTick) * 0.4;

      if (dist > 14) {
        boss.root.position.x += toP.x * boss.speed * dt;
        boss.root.position.z += toP.z * boss.speed * dt;
      }

      boss.attackTimer -= dt;
      if (boss.attackTimer <= 0) {
        const origin = boss.root.position.add(new BABYLON.Vector3(0, 3.2, 0));
        shoot(origin, toP, false, 36);
        boss.attackTimer = 1.25;
      }
    }

    // Projectile Physics
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.mesh.position.addInPlace(b.dir.scale(b.speed * dt));
      b.life -= dt;

      if (Math.abs(b.mesh.position.x) > ARENA_W / 2 || Math.abs(b.mesh.position.z) > ARENA_L / 2 || b.life <= 0) {
        b.mesh.dispose();
        bullets.splice(i, 1);
        continue;
      }

      // Stage 2: Bones Block Bullets
      if (!b.isPlayer) {
        let hitBone = false;
        for (let o of boneObstacles) {
          if (Math.hypot(b.mesh.position.x - o.x, b.mesh.position.z - o.z) < o.radius) {
            hitBone = true; break;
          }
        }
        if (hitBone) {
          b.mesh.dispose();
          bullets.splice(i, 1);
          continue;
        }
      }

      // Hit Boss
      if (b.isPlayer && boss) {
        if (Math.hypot(b.mesh.position.x - boss.root.position.x, b.mesh.position.z - boss.root.position.z) < boss.radius) {
          state.bossHp -= 16;
          playSound('hit');
          b.mesh.dispose();
          bullets.splice(i, 1);

          if (state.bossHp <= 0) {
            state.score++;
            playSound('fanfare');
            const fade = document.getElementById('fade-curtain');
            fade.style.opacity = '1';
            state.isTransitioning = true;
            setTimeout(() => {
              loadStage(state.score);
              camera.position.set(0, 2.0, 24);
              fade.style.opacity = '0';
              state.isTransitioning = false;
            }, 500);
          }
          updateUI();
          continue;
        }
      }

      // Hit Player
      if (!b.isPlayer) {
        if (Math.hypot(b.mesh.position.x - camera.position.x, b.mesh.position.z - camera.position.z) < 1.6) {
          state.playerHp -= 14;
          playSound('hit');
          b.mesh.dispose();
          bullets.splice(i, 1);

          const flash = document.getElementById('hit-flash');
          flash.style.opacity = '1';
          setTimeout(() => flash.style.opacity = '0', 80);

          if (state.playerHp <= 0) {
            state.playerHp = state.maxHp;
            state.score = 0;
            loadStage(0);
            camera.position.set(0, 2.0, 24);
          }
          updateUI();
          continue;
        }
      }
    }

    scene.render();
  });

  window.addEventListener('resize', () => engine.resize());
});
</script>
