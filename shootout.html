<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SHOOTOUT 🌋</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #050208; overflow: hidden; font-family: 'Rajdhani', sans-serif; color: #fff; }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* Top HUD */
  #hud {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 90%; max-width: 620px; display: flex; flex-direction: column; gap: 7px;
    pointer-events: none; z-index: 10;
  }
  #title-bar {
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'Orbitron', sans-serif;
  }
  #game-title {
    font-size: 16px; font-weight: 900; letter-spacing: 2px;
    color: #ff5500; text-shadow: 0 0 12px #ff3300;
  }
  #stats-panel {
    display: flex; gap: 14px; font-family: 'Orbitron', sans-serif; font-size: 12px;
    letter-spacing: 1px; text-shadow: 0 0 8px #ffaa00;
  }
  .bar-container {
    background: rgba(14, 8, 5, 0.85); border: 2px solid rgba(255, 100, 0, 0.4);
    border-radius: 8px; height: 18px; position: relative; overflow: hidden;
    backdrop-filter: blur(6px);
  }
  .bar-fill { height: 100%; width: 100%; transition: width 0.12s linear; }
  #hp-player-bar { background: linear-gradient(90deg, #00ffaa, #00f0ff); box-shadow: 0 0 12px #00ffaa; }
  #hp-boss-bar { background: linear-gradient(90deg, #ff0055, #ffaa00); box-shadow: 0 0 12px #ff0055; }
  .bar-label {
    position: absolute; inset: 0; font-family: 'Orbitron', sans-serif;
    font-size: 10px; font-weight: 900; letter-spacing: 1.5px;
    display: flex; align-items: center; justify-content: center;
    text-shadow: 0 0 6px #000;
  }

  /* Center Crosshair */
  #reticle {
    position: absolute; top: 50%; left: 50%; width: 22px; height: 22px;
    transform: translate(-50%, -50%); border: 2px solid rgba(255, 85, 0, 0.7);
    border-radius: 50%; pointer-events: none; z-index: 5;
  }
  #reticle::after {
    content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
    background: #ff5500; transform: translate(-50%, -50%); border-radius: 50%;
  }

  /* Orb Alert Toast */
  #orb-toast {
    position: absolute; top: 110px; left: 50%; transform: translateX(-50%);
    font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 900;
    color: #00ffaa; text-shadow: 0 0 10px #00ffaa; background: rgba(0, 40, 25, 0.75);
    padding: 6px 16px; border-radius: 20px; border: 1px solid #00ffaa;
    opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 12;
  }

  /* Mobile Controls */
  #mobile-ui { display: none; position: absolute; inset: 0; pointer-events: none; z-index: 20; }
  .touch-btn {
    pointer-events: auto; position: absolute; border-radius: 50%;
    font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid rgba(255,255,255,0.4); backdrop-filter: blur(8px);
    touch-action: none;
  }
  #btn-shoot {
    left: 28px; bottom: 35px; width: 80px; height: 80px;
    background: rgba(255, 69, 0, 0.3); border-color: #ff5500; color: #ffaa55;
    box-shadow: 0 0 20px rgba(255, 85, 0, 0.45);
  }
  #btn-jump {
    right: 48px; bottom: 165px; width: 58px; height: 58px;
    background: rgba(0, 255, 170, 0.25); border-color: #00ffaa; color: #a6ffd8;
    box-shadow: 0 0 15px rgba(0, 255, 170, 0.35);
  }
  #joystick-zone {
    right: 25px; bottom: 25px; width: 125px; height: 125px; position: absolute;
    border-radius: 50%; border: 2px dashed rgba(255, 85, 0, 0.4);
    background: rgba(18, 8, 4, 0.45); pointer-events: auto; touch-action: none;
  }
  #joystick-thumb {
    width: 48px; height: 48px; border-radius: 50%; background: #ff5500;
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    box-shadow: 0 0 14px #ff5500; pointer-events: none;
  }

  /* Damage / Heal Flash */
  #hit-flash {
    position: absolute; inset: 0; pointer-events: none; background: rgba(255, 0, 50, 0.35);
    opacity: 0; transition: opacity 0.08s ease; z-index: 15;
  }

  #desktop-legend {
    position: absolute; bottom: 12px; left: 16px; font-size: 11px;
    color: rgba(255, 255, 255, 0.5); letter-spacing: 1px; pointer-events: none;
    font-family: 'Orbitron', sans-serif;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="hit-flash"></div>
<div id="reticle"></div>
<div id="orb-toast">+20% HEALTH RESTORED!</div>

<div id="hud">
  <div id="title-bar">
    <span id="game-title">SHOOTOUT 🌋</span>
    <div id="stats-panel">
      <span id="score-text">CONQUERED: 0</span>
      <span id="best-text" style="color: #ffd700;">BEST: 0</span>
    </div>
  </div>
  <div class="bar-container">
    <div id="hp-player-bar" class="bar-fill"></div>
    <div class="bar-label">PLAYER VITALITY</div>
  </div>
  <div class="bar-container">
    <div id="hp-boss-bar" class="bar-fill"></div>
    <div id="boss-name" class="bar-label">BOSS HEALTH</div>
  </div>
</div>

<div id="mobile-ui">
  <div id="btn-shoot" class="touch-btn">FIRE</div>
  <div id="btn-jump" class="touch-btn">JUMP</div>
  <div id="joystick-zone"><div id="joystick-thumb"></div></div>
</div>

<div id="desktop-legend">WASD = MOVE | SPACE = JUMP | ENTER / CLICK = SHOOT</div>

<script>
// --- AUDIO SYNTHESIS ENGINE ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playFx(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);

  if (type === 'laser') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(860, now);
    osc.frequency.exponentialRampToValueAtTime(140, now + 0.1);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.1);
    osc.start(now); osc.stop(now + 0.1);
  } else if (type === 'boss_shot') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(260, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
    gain.gain.setValueAtTime(0.28, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.2);
    osc.start(now); osc.stop(now + 0.2);
  } else if (type === 'hit') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(130, now);
    osc.frequency.linearRampToValueAtTime(35, now + 0.14);
    gain.gain.setValueAtTime(0.35, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.14);
    osc.start(now); osc.stop(now + 0.14);
  } else if (type === 'heal') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(320, now);
    osc.frequency.exponentialRampToValueAtTime(840, now + 0.3);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.3);
    osc.start(now); osc.stop(now + 0.3);
  } else if (type === 'explode') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(75, now);
    osc.frequency.linearRampToValueAtTime(20, now + 0.4);
    gain.gain.setValueAtTime(0.5, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.4);
    osc.start(now); osc.stop(now + 0.4);
  }
}

// --- THREE.JS SCENE SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06030b);
scene.fog = new THREE.FogExp2(0x06030b, 0.012);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x402518, 1.3));
const dirLight = new THREE.DirectionalLight(0xffaa66, 1.4);
dirLight.position.set(30, 60, 40);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
scene.add(dirLight);

// --- RECTANGULAR ARENA ---
const ARENA_W = 60;
const ARENA_L = 90;

const floorTexCanvas = document.createElement('canvas');
floorTexCanvas.width = 256; floorTexCanvas.height = 256;
const fCtx = floorTexCanvas.getContext('2d');
fCtx.fillStyle = '#0f0705'; fCtx.fillRect(0, 0, 256, 256);
fCtx.strokeStyle = '#ff440033'; fCtx.lineWidth = 4;
fCtx.strokeRect(0, 0, 256, 256);
fCtx.strokeStyle = '#ffaa0018'; fCtx.lineWidth = 2;
fCtx.beginPath(); fCtx.moveTo(0, 128); fCtx.lineTo(256, 128); fCtx.moveTo(128, 0); fCtx.lineTo(128, 256); fCtx.stroke();

const floorTex = new THREE.CanvasTexture(floorTexCanvas);
floorTex.wrapS = THREE.RepeatWrapping;
floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(ARENA_W / 6, ARENA_L / 6);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(ARENA_W * 2, ARENA_L * 2),
  new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.7, metalness: 0.2 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Perimeter Walls
const wallMat = new THREE.MeshBasicMaterial({ color: 0xff4500, transparent: true, opacity: 0.18, side: THREE.DoubleSide });
const wallBorderMat = new THREE.MeshBasicMaterial({ color: 0xff5500 });
const pylonMat = new THREE.MeshStandardMaterial({ color: 0x1f0e08, roughness: 0.4, metalness: 0.8 });

function buildWall(x, z, w, l) {
  const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 8, l), wallMat);
  wall.position.set(x, 4, z);
  scene.add(wall);
  const topRail = new THREE.Mesh(new THREE.BoxGeometry(w + 0.2, 0.4, l + 0.2), wallBorderMat);
  topRail.position.set(x, 8, z);
  scene.add(topRail);
}
buildWall(0, -ARENA_L, ARENA_W * 2, 0.8);
buildWall(0, ARENA_L, ARENA_W * 2, 0.8);
buildWall(-ARENA_W, 0, 0.8, ARENA_L * 2);
buildWall(ARENA_W, 0, 0.8, ARENA_L * 2);

[[-ARENA_W, -ARENA_L], [ARENA_W, -ARENA_L], [-ARENA_W, ARENA_L], [ARENA_W, ARENA_L]].forEach(([px, pz]) => {
  const pylon = new THREE.Mesh(new THREE.BoxGeometry(3, 16, 3), pylonMat);
  pylon.position.set(px, 8, pz);
  const beacon = new THREE.Mesh(new THREE.SphereGeometry(1.2, 12, 12), new THREE.MeshBasicMaterial({ color: 0xff5500 }));
  beacon.position.set(0, 8.5, 0);
  pylon.add(beacon);
  scene.add(pylon);
});

// --- CHARACTER RIGS ---
function buildPlayerMech() {
  const root = new THREE.Group();
  const matArmor = new THREE.MeshStandardMaterial({ color: 0x1c2128, roughness: 0.4, metalness: 0.7 });
  const matCyan = new THREE.MeshStandardMaterial({ color: 0x00f0ff, roughness: 0.2, metalness: 0.5 });
  const matVisor = new THREE.MeshBasicMaterial({ color: 0x00ffff });

  const torso = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.9, 1.3), matArmor);
  torso.position.y = 2.4;
  torso.castShadow = true;
  root.add(torso);

  const chestPlating = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.2, 0.5), matCyan);
  chestPlating.position.set(0, 0.2, 0.55);
  torso.add(chestPlating);

  const head = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.75, 0.95), matArmor);
  head.position.set(0, 1.4, 0);
  const visor = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.28, 0.3), matVisor);
  visor.position.set(0, 0.05, 0.45);
  head.add(visor);
  torso.add(head);

  // Blaster Arm
  const rArm = new THREE.Group();
  rArm.position.set(1.25, 0.4, 0);
  const cannon = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 1.4), matArmor);
  cannon.position.set(0.1, -0.3, 0.5);
  [-0.12, 0.12].forEach(ox => {
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.2, 8), matCyan);
    b.rotation.x = Math.PI / 2;
    b.position.set(ox + 0.1, -0.3, 1.4);
    rArm.add(b);
  });
  rArm.add(cannon);
  torso.add(rArm);

  // Left Arm
  const lArm = new THREE.Group();
  lArm.position.set(-1.25, 0.4, 0);
  const foreArm = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.3, 0.45), matArmor);
  foreArm.position.set(0, -0.5, 0);
  lArm.add(foreArm);
  torso.add(lArm);

  // Legs
  const legR = new THREE.Group();
  legR.position.set(0.55, 1.0, 0);
  const upperR = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.6, 0.55), matArmor);
  upperR.position.y = -0.3;
  upperR.castShadow = true;
  legR.add(upperR);

  const legL = new THREE.Group();
  legL.position.set(-0.55, 1.0, 0);
  const upperL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.6, 0.55), matArmor);
  upperL.position.y = -0.3;
  upperL.castShadow = true;
  legL.add(upperL);

  root.add(legR, legL);
  root.parts = { torso, rArm, lArm, legR, legL };
  return root;
}

function buildGoliath() {
  const g = new THREE.Group();
  const matHull = new THREE.MeshStandardMaterial({ color: 0x22252a, roughness: 0.5, metalness: 0.8 });
  const matRed = new THREE.MeshStandardMaterial({ color: 0xff0044, roughness: 0.3 });

  const core = new THREE.Mesh(new THREE.BoxGeometry(4.2, 2.6, 4.8), matHull);
  core.position.y = 3.8;
  core.castShadow = true;
  g.add(core);

  const dome = new THREE.Mesh(new THREE.SphereGeometry(1.6, 12, 12), matRed);
  dome.position.set(0, 1.4, 0.3);
  core.add(dome);

  [-1.8, 1.8].forEach(x => {
    const cannon = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.5, 4.5, 12), matHull);
    cannon.rotation.x = Math.PI / 2;
    cannon.position.set(x, 0.2, 2.6);
    core.add(cannon);
  });

  const legs = [];
  [[-2.4, -2], [2.4, -2], [-2.4, 2], [2.4, 2]].forEach(([lx, lz]) => {
    const legPivot = new THREE.Group();
    legPivot.position.set(lx, 3.0, lz);
    const upper = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.2, 0.8), matHull);
    upper.position.y = -1.0;
    const foot = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.6, 1.8), matRed);
    foot.position.y = -2.0;
    legPivot.add(upper, foot);
    g.add(legPivot);
    legs.push(legPivot);
  });

  g.parts = { core, legs };
  return g;
}

function buildPhantom() {
  const g = new THREE.Group();
  const matChassis = new THREE.MeshStandardMaterial({ color: 0x1a1528, roughness: 0.3, metalness: 0.9 });
  const matGold = new THREE.MeshStandardMaterial({ color: 0xffbb00, roughness: 0.2, metalness: 0.6 });
  const matWing = new THREE.MeshBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0.75, side: THREE.DoubleSide });

  const torso = new THREE.Mesh(new THREE.ConeGeometry(1.8, 4.0, 5), matChassis);
  torso.rotation.x = Math.PI;
  torso.position.y = 4.2;
  torso.castShadow = true;
  g.add(torso);

  const head = new THREE.Mesh(new THREE.OctahedronGeometry(1.0), matGold);
  head.position.set(0, 1.8, 0);
  torso.add(head);

  const lWing = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 1.2), matWing);
  lWing.position.set(-2.8, 0.5, -0.5);
  const rWing = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 1.2), matWing);
  rWing.position.set(2.8, 0.5, -0.5);
  torso.add(lWing, rWing);

  [-0.9, 0.9].forEach(rx => {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 3.2), matGold);
    rail.position.set(rx, -0.6, 1.4);
    torso.add(rail);
  });

  g.parts = { torso };
  return g;
}

function buildBehemoth() {
  const g = new THREE.Group();
  const matObsidian = new THREE.MeshStandardMaterial({ color: 0x12081f, roughness: 0.6, metalness: 0.4 });
  const matPurple = new THREE.MeshStandardMaterial({ color: 0xa100ff, roughness: 0.3 });
  const matHorns = new THREE.MeshStandardMaterial({ color: 0xff0077, roughness: 0.2 });

  const chest = new THREE.Mesh(new THREE.BoxGeometry(4.5, 3.8, 3.2), matObsidian);
  chest.position.y = 4.6;
  chest.castShadow = true;
  g.add(chest);

  const crest = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.0, 1.8), matPurple);
  crest.position.set(0, 2.4, 0.4);
  chest.add(crest);

  [-1.4, 1.4].forEach(hx => {
    const horn = new THREE.Mesh(new THREE.ConeGeometry(0.55, 2.4, 8), matHorns);
    horn.position.set(hx, 1.2, 0);
    horn.rotation.z = hx > 0 ? -0.5 : 0.5;
    crest.add(horn);
  });

  const lArm = new THREE.Mesh(new THREE.BoxGeometry(1.4, 3.6, 1.4), matObsidian);
  lArm.position.set(-3.2, 0.2, 0.4);
  const rArm = new THREE.Mesh(new THREE.BoxGeometry(1.4, 3.6, 1.4), matObsidian);
  rArm.position.set(3.2, 0.2, 0.4);
  chest.add(lArm, rArm);

  const legL = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.8, 1.6), matObsidian);
  legL.position.set(-1.4, 1.4, 0);
  const legR = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.8, 1.6), matObsidian);
  legR.position.set(1.4, 1.4, 0);
  g.add(legL, legR);

  g.parts = { chest };
  return g;
}

// --- PLAYER STATE ---
const player = {
  mesh: buildPlayerMech(),
  hp: 100, maxHp: 100,
  speed: 26, vy: 0,
  angle: 0, shootCooldown: 0,
  animTime: 0,
  radius: 1.8
};
player.mesh.position.set(0, 0, 45);
scene.add(player.mesh);

// --- HEALTH ORB DROP (15-SECOND RECOVERY ORB) ---
let healthOrb = null;
let orbSpawnTimer = 15.0;

function spawnHealthOrb() {
  if (healthOrb) scene.remove(healthOrb.mesh);

  const root = new THREE.Group();
  const sphereMat = new THREE.MeshBasicMaterial({ color: 0x00ffaa });
  const orbMesh = new THREE.Mesh(new THREE.SphereGeometry(1.2, 16, 16), sphereMat);
  root.add(orbMesh);

  // Rotating energy halo
  const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide });
  const ring = new THREE.Mesh(new THREE.RingGeometry(1.6, 1.9, 16), ringMat);
  ring.rotation.x = Math.PI / 2;
  root.add(ring);

  // Random position safely inside arena
  const rx = (Math.random() - 0.5) * (ARENA_W * 1.5);
  const rz = (Math.random() - 0.5) * (ARENA_L * 1.5);
  root.position.set(rx, 2.0, rz);
  scene.add(root);

  healthOrb = {
    mesh: root,
    ring: ring,
    active: true,
    radius: 2.2,
    time: 0
  };
}

// --- PROJECTILE FACTORY ---
const bullets = [];
const bulletGeo = new THREE.SphereGeometry(0.45, 8, 8);

function fireProjectile(origin, angle, isPlayer = false, color = 0x00f0ff, speed = 48, spread = 0) {
  const mesh = new THREE.Mesh(bulletGeo, new THREE.MeshBasicMaterial({ color }));
  mesh.position.set(origin.x, origin.y, origin.z);
  scene.add(mesh);

  const dirAngle = angle + spread;
  bullets.push({
    mesh, isPlayer,
    vx: Math.sin(dirAngle) * speed,
    vz: Math.cos(dirAngle) * speed,
    life: 3.0
  });
}

// --- BOSS STATE & ATTACK DEFINITIONS ---
let bossesDefeated = 0;
let bestStreak = parseInt(localStorage.getItem('shootout_best') || '0');
document.getElementById('best-text').innerText = `BEST: ${bestStreak}`;

let currentBoss = null;
const bossDefs = [
  { name: "STEEL GOLIATH", type: 0, build: buildGoliath, maxHp: 220, speed: 7.0, radius: 4.2 },
  { name: "CYBER PHANTOM", type: 1, build: buildPhantom, maxHp: 320, speed: 12.0, radius: 3.4 },
  { name: "VOID BEHEMOTH", type: 2, build: buildBehemoth, maxHp: 480, speed: 9.0, radius: 4.5 }
];

function spawnNextBoss() {
  if (currentBoss && currentBoss.mesh) scene.remove(currentBoss.mesh);

  const cycle = Math.floor(bossesDefeated / bossDefs.length);
  const def = bossDefs[bossesDefeated % bossDefs.length];
  const hpBonus = cycle * 160;

  const mesh = def.build();
  mesh.position.set(0, 0, -55);
  scene.add(mesh);

  currentBoss = {
    ...def,
    mesh,
    maxHp: def.maxHp + hpBonus,
    hp: def.maxHp + hpBonus,
    attackTimer: 1.2,
    chargeTimer: 0,
    stateTimer: 0
  };

  document.getElementById('boss-name').innerText = currentBoss.name + (cycle > 0 ? ` MK-${cycle + 1}` : "");
  document.getElementById('hp-boss-bar').style.width = '100%';
}

// --- CONTROLS: DESKTOP (WASD + ENTER/CLICK) & MOBILE ---
const input = { forward: 0, right: 0 };
let isMouseDown = false;

function jump() {
  if (player.mesh.position.y <= 0.05) {
    player.vy = 12.0;
  }
}

function shoot() {
  if (player.shootCooldown <= 0) {
    // Spawn bullet directly from player chest level towards forward aim direction
    const spawnPos = new THREE.Vector3(
      player.mesh.position.x + Math.sin(player.angle) * 1.5,
      2.0,
      player.mesh.position.z + Math.cos(player.angle) * 1.5
    );
    fireProjectile(spawnPos, player.angle, true, 0x00f0ff, 54);
    player.shootCooldown = 0.16;
    playFx('laser');
  }
}

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 820;

if (isMobile) {
  document.getElementById('mobile-ui').style.display = 'block';
  document.getElementById('desktop-legend').style.display = 'none';

  const sBtn = document.getElementById('btn-shoot');
  let autoShoot = null;
  sBtn.addEventListener('touchstart', (e) => {
    e.preventDefault(); shoot();
    autoShoot = setInterval(shoot, 160);
  });
  sBtn.addEventListener('touchend', () => clearInterval(autoShoot));

  document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
    e.preventDefault(); jump();
  });

  const joyZone = document.getElementById('joystick-zone');
  const joyThumb = document.getElementById('joystick-thumb');
  let touchId = null, baseRect = null;

  joyZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    touchId = e.changedTouches[0].identifier;
    baseRect = joyZone.getBoundingClientRect();
  });

  window.addEventListener('touchmove', (e) => {
    if (touchId === null) return;
    for (let t of e.changedTouches) {
      if (t.identifier === touchId) {
        const dx = t.clientX - (baseRect.left + baseRect.width / 2);
        const dy = t.clientY - (baseRect.top + baseRect.height / 2);
        const dist = Math.min(50, Math.hypot(dx, dy));
        const angle = Math.atan2(dy, dx);

        joyThumb.style.transform = `translate(calc(-50% + ${Math.cos(angle) * dist}px), calc(-50% + ${Math.sin(angle) * dist}px))`;
        input.right = (Math.cos(angle) * dist) / 50;
        input.forward = -(Math.sin(angle) * dist) / 50;
      }
    }
  }, { passive: false });

  const endJoy = (e) => {
    for (let t of e.changedTouches) {
      if (t.identifier === touchId) {
        touchId = null;
        joyThumb.style.transform = `translate(-50%, -50%)`;
        input.forward = 0; input.right = 0;
      }
    }
  };
  window.addEventListener('touchend', endJoy);
  window.addEventListener('touchcancel', endJoy);

} else {
  const keys = {};

  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.key === 'Enter' || e.code === 'Enter' || e.code === 'NumpadEnter') {
      keys['EnterKey'] = true;
      shoot();
    }
    if (e.code === 'Space') jump();
  });

  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
    if (e.key === 'Enter' || e.code === 'Enter' || e.code === 'NumpadEnter') {
      keys['EnterKey'] = false;
    }
  });

  window.addEventListener('mousemove', (e) => {
    const dx = e.clientX - window.innerWidth / 2;
    const dy = e.clientY - window.innerHeight / 2;
    player.angle = Math.atan2(-dx, -dy);
  });

  window.addEventListener('mousedown', (e) => {
    if (e.button === 0) { isMouseDown = true; shoot(); }
  });

  window.addEventListener('mouseup', (e) => {
    if (e.button === 0) isMouseDown = false;
  });

  function pollDesktop() {
    input.forward = (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0);
    input.right   = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);
    if (keys['EnterKey'] || isMouseDown) shoot();
  }
}

// --- DAMAGE, HEALING, & RESTART LOOP ---
function takeDamage(amt) {
  player.hp -= amt;
  playFx('hit');
  const flash = document.getElementById('hit-flash');
  flash.style.opacity = '1';
  setTimeout(() => flash.style.opacity = '0', 70);

  if (player.hp <= 0) {
    playFx('explode');
    resetGame();
  }
}

function healPlayer(pct) {
  const add = player.maxHp * pct;
  player.hp = Math.min(player.maxHp, player.hp + add);
  playFx('heal');

  const toast = document.getElementById('orb-toast');
  toast.style.opacity = '1';
  setTimeout(() => toast.style.opacity = '0', 1600);
}

function resetGame() {
  player.hp = player.maxHp;
  player.mesh.position.set(0, 0, 45);
  player.vy = 0;
  bossesDefeated = 0;
  orbSpawnTimer = 15.0;
  document.getElementById('score-text').innerText = `CONQUERED: 0`;
  bullets.forEach(b => scene.remove(b.mesh));
  bullets.length = 0;
  if (healthOrb) { scene.remove(healthOrb.mesh); healthOrb = null; }
  spawnNextBoss();
}

// --- GAME LOOP ---
let lastFrameTime = performance.now();
spawnNextBoss();

function update(dt) {
  if (!isMobile) pollDesktop();

  // 1. Move Player
  const moveMag = Math.hypot(input.forward, input.right);
  if (moveMag > 0.05) {
    const normF = input.forward / Math.max(1, moveMag);
    const normR = input.right / Math.max(1, moveMag);

    player.mesh.position.x += normR * player.speed * dt;
    player.mesh.position.z -= normF * player.speed * dt;

    if (isMobile) player.angle = Math.atan2(-normR, normF);

    player.animTime += dt * 14;
    player.mesh.parts.legR.rotation.x = Math.sin(player.animTime) * 0.55;
    player.mesh.parts.legL.rotation.x = -Math.sin(player.animTime) * 0.55;
    player.mesh.parts.lArm.rotation.x = Math.sin(player.animTime) * 0.4;
  } else {
    player.mesh.parts.legR.rotation.x = 0;
    player.mesh.parts.legL.rotation.x = 0;
    player.mesh.parts.lArm.rotation.x = 0;
  }

  player.mesh.position.x = Math.max(-ARENA_W + 2, Math.min(ARENA_W - 2, player.mesh.position.x));
  player.mesh.position.z = Math.max(-ARENA_L + 2, Math.min(ARENA_L - 2, player.mesh.position.z));

  player.mesh.position.y += player.vy * dt;
  if (player.mesh.position.y > 0) {
    player.vy -= 30 * dt;
  } else {
    player.mesh.position.y = 0;
    player.vy = 0;
  }
  player.mesh.rotation.y = player.angle;
  player.shootCooldown -= dt;

  // 2. Camera Tracking
  camera.position.x = player.mesh.position.x;
  camera.position.y = player.mesh.position.y + 16;
  camera.position.z = player.mesh.position.z + 24;
  camera.lookAt(player.mesh.position.x, player.mesh.position.y + 3.0, player.mesh.position.z - 8);

  // 3. 15-Second Health Orb Spawner & Pickup Check
  orbSpawnTimer -= dt;
  if (orbSpawnTimer <= 0) {
    spawnHealthOrb();
    orbSpawnTimer = 15.0;
  }

  if (healthOrb && healthOrb.active) {
    healthOrb.time += dt;
    healthOrb.mesh.position.y = 2.0 + Math.sin(healthOrb.time * 3) * 0.4;
    healthOrb.ring.rotation.z += dt * 2.5;

    // Check Player Pickup
    const distToOrb = Math.hypot(
      player.mesh.position.x - healthOrb.mesh.position.x,
      player.mesh.position.z - healthOrb.mesh.position.z
    );

    if (distToOrb < player.radius + healthOrb.radius) {
      healPlayer(0.20);
      scene.remove(healthOrb.mesh);
      healthOrb = null;
    }
  }

  // 4. Boss Behaviors & Attacks
  if (currentBoss) {
    const toPlayer = new THREE.Vector3().subVectors(player.mesh.position, currentBoss.mesh.position);
    const dist = toPlayer.length();
    toPlayer.y = 0;
    toPlayer.normalize();

    currentBoss.attackTimer -= dt;
    currentBoss.stateTimer += dt;

    const targetAngle = Math.atan2(toPlayer.x, toPlayer.z);
    currentBoss.mesh.rotation.y = targetAngle;

    if (currentBoss.type === 0) { // Steel Goliath
      if (dist > 18) {
        currentBoss.mesh.position.x += toPlayer.x * currentBoss.speed * dt;
        currentBoss.mesh.position.z += toPlayer.z * currentBoss.speed * dt;
      }
      currentBoss.mesh.parts.legs.forEach((l, i) => {
        l.rotation.x = Math.sin(currentBoss.stateTimer * 6 + i) * 0.4;
      });

      if (currentBoss.attackTimer <= 0) {
        for (let s = -0.35; s <= 0.35; s += 0.35) {
          const spawnB = new THREE.Vector3(currentBoss.mesh.position.x, 3.8, currentBoss.mesh.position.z);
          fireProjectile(spawnB, targetAngle, false, 0xff0055, 26, s);
        }
        playFx('boss_shot');
        currentBoss.attackTimer = 1.3;
      }
    } 
    else if (currentBoss.type === 1) { // Cyber Phantom
      const strafeX = -toPlayer.z;
      const strafeZ = toPlayer.x;
      const strafeDir = Math.sin(currentBoss.stateTimer * 2) > 0 ? 1 : -1;

      currentBoss.mesh.position.x += (toPlayer.x * 0.3 + strafeX * strafeDir) * currentBoss.speed * dt;
      currentBoss.mesh.position.z += (toPlayer.z * 0.3 + strafeZ * strafeDir) * currentBoss.speed * dt;
      currentBoss.mesh.position.y = 3.5 + Math.sin(currentBoss.stateTimer * 4) * 0.8;

      if (currentBoss.attackTimer <= 0) {
        const spawnB = new THREE.Vector3(currentBoss.mesh.position.x, 2.5, currentBoss.mesh.position.z);
        fireProjectile(spawnB, targetAngle, false, 0xffbb00, 36, (Math.random() - 0.5) * 0.15);
        playFx('boss_shot');
        currentBoss.attackTimer = 0.38;
      }
    } 
    else if (currentBoss.type === 2) { // Void Behemoth
      if (currentBoss.chargeTimer > 0) {
        currentBoss.chargeTimer -= dt;
        currentBoss.mesh.position.x += toPlayer.x * 24 * dt;
        currentBoss.mesh.position.z += toPlayer.z * 24 * dt;
      } else {
        currentBoss.mesh.position.x += toPlayer.x * currentBoss.speed * dt;
        currentBoss.mesh.position.z += toPlayer.z * currentBoss.speed * dt;
      }

      if (currentBoss.attackTimer <= 0) {
        const spawnB = new THREE.Vector3(currentBoss.mesh.position.x, 2.5, currentBoss.mesh.position.z);
        for (let i = 0; i < 14; i++) {
          fireProjectile(spawnB, (i / 14) * Math.PI * 2, false, 0xa100ff, 20);
        }
        playFx('boss_shot');
        currentBoss.chargeTimer = 1.0;
        currentBoss.attackTimer = 2.4;
      }
    }

    currentBoss.mesh.position.x = Math.max(-ARENA_W + 4, Math.min(ARENA_W - 4, currentBoss.mesh.position.x));
    currentBoss.mesh.position.z = Math.max(-ARENA_L + 4, Math.min(ARENA_L - 4, currentBoss.mesh.position.z));
  }

  // 5. Accurate 2D/3D Bullet Hit Detection
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.mesh.position.x += b.vx * dt;
    b.mesh.position.z += b.vz * dt;
    b.life -= dt;

    if (Math.abs(b.mesh.position.x) >= ARENA_W || Math.abs(b.mesh.position.z) >= ARENA_L || b.life <= 0) {
      scene.remove(b.mesh);
      bullets.splice(i, 1);
      continue;
    }

    // Player Bullet -> Hits Boss
    if (b.isPlayer && currentBoss) {
      const distXZ = Math.hypot(
        b.mesh.position.x - currentBoss.mesh.position.x,
        b.mesh.position.z - currentBoss.mesh.position.z
      );

      if (distXZ < currentBoss.radius) {
        currentBoss.hp -= 12;
        scene.remove(b.mesh);
        bullets.splice(i, 1);

        if (currentBoss.hp <= 0) {
          playFx('explode');
          bossesDefeated++;
          document.getElementById('score-text').innerText = `CONQUERED: ${bossesDefeated}`;
          if (bossesDefeated > bestStreak) {
            bestStreak = bossesDefeated;
            localStorage.setItem('shootout_best', bestStreak);
            document.getElementById('best-text').innerText = `BEST: ${bestStreak}`;
          }
          spawnNextBoss();
        }
        continue;
      }
    }

    // Boss Bullet -> Hits Player
    if (!b.isPlayer) {
      const distXZ = Math.hypot(
        b.mesh.position.x - player.mesh.position.x,
        b.mesh.position.z - player.mesh.position.z
      );

      if (distXZ < player.radius) {
        takeDamage(12);
        scene.remove(b.mesh);
        bullets.splice(i, 1);
        continue;
      }
    }
  }

  // 6. Update Vitality Bars
  document.getElementById('hp-player-bar').style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
  if (currentBoss) {
    document.getElementById('hp-boss-bar').style.width = Math.max(0, (currentBoss.hp / currentBoss.maxHp) * 100) + '%';
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastFrameTime) / 1000, 0.08);
  lastFrameTime = now;
  update(dt);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
