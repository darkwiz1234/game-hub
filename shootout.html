<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SHOOTOUT ⚔️</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #030206; overflow: hidden; font-family: 'Rajdhani', sans-serif; color: #fff; }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* Top HUD */
  #hud {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 90%; max-width: 640px; display: flex; flex-direction: column; gap: 7px;
    pointer-events: none; z-index: 10;
  }
  #title-bar {
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'Orbitron', sans-serif;
  }
  #game-title {
    font-size: 16px; font-weight: 900; letter-spacing: 2px;
    color: #ff5500; text-shadow: 0 0 12px #ff3300;
  }
  #stage-indicator {
    font-size: 11px; font-weight: 700; color: #00f0ff; letter-spacing: 1px;
    text-shadow: 0 0 8px #00f0ff;
  }
  #stats-panel {
    display: flex; gap: 14px; font-family: 'Orbitron', sans-serif; font-size: 12px;
    letter-spacing: 1px; text-shadow: 0 0 8px #ffaa00;
  }
  .bar-container {
    background: rgba(14, 8, 5, 0.85); border: 2px solid rgba(255, 100, 0, 0.4);
    border-radius: 8px; height: 18px; position: relative; overflow: hidden;
    backdrop-filter: blur(6px);
  }
  .bar-fill { height: 100%; width: 100%; transition: width 0.12s linear; }
  #hp-player-bar { background: linear-gradient(90deg, #00ffaa, #00f0ff); box-shadow: 0 0 12px #00ffaa; }
  #hp-boss-bar { background: linear-gradient(90deg, #ff0055, #ffaa00); box-shadow: 0 0 12px #ff0055; }
  .bar-label {
    position: absolute; inset: 0; font-family: 'Orbitron', sans-serif;
    font-size: 10px; font-weight: 900; letter-spacing: 1.5px;
    display: flex; align-items: center; justify-content: center;
    text-shadow: 0 0 6px #000;
  }

  /* Center Crosshair */
  #reticle {
    position: absolute; top: 50%; left: 50%; width: 22px; height: 22px;
    transform: translate(-50%, -50%); border: 2px solid rgba(255, 85, 0, 0.7);
    border-radius: 50%; pointer-events: none; z-index: 5;
  }
  #reticle::after {
    content: ''; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
    background: #ff5500; transform: translate(-50%, -50%); border-radius: 50%;
  }

  /* Toast for Pickups & Stage Transitions */
  #game-toast {
    position: absolute; top: 115px; left: 50%; transform: translateX(-50%);
    font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 900;
    color: #00ffaa; text-shadow: 0 0 10px #00ffaa; background: rgba(0, 30, 20, 0.85);
    padding: 7px 18px; border-radius: 20px; border: 1px solid #00ffaa;
    opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 12;
  }

  /* Mobile Controls */
  #mobile-ui { display: none; position: absolute; inset: 0; pointer-events: none; z-index: 20; }
  .touch-btn {
    pointer-events: auto; position: absolute; border-radius: 50%;
    font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid rgba(255,255,255,0.4); backdrop-filter: blur(8px);
    touch-action: none;
  }
  #btn-shoot {
    left: 28px; bottom: 35px; width: 80px; height: 80px;
    background: rgba(255, 69, 0, 0.3); border-color: #ff5500; color: #ffaa55;
    box-shadow: 0 0 20px rgba(255, 85, 0, 0.45);
  }
  #btn-jump {
    right: 48px; bottom: 165px; width: 58px; height: 58px;
    background: rgba(0, 255, 170, 0.25); border-color: #00ffaa; color: #a6ffd8;
    box-shadow: 0 0 15px rgba(0, 255, 170, 0.35);
  }
  #joystick-zone {
    right: 25px; bottom: 25px; width: 125px; height: 125px; position: absolute;
    border-radius: 50%; border: 2px dashed rgba(255, 85, 0, 0.4);
    background: rgba(18, 8, 4, 0.45); pointer-events: auto; touch-action: none;
  }
  #joystick-thumb {
    width: 48px; height: 48px; border-radius: 50%; background: #ff5500;
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    box-shadow: 0 0 14px #ff5500; pointer-events: none;
  }

  /* Screen Damage / Fade Overlay */
  #screen-flash {
    position: absolute; inset: 0; pointer-events: none; background: rgba(255, 0, 50, 0.35);
    opacity: 0; transition: opacity 0.08s ease; z-index: 15;
  }
  #stage-fade {
    position: absolute; inset: 0; pointer-events: none; background: #000;
    opacity: 0; transition: opacity 0.45s ease; z-index: 25;
  }

  #desktop-legend {
    position: absolute; bottom: 12px; left: 16px; font-size: 11px;
    color: rgba(255, 255, 255, 0.5); letter-spacing: 1px; pointer-events: none;
    font-family: 'Orbitron', sans-serif;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="stage-fade"></div>
<div id="screen-flash"></div>
<div id="reticle"></div>
<div id="game-toast">NOTIFY</div>

<div id="hud">
  <div id="title-bar">
    <div>
      <span id="game-title">SHOOTOUT ⚔️</span>
      <div id="stage-indicator">STAGE 1: CASTLE COURTYARD</div>
    </div>
    <div id="stats-panel">
      <span id="score-text">CONQUERED: 0</span>
      <span id="best-text" style="color: #ffd700;">BEST: 0</span>
    </div>
  </div>
  <div class="bar-container">
    <div id="hp-player-bar" class="bar-fill"></div>
    <div class="bar-label">PLAYER VITALITY</div>
  </div>
  <div class="bar-container">
    <div id="hp-boss-bar" class="bar-fill"></div>
    <div id="boss-name" class="bar-label">BOSS HEALTH</div>
  </div>
</div>

<div id="mobile-ui">
  <div id="btn-shoot" class="touch-btn">FIRE</div>
  <div id="btn-jump" class="touch-btn">JUMP</div>
  <div id="joystick-zone"><div id="joystick-thumb"></div></div>
</div>

<div id="desktop-legend">WASD = MOVE | SPACE = JUMP | CLICK / SHIFT = SHOOT</div>

<script>
// --- AUDIO SYNTHESIS ENGINE (Web Audio API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playFx(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);

  if (type === 'laser') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.exponentialRampToValueAtTime(140, now + 0.1);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.1);
    osc.start(now); osc.stop(now + 0.1);
  } else if (type === 'boss_shot') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(260, now);
    osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
    gain.gain.setValueAtTime(0.28, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.2);
    osc.start(now); osc.stop(now + 0.2);
  } else if (type === 'hit') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(130, now);
    osc.frequency.linearRampToValueAtTime(35, now + 0.14);
    gain.gain.setValueAtTime(0.35, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.14);
    osc.start(now); osc.stop(now + 0.14);
  } else if (type === 'heal') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(320, now);
    osc.frequency.exponentialRampToValueAtTime(860, now + 0.3);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.3);
    osc.start(now); osc.stop(now + 0.3);
  } else if (type === 'explode') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(80, now);
    osc.frequency.linearRampToValueAtTime(20, now + 0.45);
    gain.gain.setValueAtTime(0.5, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.45);
    osc.start(now); osc.stop(now + 0.45);
  } else if (type === 'warp') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(620, now + 0.4);
    gain.gain.setValueAtTime(0.35, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.4);
    osc.start(now); osc.stop(now + 0.4);
  }
}

function showToast(msg, color = '#00ffaa') {
  const t = document.getElementById('game-toast');
  t.innerText = msg;
  t.style.color = color;
  t.style.borderColor = color;
  t.style.textShadow = `0 0 10px ${color}`;
  t.style.opacity = '1';
  setTimeout(() => t.style.opacity = '0', 1700);
}

// --- THREE.JS SCENE SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06030b);
scene.fog = new THREE.FogExp2(0x06030b, 0.012);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const ambLight = new THREE.AmbientLight(0x402518, 1.3);
scene.add(ambLight);

const dirLight = new THREE.DirectionalLight(0xffaa66, 1.4);
dirLight.position.set(30, 60, 40);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
scene.add(dirLight);

// Rectangular Arena Dimensions
const ARENA_W = 60;
const ARENA_L = 90;

// Arena Container Group & Obstacles Storage
const arenaGroup = new THREE.Group();
scene.add(arenaGroup);
let obstacles = []; // Solid obstacles (bones in desert)
let foliage = [];   // Visual-only cover (bushes in jungle)

// --- PROCEDURAL TEXTURE GENERATORS ---
function makeCastleTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0f0c1a'; ctx.fillRect(0, 0, 256, 256);
  ctx.strokeStyle = '#00f0ff33'; ctx.lineWidth = 4; ctx.strokeRect(0, 0, 256, 256);
  ctx.strokeStyle = '#ff00ea22'; ctx.lineWidth = 2;
  ctx.strokeRect(16, 16, 224, 224);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(ARENA_W / 6, ARENA_L / 6);
  return tex;
}

function makeDesertTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#1c1206'; ctx.fillRect(0, 0, 256, 256);
  ctx.fillStyle = '#2d1d0a';
  for (let i = 0; i < 400; i++) {
    ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
  }
  ctx.strokeStyle = '#e69a2822'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(0, 60); ctx.bezierCurveTo(90, 80, 160, 40, 256, 60); ctx.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(ARENA_W / 8, ARENA_L / 8);
  return tex;
}

function makeJungleTexture() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#07170a'; ctx.fillRect(0, 0, 256, 256);
  ctx.fillStyle = '#0f2f15';
  for (let i = 0; i < 30; i++) {
    ctx.beginPath();
    ctx.arc(Math.random() * 256, Math.random() * 256, Math.random() * 18 + 6, 0, Math.PI * 2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(ARENA_W / 8, ARENA_L / 8);
  return tex;
}

// --- DYNAMIC ARENA BUILDERS ---

// 1. Stage 1: Castle Courtyard
function buildCastleArena() {
  scene.background.setHex(0x060412);
  scene.fog.color.setHex(0x060412);
  ambLight.color.setHex(0x352850);
  dirLight.color.setHex(0x88ccff);

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(ARENA_W * 2, ARENA_L * 2),
    new THREE.MeshStandardMaterial({ map: makeCastleTexture(), roughness: 0.6, metalness: 0.3 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  arenaGroup.add(floor);

  // Glowing Rampart Perimeter Walls
  const wallMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.22, side: THREE.DoubleSide });
  const railMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
  const pylonMat = new THREE.MeshStandardMaterial({ color: 0x141028, roughness: 0.4, metalness: 0.8 });

  function addWall(x, z, w, l) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 8, l), wallMat);
    wall.position.set(x, 4, z);
    const rail = new THREE.Mesh(new THREE.BoxGeometry(w + 0.2, 0.4, l + 0.2), railMat);
    rail.position.set(x, 8, z);
    arenaGroup.add(wall, rail);
  }
  addWall(0, -ARENA_L, ARENA_W * 2, 0.8);
  addWall(0, ARENA_L, ARENA_W * 2, 0.8);
  addWall(-ARENA_W, 0, 0.8, ARENA_L * 2);
  addWall(ARENA_W, 0, 0.8, ARENA_L * 2);

  // Battlement Pylons & Neon Banners
  [[-ARENA_W, -ARENA_L], [ARENA_W, -ARENA_L], [-ARENA_W, ARENA_L], [ARENA_W, ARENA_L]].forEach(([px, pz]) => {
    const tower = new THREE.Mesh(new THREE.BoxGeometry(4, 16, 4), pylonMat);
    tower.position.set(px, 8, pz);
    const crest = new THREE.Mesh(new THREE.BoxGeometry(2, 6, 0.2), new THREE.MeshBasicMaterial({ color: 0xff00ea }));
    crest.position.set(0, 0, 2.2);
    tower.add(crest);
    arenaGroup.add(tower);
  });
}

// 2. Stage 2: Desert Wasteland (Scattered Bone Obstructions)
function buildDesertArena() {
  scene.background.setHex(0x120a04);
  scene.fog.color.setHex(0x120a04);
  ambLight.color.setHex(0x55351a);
  dirLight.color.setHex(0xffaa44);

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(ARENA_W * 2, ARENA_L * 2),
    new THREE.MeshStandardMaterial({ map: makeDesertTexture(), roughness: 0.9, metalness: 0.1 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  arenaGroup.add(floor);

  // Sandy Perimeter Energy Sand-Barriers
  const wallMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.25, side: THREE.DoubleSide });
  const railMat = new THREE.MeshBasicMaterial({ color: 0xff8800 });
  function addWall(x, z, w, l) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 8, l), wallMat);
    wall.position.set(x, 4, z);
    const rail = new THREE.Mesh(new THREE.BoxGeometry(w + 0.2, 0.4, l + 0.2), railMat);
    rail.position.set(x, 8, z);
    arenaGroup.add(wall, rail);
  }
  addWall(0, -ARENA_L, ARENA_W * 2, 0.8);
  addWall(0, ARENA_L, ARENA_W * 2, 0.8);
  addWall(-ARENA_W, 0, 0.8, ARENA_L * 2);
  addWall(ARENA_W, 0, 0.8, ARENA_L * 2);

  // Scatter Giant Bones Across Desert (Act as Solid Collision Obstacles)
  const boneMat = new THREE.MeshStandardMaterial({ color: 0xd9c8a9, roughness: 0.7 });
  for (let i = 0; i < 18; i++) {
    const boneGroup = new THREE.Group();
    const bx = (Math.random() - 0.5) * (ARENA_W * 1.6);
    const bz = (Math.random() - 0.5) * (ARENA_L * 1.6);
    // Don't spawn right in the center spawn lanes
    if (Math.hypot(bx, bz) < 14) continue;

    // Ribcage Arc
    const arc = new THREE.Mesh(new THREE.TorusGeometry(3.5, 0.65, 8, 12, Math.PI), boneMat);
    arc.rotation.z = Math.PI;
    arc.rotation.y = Math.random() * Math.PI;
    arc.position.y = 1.0;
    arc.castShadow = true;
    boneGroup.add(arc);
    boneGroup.position.set(bx, 0, bz);
    arenaGroup.add(boneGroup);

    obstacles.push({ x: bx, z: bz, radius: 3.2 });
  }
}

// 3. Stage 3: Jungle Clearing (Dense Bushes for Visual Cover)
function buildJungleArena() {
  scene.background.setHex(0x041008);
  scene.fog.color.setHex(0x041008);
  ambLight.color.setHex(0x1a4524);
  dirLight.color.setHex(0x88ff88);

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(ARENA_W * 2, ARENA_L * 2),
    new THREE.MeshStandardMaterial({ map: makeJungleTexture(), roughness: 0.8, metalness: 0.1 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  arenaGroup.add(floor);

  // Toxic Vine Energy Boundaries
  const wallMat = new THREE.MeshBasicMaterial({ color: 0x00ff66, transparent: true, opacity: 0.22, side: THREE.DoubleSide });
  const railMat = new THREE.MeshBasicMaterial({ color: 0x00ff88 });
  function addWall(x, z, w, l) {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 8, l), wallMat);
    wall.position.set(x, 4, z);
    const rail = new THREE.Mesh(new THREE.BoxGeometry(w + 0.2, 0.4, l + 0.2), railMat);
    rail.position.set(x, 8, z);
    arenaGroup.add(wall, rail);
  }
  addWall(0, -ARENA_L, ARENA_W * 2, 0.8);
  addWall(0, ARENA_L, ARENA_W * 2, 0.8);
  addWall(-ARENA_W, 0, 0.8, ARENA_L * 2);
  addWall(ARENA_W, 0, 0.8, ARENA_L * 2);

  // Foliage & Dense Bushes (Visual Cover: projectiles pass through)
  const bushMat = new THREE.MeshStandardMaterial({ color: 0x185922, roughness: 0.9, flatShading: true });
  const flowerMat = new THREE.MeshBasicMaterial({ color: 0xff0088 });

  for (let i = 0; i < 28; i++) {
    const fx = (Math.random() - 0.5) * (ARENA_W * 1.7);
    const fz = (Math.random() - 0.5) * (ARENA_L * 1.7);
    if (Math.hypot(fx, fz) < 12) continue;

    const bCluster = new THREE.Group();
    for (let j = 0; j < 3; j++) {
      const bPart = new THREE.Mesh(new THREE.DodecahedronGeometry(1.8 + Math.random() * 1.2, 1), bushMat);
      bPart.position.set((Math.random() - 0.5) * 2, 1.4 + Math.random() * 0.8, (Math.random() - 0.5) * 2);
      bPart.castShadow = true;
      bCluster.add(bPart);
    }
    const blossom = new THREE.Mesh(new THREE.OctahedronGeometry(0.6), flowerMat);
    blossom.position.set(0, 3.2, 0);
    bCluster.add(blossom);

    bCluster.position.set(fx, 0, fz);
    arenaGroup.add(bCluster);
    foliage.push(bCluster);
  }
}

// Stage Switcher Function
function loadStage(stageIndex) {
  // Clear arena geometry
  while (arenaGroup.children.length > 0) {
    arenaGroup.remove(arenaGroup.children[0]);
  }
  obstacles = [];
  foliage = [];

  const stageNum = (stageIndex % 3) + 1;
  const ind = document.getElementById('stage-indicator');

  if (stageNum === 1) {
    buildCastleArena();
    ind.innerText = "STAGE 1: CASTLE COURTYARD";
    ind.style.color = "#00f0ff";
  } else if (stageNum === 2) {
    buildDesertArena();
    ind.innerText = "STAGE 2: DESERT WASTELAND";
    ind.style.color = "#ffaa00";
  } else {
    buildJungleArena();
    ind.innerText = "STAGE 3: JUNGLE CLEARING";
    ind.style.color = "#00ff88";
  }
}

// --- CHARACTER FACTORY ---

// 1. Player Combat Mech Rig
function buildPlayerMech() {
  const root = new THREE.Group();
  const matArmor = new THREE.MeshStandardMaterial({ color: 0x1c2128, roughness: 0.4, metalness: 0.7 });
  const matCyan = new THREE.MeshStandardMaterial({ color: 0x00f0ff, roughness: 0.2, metalness: 0.5 });
  const matVisor = new THREE.MeshBasicMaterial({ color: 0x00ffff });

  const torso = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.9, 1.3), matArmor);
  torso.position.y = 2.4;
  torso.castShadow = true;
  root.add(torso);

  const chestPlating = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.2, 0.5), matCyan);
  chestPlating.position.set(0, 0.2, 0.55);
  torso.add(chestPlating);

  const head = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.75, 0.95), matArmor);
  head.position.set(0, 1.4, 0);
  const visor = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.28, 0.3), matVisor);
  visor.position.set(0, 0.05, 0.45);
  head.add(visor);
  torso.add(head);

  // Blaster Cannon
  const rArm = new THREE.Group();
  rArm.position.set(1.25, 0.4, 0);
  const cannon = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 1.4), matArmor);
  cannon.position.set(0.1, -0.3, 0.5);
  [-0.12, 0.12].forEach(ox => {
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.2, 8), matCyan);
    b.rotation.x = Math.PI / 2;
    b.position.set(ox + 0.1, -0.3, 1.4);
    rArm.add(b);
  });
  rArm.add(cannon);
  torso.add(rArm);

  // Left Arm
  const lArm = new THREE.Group();
  lArm.position.set(-1.25, 0.4, 0);
  const foreArm = new THREE.Mesh(new THREE.BoxGeometry(0.45, 1.3, 0.45), matArmor);
  foreArm.position.set(0, -0.5, 0);
  lArm.add(foreArm);
  torso.add(lArm);

  // Legs
  const legR = new THREE.Group();
  legR.position.set(0.55, 1.0, 0);
  const upperR = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.6, 0.55), matArmor);
  upperR.position.y = -0.3;
  upperR.castShadow = true;
  legR.add(upperR);

  const legL = new THREE.Group();
  legL.position.set(-0.55, 1.0, 0);
  const upperL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.6, 0.55), matArmor);
  upperL.position.y = -0.3;
  upperL.castShadow = true;
  legL.add(upperL);

  root.add(legR, legL);
  root.parts = { torso, rArm, lArm, legR, legL };
  return root;
}

// 2. Boss 1: Castle Guardian (Iron Citadel Guardian)
function buildCastleGuardian() {
  const g = new THREE.Group();
  const matHull = new THREE.MeshStandardMaterial({ color: 0x1f2438, roughness: 0.5, metalness: 0.8 });
  const matCyan = new THREE.MeshStandardMaterial({ color: 0x00d0ff, roughness: 0.3 });

  const core = new THREE.Mesh(new THREE.BoxGeometry(4.4, 3.2, 4.4), matHull);
  core.position.y = 4.2;
  core.castShadow = true;
  g.add(core);

  const crest = new THREE.Mesh(new THREE.ConeGeometry(1.6, 2.4, 4), matCyan);
  crest.rotation.y = Math.PI / 4;
  crest.position.set(0, 2.6, 0);
  core.add(crest);

  // Dual Castle Cannons
  [-1.8, 1.8].forEach(x => {
    const cannon = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 4.8, 12), matHull);
    cannon.rotation.x = Math.PI / 2;
    cannon.position.set(x, 0.2, 2.8);
    core.add(cannon);
  });

  const legs = [];
  [[-2.2, -2], [2.2, -2], [-2.2, 2], [2.2, 2]].forEach(([lx, lz]) => {
    const legPivot = new THREE.Group();
    legPivot.position.set(lx, 3.4, lz);
    const upper = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2.4, 0.9), matHull);
    upper.position.y = -1.2;
    const foot = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.6, 1.8), matCyan);
    foot.position.y = -2.4;
    legPivot.add(upper, foot);
    g.add(legPivot);
    legs.push(legPivot);
  });

  g.parts = { core, legs };
  return g;
}

// 3. Boss 2: Desert Beast (Dune Colossus)
function buildDesertBeast() {
  const g = new THREE.Group();
  const matChitin = new THREE.MeshStandardMaterial({ color: 0x3d260f, roughness: 0.8 });
  const matAmber = new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.3 });

  const body = new THREE.Mesh(new THREE.DodecahedronGeometry(2.8, 1), matChitin);
  body.position.y = 3.8;
  body.castShadow = true;
  g.add(body);

  const head = new THREE.Mesh(new THREE.ConeGeometry(1.6, 3.2, 6), matAmber);
  head.rotation.x = Math.PI / 2;
  head.position.set(0, 0.4, 3.2);
  body.add(head);

  // Spined segments
  [-1.2, 0, 1.2].forEach(sz => {
    const spine = new THREE.Mesh(new THREE.ConeGeometry(0.5, 2.2, 5), matAmber);
    spine.position.set(0, 2.2, sz);
    body.add(spine);
  });

  g.parts = { body };
  return g;
}

// 4. Boss 3: Jungle Predator (Verdant Stalker)
function buildJunglePredator() {
  const g = new THREE.Group();
  const matBark = new THREE.MeshStandardMaterial({ color: 0x142e16, roughness: 0.7 });
  const matBloom = new THREE.MeshStandardMaterial({ color: 0x00ff77, roughness: 0.2 });

  const chest = new THREE.Mesh(new THREE.BoxGeometry(4.0, 3.6, 3.0), matBark);
  chest.position.y = 4.4;
  chest.castShadow = true;
  g.add(chest);

  const skull = new THREE.Mesh(new THREE.OctahedronGeometry(1.4), matBloom);
  skull.position.set(0, 2.2, 0.6);
  chest.add(skull);

  // Scythe Talons
  [-2.8, 2.8].forEach(sx => {
    const talon = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.6, 4.4, 6), matBloom);
    talon.position.set(sx, 0.2, 1.4);
    talon.rotation.x = 0.5;
    talon.rotation.z = sx > 0 ? -0.4 : 0.4;
    chest.add(talon);
  });

  g.parts = { chest };
  return g;
}

// --- PLAYER INSTANCE ---
const player = {
  mesh: buildPlayerMech(),
  hp: 100, maxHp: 100,
  speed: 26, vy: 0,
  angle: 0, shootCooldown: 0,
  animTime: 0, radius: 1.8
};
player.mesh.position.set(0, 0, 45);
scene.add(player.mesh);

// --- HEALTH ORB DROP (15-SECOND RECOVERY) ---
let healthOrb = null;
let orbSpawnTimer = 15.0;

function spawnHealthOrb() {
  if (healthOrb) scene.remove(healthOrb.mesh);

  const root = new THREE.Group();
  const orbMesh = new THREE.Mesh(new THREE.SphereGeometry(1.2, 16, 16), new THREE.MeshBasicMaterial({ color: 0x00ffaa }));
  root.add(orbMesh);

  const ring = new THREE.Mesh(new THREE.RingGeometry(1.6, 1.9, 16), new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide }));
  ring.rotation.x = Math.PI / 2;
  root.add(ring);

  const rx = (Math.random() - 0.5) * (ARENA_W * 1.5);
  const rz = (Math.random() - 0.5) * (ARENA_L * 1.5);
  root.position.set(rx, 2.0, rz);
  scene.add(root);

  healthOrb = { mesh: root, ring, active: true, radius: 2.2, time: 0 };
}

// --- PROJECTILE FACTORY ---
const bullets = [];
const bulletGeo = new THREE.SphereGeometry(0.45, 8, 8);

function fireProjectile(origin, angle, isPlayer = false, color = 0x00f0ff, speed = 48, spread = 0) {
  const mesh = new THREE.Mesh(bulletGeo, new THREE.MeshBasicMaterial({ color }));
  mesh.position.set(origin.x, origin.y, origin.z);
  scene.add(mesh);

  const dirAngle = angle + spread;
  bullets.push({
    mesh, isPlayer,
    vx: Math.sin(dirAngle) * speed,
    vz: Math.cos(dirAngle) * speed,
    life: 3.0
  });
}

// --- BOSS LOGIC & PROGRESSION ---
let bossesDefeated = 0;
let bestStreak = parseInt(localStorage.getItem('shootout_best') || '0');
document.getElementById('best-text').innerText = `BEST: ${bestStreak}`;

let currentBoss = null;
const bossDefs = [
  { name: "IRON CITADEL GUARDIAN", type: 0, build: buildCastleGuardian, maxHp: 220, speed: 7.0, radius: 4.4 },
  { name: "DUNE COLOSSUS", type: 1, build: buildDesertBeast, maxHp: 320, speed: 12.0, radius: 3.6 },
  { name: "VERDANT STALKER", type: 2, build: buildJunglePredator, maxHp: 480, speed: 9.0, radius: 4.4 }
];

function spawnNextBoss() {
  if (currentBoss && currentBoss.mesh) scene.remove(currentBoss.mesh);

  const cycle = Math.floor(bossesDefeated / bossDefs.length);
  const def = bossDefs[bossesDefeated % bossDefs.length];
  const hpBonus = cycle * 160;

  const mesh = def.build();
  mesh.position.set(0, 0, -55);
  scene.add(mesh);

  currentBoss = {
    ...def,
    mesh,
    maxHp: def.maxHp + hpBonus,
    hp: def.maxHp + hpBonus,
    attackTimer: 1.2,
    chargeTimer: 0,
    stateTimer: 0
  };

  document.getElementById('boss-name').innerText = currentBoss.name + (cycle > 0 ? ` MK-${cycle + 1}` : "");
  document.getElementById('hp-boss-bar').style.width = '100%';
}

// Scene Transition Handler
function triggerStageTransition() {
  const fade = document.getElementById('stage-fade');
  fade.style.opacity = '1';
  playFx('warp');

  setTimeout(() => {
    loadStage(bossesDefeated);
    bullets.forEach(b => scene.remove(b.mesh));
    bullets.length = 0;
    spawnNextBoss();
    player.mesh.position.set(0, 0, 45);

    fade.style.opacity = '0';
    showToast(`STAGE ${(bossesDefeated % 3) + 1} COMMENCED!`);
  }, 480);
}

// --- CONTROLS INTERACTION ---
const input = { forward: 0, right: 0 };
let isMouseDown = false;

function jump() {
  if (player.mesh.position.y <= 0.05) {
    player.vy = 12.0;
  }
}

function shoot() {
  if (player.shootCooldown <= 0) {
    const spawnPos = new THREE.Vector3(
      player.mesh.position.x + Math.sin(player.angle) * 1.5,
      2.0,
      player.mesh.position.z + Math.cos(player.angle) * 1.5
    );
    fireProjectile(spawnPos, player.angle, true, 0x00f0ff, 54);
    player.shootCooldown = 0.16;
    playFx('laser');
  }
}

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 820;

if (isMobile) {
  document.getElementById('mobile-ui').style.display = 'block';
  document.getElementById('desktop-legend').style.display = 'none';

  const sBtn = document.getElementById('btn-shoot');
  let autoShoot = null;
  sBtn.addEventListener('touchstart', (e) => {
    e.preventDefault(); shoot();
    autoShoot = setInterval(shoot, 160);
  });
  sBtn.addEventListener('touchend', () => clearInterval(autoShoot));

  document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
    e.preventDefault(); jump();
  });

  const joyZone = document.getElementById('joystick-zone');
  const joyThumb = document.getElementById('joystick-thumb');
  let touchId = null, baseRect = null;

  joyZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    touchId = e.changedTouches[0].identifier;
    baseRect = joyZone.getBoundingClientRect();
  });

  window.addEventListener('touchmove', (e) => {
    if (touchId === null) return;
    for (let t of e.changedTouches) {
      if (t.identifier === touchId) {
        const dx = t.clientX - (baseRect.left + baseRect.width / 2);
        const dy = t.clientY - (baseRect.top + baseRect.height / 2);
        const dist = Math.min(50, Math.hypot(dx, dy));
        const angle = Math.atan2(dy, dx);

        joyThumb.style.transform = `translate(calc(-50% + ${Math.cos(angle) * dist}px), calc(-50% + ${Math.sin(angle) * dist}px))`;
        input.right = (Math.cos(angle) * dist) / 50;
        input.forward = -(Math.sin(angle) * dist) / 50;
      }
    }
  }, { passive: false });

  const endJoy = (e) => {
    for (let t of e.changedTouches) {
      if (t.identifier === touchId) {
        touchId = null;
        joyThumb.style.transform = `translate(-50%, -50%)`;
        input.forward = 0; input.right = 0;
      }
    }
  };
  window.addEventListener('touchend', endJoy);
  window.addEventListener('touchcancel', endJoy);

} else {
  // Desktop Controls: WASD + Space + Mouse Click OR Shift / Enter
  const keys = {};

  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.key === 'Shift' || e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.key === 'Enter' || e.code === 'Enter') {
      keys['FireKey'] = true;
      shoot();
    }
    if (e.code === 'Space') jump();
  });

  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
    if (e.key === 'Shift' || e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.key === 'Enter' || e.code === 'Enter') {
      keys['FireKey'] = false;
    }
  });

  window.addEventListener('mousemove', (e) => {
    const dx = e.clientX - window.innerWidth / 2;
    const dy = e.clientY - window.innerHeight / 2;
    player.angle = Math.atan2(-dx, -dy);
  });

  window.addEventListener('mousedown', (e) => {
    if (e.button === 0) { isMouseDown = true; shoot(); }
  });

  window.addEventListener('mouseup', (e) => {
    if (e.button === 0) isMouseDown = false;
  });

  function pollDesktop() {
    input.forward = (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0);
    input.right   = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);
    if (keys['FireKey'] || isMouseDown) shoot();
  }
}

// --- DAMAGE, HEALING, & INSTANT RESET ---
function takeDamage(amt) {
  player.hp -= amt;
  playFx('hit');
  const flash = document.getElementById('screen-flash');
  flash.style.opacity = '1';
  setTimeout(() => flash.style.opacity = '0', 70);

  if (player.hp <= 0) {
    playFx('explode');
    resetGame();
  }
}

function healPlayer(pct) {
  const add = player.maxHp * pct;
  player.hp = Math.min(player.maxHp, player.hp + add);
  playFx('heal');
  showToast("+20% VITALITY RESTORED!");
}

function resetGame() {
  player.hp = player.maxHp;
  player.mesh.position.set(0, 0, 45);
  player.vy = 0;
  bossesDefeated = 0;
  orbSpawnTimer = 15.0;
  document.getElementById('score-text').innerText = `CONQUERED: 0`;
  bullets.forEach(b => scene.remove(b.mesh));
  bullets.length = 0;
  if (healthOrb) { scene.remove(healthOrb.mesh); healthOrb = null; }
  loadStage(0);
  spawnNextBoss();
}

// --- ENGINE LOOP ---
let lastFrameTime = performance.now();
loadStage(0);
spawnNextBoss();

function update(dt) {
  if (!isMobile) pollDesktop();

  // 1. Move Player
  const moveMag = Math.hypot(input.forward, input.right);
  if (moveMag > 0.05) {
    const normF = input.forward / Math.max(1, moveMag);
    const normR = input.right / Math.max(1, moveMag);

    const nextX = player.mesh.position.x + normR * player.speed * dt;
    const nextZ = player.mesh.position.z - normF * player.speed * dt;

    // Check Solid Obstacle Collision (Desert Bones)
    let blocked = false;
    for (let obs of obstacles) {
      if (Math.hypot(nextX - obs.x, nextZ - obs.z) < player.radius + obs.radius) {
        blocked = true; break;
      }
    }

    if (!blocked) {
      player.mesh.position.x = nextX;
      player.mesh.position.z = nextZ;
    }

    if (isMobile) player.angle = Math.atan2(-normR, normF);

    player.animTime += dt * 14;
    player.mesh.parts.legR.rotation.x = Math.sin(player.animTime) * 0.55;
    player.mesh.parts.legL.rotation.x = -Math.sin(player.animTime) * 0.55;
    player.mesh.parts.lArm.rotation.x = Math.sin(player.animTime) * 0.4;
  } else {
    player.mesh.parts.legR.rotation.x = 0;
    player.mesh.parts.legL.rotation.x = 0;
    player.mesh.parts.lArm.rotation.x = 0;
  }

  // Constrain Arena Perimeter
  player.mesh.position.x = Math.max(-ARENA_W + 2, Math.min(ARENA_W - 2, player.mesh.position.x));
  player.mesh.position.z = Math.max(-ARENA_L + 2, Math.min(ARENA_L - 2, player.mesh.position.z));

  // Jumping Physics
  player.mesh.position.y += player.vy * dt;
  if (player.mesh.position.y > 0) {
    player.vy -= 30 * dt;
  } else {
    player.mesh.position.y = 0;
    player.vy = 0;
  }
  player.mesh.rotation.y = player.angle;
  player.shootCooldown -= dt;

  // 2. Camera Tracking
  camera.position.x = player.mesh.position.x;
  camera.position.y = player.mesh.position.y + 16;
  camera.position.z = player.mesh.position.z + 24;
  camera.lookAt(player.mesh.position.x, player.mesh.position.y + 3.0, player.mesh.position.z - 8);

  // 3. Health Orb Lifecycle
  orbSpawnTimer -= dt;
  if (orbSpawnTimer <= 0) {
    spawnHealthOrb();
    orbSpawnTimer = 15.0;
  }

  if (healthOrb && healthOrb.active) {
    healthOrb.time += dt;
    healthOrb.mesh.position.y = 2.0 + Math.sin(healthOrb.time * 3) * 0.4;
    healthOrb.ring.rotation.z += dt * 2.5;

    const distToOrb = Math.hypot(
      player.mesh.position.x - healthOrb.mesh.position.x,
      player.mesh.position.z - healthOrb.mesh.position.z
    );

    if (distToOrb < player.radius + healthOrb.radius) {
      healPlayer(0.20);
      scene.remove(healthOrb.mesh);
      healthOrb = null;
    }
  }

  // 4. Boss AI Behaviors & Patterns
  if (currentBoss) {
    const toPlayer = new THREE.Vector3().subVectors(player.mesh.position, currentBoss.mesh.position);
    const dist = toPlayer.length();
    toPlayer.y = 0;
    toPlayer.normalize();

    currentBoss.attackTimer -= dt;
    currentBoss.stateTimer += dt;

    const targetAngle = Math.atan2(toPlayer.x, toPlayer.z);
    currentBoss.mesh.rotation.y = targetAngle;

    if (currentBoss.type === 0) { // Castle Guardian
      if (dist > 18) {
        currentBoss.mesh.position.x += toPlayer.x * currentBoss.speed * dt;
        currentBoss.mesh.position.z += toPlayer.z * currentBoss.speed * dt;
      }
      currentBoss.mesh.parts.legs.forEach((l, i) => {
        l.rotation.x = Math.sin(currentBoss.stateTimer * 6 + i) * 0.4;
      });

      if (currentBoss.attackTimer <= 0) {
        for (let s = -0.35; s <= 0.35; s += 0.35) {
          const spawnB = new THREE.Vector3(currentBoss.mesh.position.x, 3.8, currentBoss.mesh.position.z);
          fireProjectile(spawnB, targetAngle, false, 0xff0055, 26, s);
        }
        playFx('boss_shot');
        currentBoss.attackTimer = 1.3;
      }
    } 
    else if (currentBoss.type === 1) { // Desert Beast (Dune Colossus)
      const strafeX = -toPlayer.z;
      const strafeZ = toPlayer.x;
      const strafeDir = Math.sin(currentBoss.stateTimer * 2) > 0 ? 1 : -1;

      currentBoss.mesh.position.x += (toPlayer.x * 0.4 + strafeX * strafeDir) * currentBoss.speed * dt;
      currentBoss.mesh.position.z += (toPlayer.z * 0.4 + strafeZ * strafeDir) * currentBoss.speed * dt;
      currentBoss.mesh.position.y = 3.5 + Math.sin(currentBoss.stateTimer * 4) * 0.6;

      if (currentBoss.attackTimer <= 0) {
        const spawnB = new THREE.Vector3(currentBoss.mesh.position.x, 2.5, currentBoss.mesh.position.z);
        fireProjectile(spawnB, targetAngle, false, 0xffbb00, 38, (Math.random() - 0.5) * 0.15);
        playFx('boss_shot');
        currentBoss.attackTimer = 0.36;
      }
    } 
    else if (currentBoss.type === 2) { // Jungle Predator (Verdant Stalker)
      if (currentBoss.chargeTimer > 0) {
        currentBoss.chargeTimer -= dt;
        currentBoss.mesh.position.x += toPlayer.x * 24 * dt;
        currentBoss.mesh.position.z += toPlayer.z * 24 * dt;
      } else {
        currentBoss.mesh.position.x += toPlayer.x * currentBoss.speed * dt;
        currentBoss.mesh.position.z += toPlayer.z * currentBoss.speed * dt;
      }

      if (currentBoss.attackTimer <= 0) {
        const spawnB = new THREE.Vector3(currentBoss.mesh.position.x, 2.5, currentBoss.mesh.position.z);
        for (let i = 0; i < 14; i++) {
          fireProjectile(spawnB, (i / 14) * Math.PI * 2, false, 0x00ff88, 22);
        }
        playFx('boss_shot');
        currentBoss.chargeTimer = 1.0;
        currentBoss.attackTimer = 2.4;
      }
    }

    currentBoss.mesh.position.x = Math.max(-ARENA_W + 4, Math.min(ARENA_W - 4, currentBoss.mesh.position.x));
    currentBoss.mesh.position.z = Math.max(-ARENA_L + 4, Math.min(ARENA_L - 4, currentBoss.mesh.position.z));
  }

  // 5. Accurate Bullet Hit Collisions
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.mesh.position.x += b.vx * dt;
    b.mesh.position.z += b.vz * dt;
    b.life -= dt;

    if (Math.abs(b.mesh.position.x) >= ARENA_W || Math.abs(b.mesh.position.z) >= ARENA_L || b.life <= 0) {
      scene.remove(b.mesh);
      bullets.splice(i, 1);
      continue;
    }

    // Player Bullet -> Hits Boss
    if (b.isPlayer && currentBoss) {
      const distXZ = Math.hypot(
        b.mesh.position.x - currentBoss.mesh.position.x,
        b.mesh.position.z - currentBoss.mesh.position.z
      );

      if (distXZ < currentBoss.radius) {
        currentBoss.hp -= 12;
        scene.remove(b.mesh);
        bullets.splice(i, 1);

        if (currentBoss.hp <= 0) {
          playFx('explode');
          bossesDefeated++;
          document.getElementById('score-text').innerText = `CONQUERED: ${bossesDefeated}`;
          if (bossesDefeated > bestStreak) {
            bestStreak = bossesDefeated;
            localStorage.setItem('shootout_best', bestStreak);
            document.getElementById('best-text').innerText = `BEST: ${bestStreak}`;
          }
          triggerStageTransition();
        }
        continue;
      }
    }

    // Boss Bullet -> Hits Player
    if (!b.isPlayer) {
      const distXZ = Math.hypot(
        b.mesh.position.x - player.mesh.position.x,
        b.mesh.position.z - player.mesh.position.z
      );

      if (distXZ < player.radius) {
        takeDamage(12);
        scene.remove(b.mesh);
        bullets.splice(i, 1);
        continue;
      }
    }
  }

  // 6. Update Vitality Bars
  document.getElementById('hp-player-bar').style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
  if (currentBoss) {
    document.getElementById('hp-boss-bar').style.width = Math.max(0, (currentBoss.hp / currentBoss.maxHp) * 100) + '%';
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastFrameTime) / 1000, 0.08);
  lastFrameTime = now;
  update(dt);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
