<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title> Boss Rush</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body { background: #000; overflow: hidden; font-family: monospace; color: #fff; }
  canvas { display: block; width: 100vw; height: 100vh; }
  
  /* HUD */
  #hud {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 90%; max-width: 500px; display: flex; flex-direction: column; gap: 6px;
    pointer-events: none; z-index: 10;
  }
  .bar-wrap { background: rgba(0,0,0,0.6); border: 2px solid #555; height: 16px; border-radius: 8px; overflow: hidden; position: relative; }
  .bar-fill { height: 100%; transition: width 0.1s linear; }
  #hp-player { background: #00ff88; width: 100%; }
  #hp-boss { background: #ff0055; width: 100%; }
  .bar-text { position: absolute; inset: 0; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; text-shadow: 1px 1px 2px #000; }
  #stats { display: flex; justify-content: space-between; font-size: 14px; text-shadow: 0 0 5px #00f0ff; }

  /* Mobile Controls */
  #mobile-ui { display: none; position: absolute; inset: 0; pointer-events: none; z-index: 20; }
  .touch-btn {
    pointer-events: auto; position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4);
    background: rgba(0,0,0,0.35); color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: bold; touch-action: none;
  }
  #btn-shoot { left: 24px; bottom: 30px; width: 75px; height: 75px; border-color: #ff0055; background: rgba(255,0,85,0.2); }
  #btn-jump { right: 40px; bottom: 150px; width: 55px; height: 55px; border-color: #00ff88; background: rgba(0,255,136,0.2); }
  #joystick-base {
    right: 25px; bottom: 25px; width: 110px; height: 110px; position: absolute; border-radius: 50%;
    border: 2px dashed rgba(255,255,255,0.3); pointer-events: auto; touch-action: none;
  }
  #joystick-stick {
    width: 44px; height: 44px; border-radius: 50%; background: #00f0ff; position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="hud">
  <div id="stats">
    <span id="score-text">BOSSES DEFEATED: 0</span>
    <span id="best-text">BEST: 0</span>
  </div>
  <div class="bar-wrap">
    <div id="hp-player" class="bar-fill"></div>
    <div class="bar-text">PLAYER</div>
  </div>
  <div class="bar-wrap">
    <div id="hp-boss" class="bar-fill"></div>
    <div id="boss-name" class="bar-text">TITAN PRIME</div>
  </div>
</div>

<div id="mobile-ui">
  <div id="btn-shoot" class="touch-btn">FIRE</div>
  <div id="btn-jump" class="touch-btn">JUMP</div>
  <div id="joystick-base"><div id="joystick-stick"></div></div>
</div>

<script>
// --- AUDIO SYNTHESIS (No external files needed) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  if (type === 'shoot') {
    osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
    gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.1);
    osc.start(now); osc.stop(now + 0.1);
  } else if (type === 'hit') {
    osc.type = 'square'; osc.frequency.setValueAtTime(140, now); osc.frequency.linearRampToValueAtTime(30, now + 0.15);
    gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.15);
    osc.start(now); osc.stop(now + 0.15);
  } else if (type === 'boss_hit') {
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(80, now); osc.frequency.linearRampToValueAtTime(30, now + 0.2);
    gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
    osc.start(now); osc.stop(now + 0.2);
  }
}

// --- SETUP THREE.JS SCENE ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06060c);
scene.fog = new THREE.FogExp2(0x06060c, 0.025);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const light = new THREE.DirectionalLight(0xffffff, 0.9);
light.position.set(20, 40, 20);
light.castShadow = true;
scene.add(light);
scene.add(new THREE.AmbientLight(0x404070));

// Arena (Radius: 40)
const ARENA_R = 40;
const floorGeo = new THREE.CylinderGeometry(ARENA_R, ARENA_R, 2, 32);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x141422, roughness: 0.8 });
const arenaFloor = new THREE.Mesh(floorGeo, floorMat);
arenaFloor.position.y = -1;
arenaFloor.receiveShadow = true;
scene.add(arenaFloor);

const ringGeo = new THREE.RingGeometry(ARENA_R - 0.5, ARENA_R + 0.5, 64);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide });
const arenaRing = new THREE.Mesh(ringGeo, ringMat);
arenaRing.rotation.x = Math.PI / 2;
scene.add(arenaRing);

// --- SHARED INPUT & CONTROL ACTIONS ---
const input = { forward: 0, right: 0 };
let jumping = false;

function moveForward(v = 1) { input.forward = v; }
function moveBack(v = 1)    { input.forward = -v; }
function moveLeft(v = 1)    { input.right = -v; }
function moveRight(v = 1)   { input.right = v; }
function jump() {
  if (player.mesh.position.y <= 1.05) {
    player.vy = 8.5;
  }
}
function shoot() {
  if (player.shootCooldown <= 0) {
    spawnBullet(player.mesh.position, player.angle, true, 0x00ffff);
    player.shootCooldown = 0.18;
    playSound('shoot');
  }
}

// --- PLAYER ---
const player = {
  mesh: new THREE.Group(),
  hp: 100, maxHp: 100,
  speed: 16, vy: 0,
  angle: 0, shootCooldown: 0
};

const pBody = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.8, 1.2), new THREE.MeshStandardMaterial({ color: 0x00ff88 }));
pBody.castShadow = true;
const pVisor = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 0.3), new THREE.MeshBasicMaterial({ color: 0xffffff }));
pVisor.position.set(0, 0.4, -0.6);
player.mesh.add(pBody, pVisor);
player.mesh.position.set(0, 0.9, 20);
scene.add(player.mesh);

// --- BOSSES & BEHAVIOR ---
let bossIndex = 0;
let bossesDefeated = 0;
let bestScore = parseInt(localStorage.getItem('br_best') || '0');
document.getElementById('best-text').innerText = `BEST: ${bestScore}`;

const bossTemplates = [
  { name: "TITAN PRIME", color: 0xff0055, scale: 2.4, hp: 120, speed: 4, type: 0 },
  { name: "VOLT PHANTOM", color: 0xffbb00, scale: 1.8, hp: 200, speed: 8, type: 1 },
  { name: "VOID COLOSSUS", color: 0xa000ff, scale: 3.2, hp: 350, speed: 3.5, type: 2 }
];

let boss = null;
function spawnBoss() {
  if (boss && boss.mesh) scene.remove(boss.mesh);
  const tmpl = bossTemplates[bossIndex % bossTemplates.length];
  const hpBoost = Math.floor(bossIndex / 3) * 100;
  
  const mesh = new THREE.Mesh(
    new THREE.DodecahedronGeometry(tmpl.scale, 1),
    new THREE.MeshStandardMaterial({ color: tmpl.color, roughness: 0.3, metalness: 0.2 })
  );
  mesh.castShadow = true;
  mesh.position.set(0, tmpl.scale, -20);
  scene.add(mesh);

  boss = {
    ...tmpl,
    maxHp: tmpl.hp + hpBoost,
    hp: tmpl.hp + hpBoost,
    mesh,
    stateTimer: 0,
    actionTimer: 0,
    targetPos: new THREE.Vector3()
  };
  document.getElementById('boss-name').innerText = boss.name + (bossIndex >= 3 ? ` MK-${Math.floor(bossIndex/3)+1}` : "");
}

// --- PROJECTILES ---
const bullets = [];
const bulletGeo = new THREE.SphereGeometry(0.3, 8, 8);
function spawnBullet(origin, angle, isPlayer = false, color = 0xffff00, speed = 32, spread = 0) {
  const mesh = new THREE.Mesh(bulletGeo, new THREE.MeshBasicMaterial({ color }));
  mesh.position.copy(origin);
  mesh.position.y = 1.0;
  scene.add(mesh);
  
  const actualAngle = angle + spread;
  bullets.push({
    mesh, isPlayer,
    vx: Math.sin(actualAngle) * speed,
    vz: Math.cos(actualAngle) * speed,
    life: 3.0
  });
}

// --- DEVICE DETECTION & INPUT HOOKS ---
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 800;

if (isMobile) {
  document.getElementById('mobile-ui').style.display = 'block';

  // Shoot Button
  const shootBtn = document.getElementById('btn-shoot');
  let shootInterval;
  shootBtn.addEventListener('touchstart', (e) => {
    e.preventDefault(); shoot();
    shootInterval = setInterval(shoot, 180);
  });
  shootBtn.addEventListener('touchend', () => clearInterval(shootInterval));

  // Jump Button
  document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
    e.preventDefault(); jump();
  });

  // Joystick (Right Side)
  const base = document.getElementById('joystick-base');
  const stick = document.getElementById('joystick-stick');
  let touchId = null, baseRect = null;

  base.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.changedTouches[0];
    touchId = touch.identifier;
    baseRect = base.getBoundingClientRect();
  });

  window.addEventListener('touchmove', (e) => {
    if (touchId === null) return;
    for (let t of e.changedTouches) {
      if (t.identifier === touchId) {
        const dx = t.clientX - (baseRect.left + baseRect.width / 2);
        const dy = t.clientY - (baseRect.top + baseRect.height / 2);
        const dist = Math.min(45, Math.hypot(dx, dy));
        const angle = Math.atan2(dy, dx);
        
        stick.style.transform = `translate(calc(-50% + ${Math.cos(angle) * dist}px), calc(-50% + ${Math.sin(angle) * dist}px))`;
        input.right = (Math.cos(angle) * dist) / 45;
        input.forward = -(Math.sin(angle) * dist) / 45;
      }
    }
  }, { passive: false });

  const endJoystick = (e) => {
    for (let t of e.changedTouches) {
      if (t.identifier === touchId) {
        touchId = null;
        stick.style.transform = `translate(-50%, -50%)`;
        input.forward = 0; input.right = 0;
      }
    }
  };
  window.addEventListener('touchend', endJoystick);
  window.addEventListener('touchcancel', endJoystick);

} else {
  // Desktop Keyboard (WASD)
  const keys = {};
  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.code === 'Space') jump();
  });
  window.addEventListener('keyup', (e) => keys[e.code] = false);

  window.addEventListener('mousemove', (e) => {
    const dx = e.clientX - window.innerWidth / 2;
    const dy = e.clientY - window.innerHeight / 2;
    player.angle = Math.atan2(-dx, -dy);
  });

  window.addEventListener('mousedown', (e) => {
    if (e.button === 0) shoot();
  });

  function pollDesktopKeys() {
    input.forward = (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0);
    input.right   = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);
  }
}

// --- MAIN GAME LOOP ---
function resetGame() {
  player.hp = player.maxHp;
  player.mesh.position.set(0, 0.9, 20);
  player.vy = 0;
  bossIndex = 0;
  bossesDefeated = 0;
  document.getElementById('score-text').innerText = `BOSSES DEFEATED: 0`;
  bullets.forEach(b => scene.remove(b.mesh));
  bullets.length = 0;
  spawnBoss();
}

let lastTime = performance.now();
spawnBoss();

function update(dt) {
  if (!isMobile) pollDesktopKeys();

  // 1. Move Player
  const moveMag = Math.hypot(input.forward, input.right);
  if (moveMag > 0.05) {
    const normF = input.forward / Math.max(1, moveMag);
    const normR = input.right / Math.max(1, moveMag);
    
    player.mesh.position.x += normR * player.speed * dt;
    player.mesh.position.z -= normF * player.speed * dt;

    if (isMobile) player.angle = Math.atan2(-normR, normF);
  }

  // Constrain Arena Limits
  const pDist = Math.hypot(player.mesh.position.x, player.mesh.position.z);
  if (pDist > ARENA_R - 1) {
    player.mesh.position.x *= (ARENA_R - 1) / pDist;
    player.mesh.position.z *= (ARENA_R - 1) / pDist;
  }

  // Gravity / Jump
  player.mesh.position.y += player.vy * dt;
  if (player.mesh.position.y > 0.9) {
    player.vy -= 22 * dt;
  } else {
    player.mesh.position.y = 0.9;
    player.vy = 0;
  }
  player.mesh.rotation.y = player.angle;
  player.shootCooldown -= dt;

  // 2. Camera Tracking (Third Person)
  camera.position.x = player.mesh.position.x;
  camera.position.y = player.mesh.position.y + 14;
  camera.position.z = player.mesh.position.z + 18;
  camera.lookAt(player.mesh.position.x, player.mesh.position.y + 1, player.mesh.position.z);

  // 3. Update Boss
  if (boss) {
    const toPlayer = new THREE.Vector3().subVectors(player.mesh.position, boss.mesh.position);
    const distToP = toPlayer.length();
    toPlayer.normalize();

    boss.mesh.rotation.y += 1.2 * dt;
    boss.actionTimer -= dt;

    // Movement toward player (unless too close)
    if (distToP > 5) {
      boss.mesh.position.x += toPlayer.x * boss.speed * dt;
      boss.mesh.position.z += toPlayer.z * boss.speed * dt;
    }

    // Boss Attack Patterns
    if (boss.actionTimer <= 0) {
      const bAngle = Math.atan2(toPlayer.x, toPlayer.z);

      if (boss.type === 0) { // Spread Shots
        for (let a = -0.3; a <= 0.3; a += 0.3) {
          spawnBullet(boss.mesh.position, bAngle, false, 0xff0055, 18, a);
        }
        boss.actionTimer = 1.6;
      } 
      else if (boss.type === 1) { // Rapid Stream + Fast Dash
        spawnBullet(boss.mesh.position, bAngle, false, 0xffbb00, 26, (Math.random() - 0.5) * 0.2);
        boss.actionTimer = 0.35;
      } 
      else if (boss.type === 2) { // Nova Area Attack
        for (let i = 0; i < 12; i++) {
          spawnBullet(boss.mesh.position, (i / 12) * Math.PI * 2, false, 0xa000ff, 15);
        }
        boss.actionTimer = 2.0;
      }
    }
  }

  // 4. Update Projectiles
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.mesh.position.x += b.vx * dt;
    b.mesh.position.z += b.vz * dt;
    b.life -= dt;

    // Arena Boundary Check
    if (Math.hypot(b.mesh.position.x, b.mesh.position.z) > ARENA_R || b.life <= 0) {
      scene.remove(b.mesh);
      bullets.splice(i, 1);
      continue;
    }

    // Player Bullet -> Hits Boss
    if (b.isPlayer && boss) {
      if (b.mesh.position.distanceTo(boss.mesh.position) < boss.scale) {
        boss.hp -= 10;
        playSound('boss_hit');
        scene.remove(b.mesh);
        bullets.splice(i, 1);

        if (boss.hp <= 0) {
          bossesDefeated++;
          document.getElementById('score-text').innerText = `BOSSES DEFEATED: ${bossesDefeated}`;
          if (bossesDefeated > bestScore) {
            bestScore = bossesDefeated;
            localStorage.setItem('br_best', bestScore);
            document.getElementById('best-text').innerText = `BEST: ${bestScore}`;
          }
          bossIndex++;
          spawnBoss();
        }
        continue;
      }
    }

    // Boss Bullet -> Hits Player
    if (!b.isPlayer) {
      if (b.mesh.position.distanceTo(player.mesh.position) < 1.2) {
        player.hp -= 12;
        playSound('hit');
        scene.remove(b.mesh);
        bullets.splice(i, 1);

        if (player.hp <= 0) resetGame();
        continue;
      }
    }
  }

  // 5. Update HUD Bars
  document.getElementById('hp-player').style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
  if (boss) {
    document.getElementById('hp-boss').style.width = Math.max(0, (boss.hp / boss.maxHp) * 100) + '%';
  }
}

function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  update(dt);
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
